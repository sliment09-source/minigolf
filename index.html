<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minigolf – skóre</title>
<meta name="description" content="Zápis skóre na 18 jamek, průběžné pořadí a historie her.">
<meta name="theme-color" content="#0F6B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minigolf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F6B45'/><circle cx='50' cy='62' r='16' fill='%23F7F9F7'/><rect x='44' y='16' width='7' height='40' fill='%23F7F9F7'/><path d='M51 18 L78 26 L51 34 Z' fill='%23D3312B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   VZHLED
   Dvě nezávislé volby:
     data-styl  = trávník (výchozí) | stadion | papir | bloky | fotka
     data-tmavy = nastaví JavaScript podle volby světlá/tmavá/podle systému
   ══════════════════════════════════════════════════════════════ */
:root{
  --display:"Anton","Haettenschweiler","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:12px; --r:16px; --r-l:22px;
  --hrana:1px;

  /* ── Trávník, světlá ── */
  --ink:#14231B;
  --ink-soft:#5F7266;
  --cobalt:#0F6B45;
  --cobalt-dk:#0A4E32;
  --turf:#2E9463;
  --signal:#DC5741;
  --sun:#E9B426;
  --paper:#EDF2E8;
  --card:#FCFDFA;
  --line:#DFE7DA;
  --tile:#FCFDFA;
  --obrys:rgba(16,34,46,.05);
  --shadow:0 2px 6px rgba(16,34,46,.06), 0 10px 24px -14px rgba(16,34,46,.4);
  --shadow-s:0 1px 2px rgba(16,34,46,.05), 0 1px 1px rgba(16,34,46,.03);
  --pozadi:
    radial-gradient(130% 60% at 78% -12%, rgba(255,255,255,.85), rgba(255,255,255,0) 60%),
    repeating-linear-gradient(96deg, rgba(15,107,69,.055) 0 46px, rgba(15,107,69,.015) 46px 92px),
    radial-gradient(120% 80% at 50% 120%, rgba(15,107,69,.10), rgba(15,107,69,0) 70%);
  --pozadi-velikost:auto;
}
/* ── Trávník, tmavá ── */
html[data-tmavy]{
  --ink:#E7EFE8; --ink-soft:#8CA396;
  --cobalt:#3BAE74; --cobalt-dk:#2C8659;
  --turf:#4FC189; --signal:#F0705A; --sun:#F2C749;
  --paper:#0C1511; --card:#16211A; --line:#27352C; --tile:#16211A;
  --obrys:rgba(255,255,255,.07);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.8);
  --shadow-s:0 1px 2px rgba(0,0,0,.35);
  --pozadi:
    radial-gradient(130% 60% at 78% -12%, rgba(79,193,137,.10), rgba(0,0,0,0) 58%),
    repeating-linear-gradient(96deg, rgba(255,255,255,.028) 0 46px, rgba(255,255,255,0) 46px 92px);
}

/* ══ Modrá s fotkou – původní vzhled i s obrázkem na pozadí ══ */
html[data-styl="fotka"]{
  --ink:#10222E; --ink-soft:#5C7180;
  --cobalt:#14508C; --cobalt-dk:#0E3A69;
  --turf:#2E7D4F; --signal:#D3312B; --sun:#F2B417;
  --paper:#EDF1F0; --card:#FFFFFF; --line:#D4DCDA; --tile:#FFFFFF;
  --obrys:rgba(16,34,46,.05);
  --shadow:0 2px 6px rgba(16,34,46,.06), 0 10px 24px -14px rgba(16,34,46,.4);
  --shadow-s:0 1px 2px rgba(16,34,46,.05), 0 1px 1px rgba(16,34,46,.03);
  --pozadi:linear-gradient(rgba(237,241,240,.86), rgba(237,241,240,.86)), url("bg.webp") center top / cover no-repeat;
}
html[data-styl="fotka"][data-tmavy]{
  --ink:#E8EEF1; --ink-soft:#93A7B3;
  --cobalt:#3B84D0; --cobalt-dk:#2A6AAF;
  --turf:#49A46E; --signal:#EC5B54; --sun:#F5C43F;
  --paper:#0D1920; --card:#152430; --line:#273C4A; --tile:#152430;
  --obrys:rgba(255,255,255,.07);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.8);
  --shadow-s:0 1px 2px rgba(0,0,0,.35);
  --pozadi:linear-gradient(rgba(13,25,32,.90), rgba(13,25,32,.90)), url("bg.webp") center top / cover no-repeat;
}

/* ══ Noční stadion – vždy tmavý, svítivý akcent ══ */
html[data-styl="stadion"],
html[data-styl="stadion"][data-tmavy]{
  --ink:#F2F5F7; --ink-soft:#7C8894;
  --cobalt:#C6F24E; --cobalt-dk:#A9D833;
  --turf:#7FD94F; --signal:#FF5A47; --sun:#F2C744;
  --paper:#0A0C0F; --card:#12161B; --line:#232A33; --tile:#12161B;
  --obrys:rgba(255,255,255,.06);
  --shadow:0 2px 10px rgba(0,0,0,.5);
  --shadow-s:0 1px 3px rgba(0,0,0,.45);
  --r-s:10px; --r:13px; --r-l:18px;
  --pozadi:
    radial-gradient(90% 45% at 50% -10%, rgba(198,242,78,.10), rgba(0,0,0,0) 60%),
    radial-gradient(70% 40% at 50% 110%, rgba(198,242,78,.05), rgba(0,0,0,0) 60%);
}
html[data-styl="stadion"] .btn:not(.ghost):not(.danger),
html[data-styl="stadion"] .tab.on,
html[data-styl="stadion"] .pchip.active,
html[data-styl="stadion"] .key.sel,
html[data-styl="stadion"] .spodek .on{color:#0A0C0F}

/* ══ Papírová karta ══ */
html[data-styl="papir"]{
  --ink:#2C2822; --ink-soft:#7A6F5D;
  --cobalt:#B23A2E; --cobalt-dk:#8E2C22;
  --turf:#4A6B3F; --signal:#B23A2E; --sun:#C8912B;
  --paper:#EFE9DB; --card:#FBF7EF; --line:#DDD3BF; --tile:#FBF7EF;
  --obrys:rgba(90,78,58,.14);
  --shadow:0 1px 2px rgba(70,60,42,.10);
  --shadow-s:0 1px 1px rgba(70,60,42,.07);
  --r-s:5px; --r:7px; --r-l:9px;
  --pozadi:radial-gradient(rgba(120,105,80,.10) 1px, transparent 1px);
  --pozadi-velikost:4px 4px;
}
html[data-styl="papir"][data-tmavy]{
  --ink:#EDE5D4; --ink-soft:#A2957C;
  --cobalt:#E0715F; --cobalt-dk:#C05948;
  --turf:#88B073; --signal:#E0715F; --sun:#DFB65A;
  --paper:#191612; --card:#221E18; --line:#332D24; --tile:#221E18;
  --obrys:rgba(255,255,255,.06);
  --pozadi:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
}

/* ══ Barevné bloky ══ */
html[data-styl="bloky"]{
  --ink:#151310; --ink-soft:#5A5348;
  --cobalt:#151310; --cobalt-dk:#000;
  --turf:#3FBF6A; --signal:#FF6B8A; --sun:#FFC93C;
  --paper:#E9E3D3; --card:#FFFDF7; --line:#151310; --tile:#FFFDF7;
  --obrys:#151310;
  --hrana:2.5px;
  --shadow:4px 4px 0 #151310;
  --shadow-s:3px 3px 0 #151310;
  --r-s:12px; --r:16px; --r-l:20px;
  --pozadi:
    radial-gradient(28% 18% at 12% 8%, rgba(255,201,60,.5), rgba(0,0,0,0) 70%),
    radial-gradient(26% 16% at 88% 22%, rgba(46,211,198,.45), rgba(0,0,0,0) 70%),
    radial-gradient(30% 20% at 70% 92%, rgba(255,107,138,.4), rgba(0,0,0,0) 70%);
}
html[data-styl="bloky"][data-tmavy]{
  --ink:#FFFDF7; --ink-soft:#A9A294;
  --cobalt:#FFC93C; --cobalt-dk:#E0A712;
  --turf:#3FBF6A; --signal:#FF6B8A;
  --paper:#151310; --card:#221F1A; --line:#FFFDF7; --tile:#221F1A;
  --obrys:#FFFDF7;
  --shadow:4px 4px 0 #FFFDF7;
  --shadow-s:3px 3px 0 #FFFDF7;
}
html[data-styl="bloky"] .btn:not(.ghost):not(.danger),
html[data-styl="bloky"] .tab.on,
html[data-styl="bloky"] .key.sel,
html[data-styl="bloky"] .pchip.active{border:var(--hrana) solid var(--obrys)}
html[data-styl="bloky"][data-tmavy] .btn:not(.ghost):not(.danger),
html[data-styl="bloky"][data-tmavy] .tab.on{color:#151310}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--paper)}
/* Pozadí kreslí zvolený styl přes proměnnou --pozadi. */
html::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:var(--pozadi);
  background-size:var(--pozadi-velikost,auto);
}

body{
  position:relative;z-index:1;
  background:transparent; color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain; touch-action:manipulation;
}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}

/* ---------- topbar ---------- */
.top{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  display:flex;align-items:center;gap:7px;
  border-bottom:1px solid var(--line);
}
.top .grow{flex:1;min-width:0}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--cobalt)}
.subtle{color:var(--ink-soft);font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:44px;height:44px;border-radius:12px;border:var(--hrana) solid var(--line);
  background:var(--card);display:grid;place-items:center;font-size:19px;flex:none;
}
.iconbtn:active{background:var(--paper)}
.pill{
  font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;
  border:var(--hrana) solid var(--line);background:var(--card);color:var(--ink-soft);white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;flex:none;
}
.pill i.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--turf);border-color:color-mix(in srgb,var(--turf) 40%,transparent)}
.pill.busy{color:var(--cobalt);border-color:color-mix(in srgb,var(--cobalt) 40%,transparent)}
.pill.warn{color:var(--signal);border-color:color-mix(in srgb,var(--signal) 40%,transparent)}
.pill.zamcena{color:var(--ink-soft);background:color-mix(in srgb,var(--ink) 7%,var(--card))}
@media(max-width:479px){
  .pill .txt{display:none}
  .pill{padding:9px}
  .top{gap:6px;padding-left:10px;padding-right:10px}
  .iconbtn{width:42px;height:42px}
}

/* ---------- typo ---------- */
h2{font-family:var(--display);font-size:14px;letter-spacing:.16em;text-transform:uppercase;
   color:var(--ink-soft);margin:30px 0 12px;font-weight:400}
h3{font-family:var(--display);font-size:20px;letter-spacing:.03em;margin:0 0 4px;font-weight:400}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 18px;border-radius:var(--r);
  background:var(--cobalt);color:#fff;font-weight:600;font-size:16px;
  box-shadow:var(--shadow);
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:var(--hrana) solid var(--line);box-shadow:none}
.btn.danger{background:var(--card);color:var(--signal);border:1px solid color-mix(in srgb,var(--signal) 40%,transparent);box-shadow:none}
.btn.big{padding:18px;font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:var(--hrana) solid var(--obrys);border-radius:var(--r);
  padding:15px 16px;box-shadow:var(--shadow);width:100%;text-align:left;display:block;
  transition:transform .12s ease;
}
.card:active{transform:scale(.99)}
.card+.card{margin-top:11px}
.card .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--ink-soft);font-size:13px}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
     padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--turf) 16%,transparent);color:var(--turf)}
.tag.live{background:color-mix(in srgb,var(--signal) 14%,transparent);color:var(--signal)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--ink-soft)}

/* ---------- leaderboard ---------- */
/* Pořadí: mřížka, která se zalomí – všichni hráči vidět bez posouvání do stran */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:2px 0 6px}
@media(min-width:420px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:560px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lb{
  min-width:0;background:var(--card);border:var(--hrana) solid var(--obrys);
  border-radius:var(--r-s);padding:10px 12px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-s);
}
.lb.first{border-color:var(--cobalt);box-shadow:inset 3px 0 0 var(--cobalt)}
.lb .pos{font-family:var(--display);font-size:12px;color:var(--ink-soft);letter-spacing:.1em}
.lb .lbtop{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
.lb.first .pos{color:var(--cobalt)}
.lb .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .tot{font-family:var(--display);font-size:26px;line-height:1;margin-top:2px}
.lb .thru{font-size:11px;color:var(--ink-soft)}

/* ---------- hole grid (signature) ---------- */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(min-width:520px){.holes{grid-template-columns:repeat(6,1fr)}}
.hole{
  position:relative;background:var(--tile);border:var(--hrana) solid var(--obrys);border-radius:var(--r-s);
  padding:11px 8px 10px;overflow:hidden;text-align:center;box-shadow:var(--shadow);
  min-height:86px;display:flex;flex-direction:column;justify-content:center;
  transition:border-color .15s ease;
}
.hole .fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--turf) 14%,transparent);
  height:var(--fill,0%);transition:height .35s cubic-bezier(.2,.7,.3,1)}
.hole .hnum{position:relative;font-family:var(--display);font-size:30px;line-height:.95;letter-spacing:.02em}
.hole .par{position:relative;font-size:10px;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase}
.hole .dots{position:relative;display:flex;justify-content:center;gap:3px;margin-top:7px;flex-wrap:wrap}
.hole .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.hole .dots i.on{background:var(--cobalt)}
.hole .dots i.ace{background:var(--sun)}
.hole .dots i.ne{background:var(--signal)}
.hole.done{border-color:color-mix(in srgb,var(--turf) 55%,transparent)}
.hole:active{transform:scale(.97)}

/* ---------- sheet / modal ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--ink) 45%,transparent);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-in{
  background:var(--paper);width:100%;max-width:760px;max-height:94vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}

/* 5 – panel jamky přijede ze strany podle směru přejetí, ne fade. */
@keyframes jamkaZL{from{transform:translateX(-26px);opacity:.35}to{transform:none;opacity:1}}
@keyframes jamkaZP{from{transform:translateX(26px);opacity:.35}to{transform:none;opacity:1}}
.sheet-in.zl{animation:jamkaZL .2s cubic-bezier(.2,.8,.3,1)}
.sheet-in.zp{animation:jamkaZP .2s cubic-bezier(.2,.8,.3,1)}

/* 3 – zapsané číslo krátce vyskočí. */
@keyframes cisloPop{0%{transform:scale(1)}35%{transform:scale(1.42)}100%{transform:scale(1)}}
.narade .v.pop{animation:cisloPop .3s cubic-bezier(.3,1.6,.4,1)}
.pava .v.pop{animation:cisloPop .3s cubic-bezier(.3,1.6,.4,1)}

/* 10 – nový rekord jamky se oznámí přímo v mapce. */
@keyframes rekordBlik{0%,100%{opacity:1}50%{opacity:.35}}
.mapa .rekord-novy{animation:rekordBlik .7s ease-in-out 2}

@media (prefers-reduced-motion:reduce){.sheet,.sheet-in{animation:none}.hole .fill{transition:none}}
.sheet.noanim,.sheet.noanim .sheet-in{animation:none}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head .t{flex:1;font-family:var(--display);font-size:24px;letter-spacing:.03em}

/* ---------- form ---------- */
label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
        color:var(--ink-soft);margin:14px 0 6px}
input[type=text],input[type=date],input[type=number],select{
  width:100%;padding:13px 14px;border-radius:11px;border:var(--hrana) solid var(--line);
  background:var(--card);font-size:16px;
}
.playerrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.playerrow .idx{width:26px;text-align:center;font-family:var(--display);color:var(--ink-soft)}
.playerrow input{flex:1}
.playerrow .rm{width:42px;height:46px;border-radius:11px;border:var(--hrana) solid var(--line);background:var(--card);color:var(--signal);flex:none}

/* ---------- hole entry ---------- */
/* Hráč na řadě má vlastní široký řádek se jménem a ±; ostatní jsou jen avatary,
   aby se osm lidí vešlo na šířku bez posouvání. */
.narade{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 8px 8px 8px;
  border-radius:var(--r-s);background:var(--cobalt);color:#fff;
  border:var(--hrana) solid var(--cobalt);margin-bottom:8px}
html[data-styl="stadion"] .narade{color:#0A0C0F}
html[data-styl="bloky"] .narade{border:var(--hrana) solid var(--obrys)}
html[data-styl="bloky"][data-tmavy] .narade{color:#151310}
.narade .jm{flex:1;min-width:0;font-weight:700;font-size:17px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.narade .v{font-family:var(--display);font-size:22px;min-width:20px;text-align:center}
.narade .pcpm{border-color:color-mix(in srgb,#fff 45%,transparent);
  background:color-mix(in srgb,#fff 18%,transparent);color:inherit}

.pchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 0 10px}
.pava{flex:none;width:44px;padding:0;background:none;border:0;color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.pava .ava{opacity:.68;transition:opacity .15s ease}
.pava{transition:transform .26s cubic-bezier(.2,.8,.3,1)}
@media (prefers-reduced-motion:reduce){
  .pava,.hpin{transition:none}
  .sheet-in.zl,.sheet-in.zp,.narade .v.pop,.pava .v.pop,.mapa .rekord-novy{animation:none}
}

/* 6 – kdo je právě v čele a o kolik, bez otevírání tabule. */
.souboj{display:flex;align-items:center;gap:8px;min-height:34px;margin-bottom:8px;
  padding:0 4px;font-size:12px;color:var(--ink-soft)}
.souboj b{font-weight:700;color:var(--ink)}
.souboj .roz{font-family:var(--display);color:var(--sun);white-space:nowrap}
.souboj .tah{margin-left:auto;white-space:nowrap}
.pava .v{font-family:var(--display);font-size:13px;line-height:1;color:var(--ink-soft)}
.pava.filled .ava{opacity:1}
.pava.filled .v{color:var(--turf)}
.pava.fail .v{color:var(--signal)}

/* Ukončená hra – jen výpis, žádná klávesnice. */
.vyslgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;
  margin-bottom:4px}
.vysl{display:flex;align-items:center;gap:9px;min-height:48px;padding:6px 12px 6px 6px;
  border-radius:var(--r-s);border:var(--hrana) solid var(--line);background:var(--card)}
.vysl .jm{flex:1;min-width:0;font-weight:600;font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vysl .v{font-family:var(--display);font-size:20px;color:var(--ink)}
.vysl.eso .v{color:var(--sun)}
.vysl.fail .v{color:var(--signal)}
.pchip.fail{border-color:color-mix(in srgb,var(--signal) 55%,transparent)}
.pchip.fail .v{color:var(--signal)}

.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
.key{
  aspect-ratio:1.2/1;min-height:62px;border-radius:14px;border:var(--hrana) solid var(--line);background:var(--card);
  font-family:var(--display);font-size:29px;display:grid;place-items:center;box-shadow:var(--shadow);
  -webkit-tap-highlight-color:transparent;
}
.key:active{transform:scale(.96)}
.key.sel{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.key.ace{color:var(--sun)}
.key.ace.sel{background:var(--sun);border-color:var(--sun);color:#20180a}
.key.fail{
  font-family:var(--body);font-size:15px;font-weight:700;line-height:1.1;color:var(--signal);
  border-color:color-mix(in srgb,var(--signal) 45%,transparent);gap:2px;
}
.key.fail small{display:block;font-size:11px;font-weight:600;opacity:.75}
.key.fail.sel{background:var(--signal);border-color:var(--signal);color:#fff}
.key.wipe{font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink-soft)}

/* ---------- scorecard ---------- */
.tablewrap{overflow-x:auto;border:var(--hrana) solid var(--obrys);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-s)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
tbody tr:last-child td{border-bottom:none}
th.sticky,td.sticky{position:sticky;left:0;background:var(--card);text-align:left;font-weight:600;z-index:1;
  box-shadow:1px 0 0 var(--line)}
td.ace{color:var(--sun);font-weight:700}
td.ne{color:var(--signal);font-weight:700}
tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--card)}
th .pn{display:block;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto}
th .th-p{display:flex;flex-direction:column;align-items:center;gap:4px}
td .td-p{display:flex;align-items:center;gap:8px}
table.byhole tbody td{padding:11px 9px;font-size:15px}
table.byhole tbody td.sticky{color:var(--ink-soft);font-family:var(--display);font-size:16px}
table.byhole tbody tr:active td{background:color-mix(in srgb,var(--cobalt) 10%,var(--card))}
td.tot{font-family:var(--display);font-size:17px}
tr.win td.sticky{color:var(--cobalt)}

/* ---------- bottom bar ---------- */
.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:9px 16px calc(9px + env(safe-area-inset-bottom));
}
.bottom .inner{max-width:760px;margin:0 auto;display:flex;gap:9px}
.tab{flex:1;min-width:0;padding:14px 6px;border-radius:12px;font-weight:600;font-size:14px;text-align:center;border:1px solid transparent;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--ink);color:var(--paper);padding:10px 15px;border-radius:11px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);animation:up .2s ease}
.toast.bad{background:var(--signal);color:#fff}
.hint{color:var(--ink-soft);font-size:13px;margin:8px 2px 0}
/* ---------- stupně vítězů ---------- */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:4px}
.pod{flex:1;max-width:132px;min-width:0;display:flex;flex-direction:column;align-items:center}
.pod .medal{font-size:19px;line-height:1;margin-bottom:3px}
.pod .nm{font-weight:700;font-size:14px;text-align:center;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.pod .sc{font-family:var(--display);font-size:25px;line-height:1.05}
.pod .sub{font-size:11px;color:var(--ink-soft)}
.pod .step{
  width:100%;margin-top:8px;border-radius:11px 11px 0 0;display:grid;place-items:center;
  font-family:var(--display);font-size:27px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);
  box-shadow:var(--shadow);
}
.pod.p1 .step{height:104px;background:linear-gradient(180deg,#F7C63A,#D69B08)}
.pod.p2 .step{height:78px;background:linear-gradient(180deg,#C3CED6,#93A4B0)}
.pod.p3 .step{height:60px;background:linear-gradient(180deg,#D5915B,#A96A38)}
.pod.p1 .ava{box-shadow:0 0 0 3px #F2B417}

.rest{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.restrow{display:flex;align-items:center;gap:11px;background:var(--card);
  border:var(--hrana) solid var(--obrys);border-radius:var(--r-s);padding:11px 13px;box-shadow:var(--shadow-s)}
.restrow .r{font-family:var(--display);color:var(--ink-soft);min-width:24px;text-align:center}
.restrow .nm{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restrow .sc{font-family:var(--display);font-size:20px}
.restrow .sub{font-size:11px;color:var(--ink-soft);margin-left:6px}

.locknote{
  display:flex;align-items:center;gap:10px;background:var(--card);border:var(--hrana) solid var(--obrys);
  border-radius:var(--r-s);padding:12px 14px;color:var(--ink-soft);font-size:13px;margin-top:12px;
  box-shadow:var(--shadow-s);
}
.hole.locked{opacity:.85}

/* ---------- výběr profilovky u jména ---------- */
.prow{margin-bottom:6px}
.avarow{
  display:flex;gap:9px;overflow-x:auto;padding:2px 2px 10px 34px;margin-top:-2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.avarow::-webkit-scrollbar{display:none}
.avaopt{
  flex:none;border:2px solid transparent;border-radius:50%;padding:2px;background:none;
  line-height:0;-webkit-tap-highlight-color:transparent;
}
.avaopt .ava{opacity:.5;filter:saturate(.7)}
.avaopt.sel{border-color:var(--cobalt)}
.avaopt.sel .ava{opacity:1;filter:none}
.avaopt:active{transform:scale(.93)}

/* ---------- statistiky ---------- */
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media(min-width:480px){.statgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:var(--hrana) solid var(--obrys);border-radius:var(--r-s);padding:12px 13px;box-shadow:var(--shadow-s);min-width:0}
.stat .v{font-family:var(--display);font-size:25px;line-height:1.05}
.stat .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.stat .s{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.barrow{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--hrana) solid var(--obrys);
  border-radius:var(--r-s);padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow-s)}
.barrow .nm{font-weight:600;flex:0 0 76px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.barrow .track{flex:1;height:9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden;min-width:30px}
.barrow .fillb{height:100%;border-radius:999px;background:var(--cobalt);transition:width .3s ease}
.barrow.best .fillb{background:var(--turf)}

/* 7c – bod na společné ose místo pruhu od nuly. Pruh začínal v nule, takže celý
   rozdíl mezi hráči se „smrsknul“ do posledních pár procent délky. */
.barrow .osa{flex:1;min-width:40px;height:26px;position:relative}
.barrow .osa::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:color-mix(in srgb,var(--ink) 12%,transparent)}
.barrow .bod{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,-50%);background:var(--cobalt-bod,var(--ink-soft));
  transition:left .3s ease}
.barrow.best .bod{width:13px;height:13px;background:var(--turf);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--turf) 20%,transparent)}
.barrow.worst .bod{background:var(--signal);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 16%,transparent)}
.osaleg{display:flex;align-items:center;gap:10px;margin:-2px 0 10px;padding:0 12px}
.osaleg .nm{flex:0 0 76px}
.osaleg .sk{flex:1;min-width:40px;display:grid;grid-template-columns:1fr 1fr 1fr;
  font-family:var(--display);font-size:11px;color:var(--ink-soft)}
.osaleg .sk span:nth-child(2){text-align:center}
.osaleg .sk span:last-child{text-align:right}
.osaleg .v{flex:0 0 42px}
.osaleg .ava-sp{flex:0 0 26px}
@media (prefers-reduced-motion:reduce){.barrow .bod{transition:none}}

/* Přepínač osa / prsteny u průměru na jamku. */
.prstgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px;
  background:var(--card);border:var(--hrana) solid var(--obrys);border-radius:var(--r-s);
  padding:16px 14px;margin-bottom:8px;box-shadow:var(--shadow-s)}
.prst{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;
  color:inherit;font:inherit;padding:0}
.prst .kruh{width:74px;height:74px;border-radius:50%;display:grid;place-items:center}
.prst .stred{width:56px;height:56px;border-radius:50%;background:var(--card);display:grid;
  place-items:center;font-family:var(--display);font-size:16px;color:var(--ink)}
.prst.best .stred{color:var(--turf)}
.prst.worst .stred{color:var(--signal)}
.prst .nm{font-size:12px;font-weight:600;max-width:84px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.barrow .v{font-family:var(--display);font-size:19px;min-width:42px;text-align:right}

.holebars{display:flex;align-items:flex-end;gap:3px;height:118px;background:var(--card);
  border:var(--hrana) solid var(--obrys);border-radius:var(--r-s);padding:12px 9px 9px;box-shadow:var(--shadow-s)}
.hb{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.hb .b{width:100%;border-radius:3px 3px 0 0;background:var(--cobalt);min-height:2px}
.hb.max .b{background:var(--signal)}
.hb.min .b{background:var(--turf)}
.hb.none .b{background:var(--line)}
.hb .l{font-size:9px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.deli{color:var(--ink-soft);opacity:.5;margin:0 2px}
td .ace{color:var(--sun);font-weight:700}
td .ne{color:var(--signal);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);margin-top:7px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}

.ico{flex:none;display:block}
.btn .ico{opacity:.9}
.iconbtn .ico{opacity:.75}
.rekico{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:color-mix(in srgb,var(--cobalt) 12%,transparent);color:var(--cobalt);flex:none}
.medaile{display:block}
/* ---------- nové vizuální prvky ---------- */
.hlava2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 12px}
.prsten{position:relative;display:inline-grid;place-items:center;color:var(--cobalt);flex:none}
.prsten b{position:absolute;font-family:var(--display);font-size:12px;font-weight:400;color:var(--ink)}
.prsten b::after{content:"%";font-size:8px;opacity:.55;margin-left:1px}

.kostra{background:var(--card);border:var(--hrana) solid var(--obrys);border-radius:var(--r);
  padding:15px 16px;box-shadow:var(--shadow-s);margin-bottom:11px}
.kl{border-radius:6px;background:linear-gradient(90deg,
  color-mix(in srgb,var(--ink) 7%,transparent) 25%,
  color-mix(in srgb,var(--ink) 12%,transparent) 37%,
  color-mix(in srgb,var(--ink) 7%,transparent) 63%);
  background-size:400% 100%;animation:preblik 1.4s ease infinite}
@keyframes preblik{0%{background-position:100% 0}100%{background-position:0 0}}

.konfety{position:fixed;inset:0;z-index:95;pointer-events:none}
.prazdno{color:var(--ink-soft)}

.grabber{width:42px;height:4px;border-radius:99px;background:var(--line);
  margin:2px auto 12px;flex:none}

.hole.rozehrana{border-color:color-mix(in srgb,var(--cobalt) 45%,transparent)}
.hole.rozehrana::after{
  content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--cobalt) 55%,transparent);
  animation:pulz 2.4s ease-out infinite;
}
@keyframes pulz{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cobalt) 45%,transparent)}
  70%{box-shadow:0 0 0 7px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
@media (prefers-reduced-motion:reduce){
  .hole.rozehrana::after,.kl{animation:none}
}

/* ---------- tabule s průběhem ---------- */
.rozbal{width:34px;height:34px;border-radius:11px;background:var(--card);border:var(--hrana) solid var(--obrys);
  display:grid;place-items:center;color:var(--ink-soft);box-shadow:var(--shadow-s);flex:none;
  transition:transform .2s ease,color .2s ease}
.rozbal.on{transform:rotate(180deg);color:var(--cobalt)}

/* Vytahovací tabule: úchyt pod pořadím, tahem dolů se rozbalí průběh. */
.tabulewrap{position:relative;transform:translateY(var(--tah,0px));transition:transform .2s cubic-bezier(.2,.8,.3,1)}
.tabulewrap.tahne{transition:none}
.uchyt{
  width:100%;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:12px 0 8px;touch-action:none;cursor:grab;color:var(--ink-soft);
}
.uchyt:active{cursor:grabbing}
.uchyt .bar{width:40px;height:5px;border-radius:999px;background:var(--line);transition:background .15s ease,width .15s ease}
.uchyt .lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.uchyt:active .bar,.tabulewrap.tahne .uchyt .bar{background:var(--cobalt);width:56px}
.uchyt:active .lbl,.tabulewrap.tahne .uchyt .lbl{color:var(--cobalt)}

.tabule{background:var(--card);border:var(--hrana) solid var(--obrys);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.tabule .tr{display:flex;align-items:center;gap:10px;padding:9px 13px;border-top:1px solid var(--line)}
.tabule .tr:first-child{border-top:none}
.tabule .tr.vede{background:color-mix(in srgb,var(--cobalt) 8%,transparent)}
.tabule .m{width:14px;font-family:var(--display);font-size:14px;color:var(--ink-soft)}
.tabule .tr.vede .m{color:var(--sun)}
.tabule .jm{width:74px;flex:none;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabule .sc{width:38px;text-align:right;font-family:var(--display);font-size:21px}

.spark{flex:1;display:flex;align-items:flex-end;gap:1.5px;height:26px;min-width:40px}
.spark i{flex:1;min-width:1px;background:var(--cobalt);border-radius:1.5px;opacity:.85}
.spark i.eso{background:var(--sun);opacity:1}
.spark i.ne{background:var(--signal);opacity:1}
.spark i.nic{background:var(--line);opacity:.7}

.porovnani{display:flex;align-items:center;gap:9px;margin-top:10px;padding:10px 13px;
  border-radius:var(--r-s);font-size:13px;line-height:1.35}
.porovnani b{font-family:var(--display);font-size:15px;font-weight:400}
.porovnani i{font-style:normal;opacity:.65;font-size:12px}
.porovnani.lepsi{background:color-mix(in srgb,var(--turf) 14%,transparent);color:var(--cobalt-dk)}
.porovnani.horsi{background:color-mix(in srgb,var(--signal) 12%,transparent);color:var(--signal)}
.porovnani.stejne{background:var(--card);color:var(--ink-soft);border:var(--hrana) solid var(--obrys)}
html[data-tmavy] .porovnani.lepsi{color:var(--turf)}

/* ---------- výběr stylu ---------- */
.styly{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.styl{
  text-align:left;background:var(--card);border:var(--hrana) solid var(--obrys);border-radius:var(--r-s);
  padding:11px 12px;box-shadow:var(--shadow-s);min-width:0;
}
.styl.on{border-color:var(--cobalt);box-shadow:0 0 0 1px var(--cobalt),var(--shadow-s)}
.styl .vzorek{display:flex;gap:0;border-radius:99px;overflow:hidden;height:16px;margin-bottom:8px;
  border:1px solid var(--obrys)}
.styl .vzorek i{flex:1;display:block}
.styl b{display:block;font-size:14.5px;font-weight:700}
.styl .po{display:block;font-size:11.5px;color:var(--ink-soft);line-height:1.3;margin-top:2px}
.styl.on b{color:var(--cobalt)}

/* Mapka jamky v panelu zápisu: půdorys podělaný podle fotek a náčrtů hřiště.
   Barvy se míchají z tokenů motivu, takže mapka sedne každému stylu. */
.mapa{
  background:color-mix(in srgb,var(--ink) 4%,var(--card));
  border:var(--hrana,1px) solid var(--obrys);border-radius:var(--r-s);
  padding:8px 10px 6px;margin-bottom:10px;
}
.mapa svg{display:block;max-height:118px;width:auto;max-width:100%;height:auto;margin:0 auto;color:var(--ink)}
.mapa .tt{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;
  vertical-align:-1px;margin-right:6px}
.mapa .popis{font-size:12px;color:var(--ink-soft);padding-top:6px;margin-top:6px;
  border-top:1px solid var(--line);text-wrap:pretty}
.mapa .nej{font-family:var(--display);color:var(--sun);white-space:normal;text-wrap:pretty}
.mapa.pas .nej{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
.mapa .rek{display:block;margin-top:3px;font-size:11px;color:var(--ink-soft);
  letter-spacing:.02em}
.mapa .rek b{font-family:var(--display);font-weight:400;color:var(--sun)}

/* Pásek jamek 01–18 – přehled i navigace v jednom řádku. Hotová zeleně,
   rozehraná zlatě, nedaná červeně, aktuální plná. */
.pasek{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.pasek::-webkit-scrollbar{display:none}
.hpin{flex:none;width:44px;height:44px;border-radius:13px;
  border:var(--hrana,1px) solid var(--line);background:var(--card);
  font-family:var(--display);font-size:14px;color:var(--ink-soft);display:grid;place-items:center;
  transition:background-color .25s ease,border-color .25s ease,color .2s ease}
.hpin.part{border-color:color-mix(in srgb,var(--sun) 55%,transparent);color:var(--sun)}
.hpin.done{border-color:color-mix(in srgb,var(--turf) 55%,transparent);
  background:color-mix(in srgb,var(--turf) 14%,var(--card));color:var(--turf)}
.hpin.fail{border-color:color-mix(in srgb,var(--signal) 55%,transparent);
  background:color-mix(in srgb,var(--signal) 12%,var(--card));color:var(--signal)}
.hpin.now{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-size:15px}
html[data-styl="stadion"] .hpin.now{color:#0A0C0F}
html[data-styl="bloky"] .hpin.now{border:var(--hrana) solid var(--obrys)}
html[data-styl="bloky"][data-tmavy] .hpin.now{color:#151310}

/* ± u už zapsaného skóre: přepsat 3 na 4 bez otevírání klávesnice.
   Kolečko zůstává 30 px, ale dotekač má 44 px – mimo něj už leží druhé tlačítko. */
.pchip.pm{padding-right:0}
.pcmain{display:flex;gap:8px;align-items:center;background:none;border:0;padding:0;
  font:inherit;color:inherit;min-height:30px}
.pcpm{flex:none;width:30px;height:30px;border-radius:50%;margin-left:14px;
  border:var(--hrana,1px) solid var(--line);background:color-mix(in srgb,var(--ink) 5%,var(--card));
  color:inherit;display:grid;place-items:center;position:relative}
.pcpm::before{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;
  transform:translate(-50%,-50%)}
.pcpm:last-child{margin-right:8px}
.pchip.active .pcpm{border-color:color-mix(in srgb,#fff 45%,transparent);
  background:color-mix(in srgb,#fff 18%,transparent);color:#fff}

/* Vrátit poslední zápis – pásek na šest sekund místo dialogu.
   Nejčastější chyba je zápis špatnému hráči. */
.undo{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;margin-top:10px;
  padding:0 12px;border-radius:var(--r-s);border:var(--hrana,1px) solid var(--obrys);
  background:color-mix(in srgb,var(--ink) 5%,var(--card));color:var(--ink);
  font:inherit;font-size:13px;font-weight:600;text-align:left;position:relative;overflow:hidden}
.undo .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo b{font-weight:800}
.undo .cas{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--cobalt);
  transform-origin:left;animation:undoCas 6s linear forwards}
@keyframes undoCas{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.undo .cas{animation:none;transform:scaleX(.4)}}

/* Teplotní mapa jamek – kde hráč v téhle hře ztrácí. Žádné nové číslo k zapisování:
   počítá se z toho, co už v appce je. */
.hmgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.hm{border-radius:10px;border:var(--hrana,1px) solid var(--line);padding:6px 4px 5px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:color-mix(in oklab,var(--h,transparent) 22%,var(--card))}
.hm .n{font-size:10px;color:var(--ink-soft);line-height:1}
.hm .v{font-family:var(--display);font-size:17px;color:var(--ink);line-height:1.1}
.hm .d{font-size:9px;font-weight:800;line-height:1}
.hm.fail{border-color:color-mix(in srgb,var(--signal) 55%,transparent)}
.hmleg{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--ink-soft)}
.hmleg i{flex:1;height:6px;border-radius:999px;
  background:linear-gradient(90deg,var(--turf),var(--sun),var(--signal))}

/* Mapka se dá schovat: zavřená zůstane jednořádkový pásek s obrysem a názvem,
   takže i schovaná odpovídá na „která jamka to je“. Ovládá se stejným gestem
   jako tabule pořadí – úchyt 44 px, tah nebo klepnutí. */
.mapawrap{position:relative;margin-bottom:10px;
  transform:translateY(var(--tahm,0px));transition:transform .2s cubic-bezier(.2,.8,.3,1)}
.mapawrap.tahne{transition:none}
.mapawrap .mapa{margin-bottom:0}
.mapabtn{display:block;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}
.mapa.pas{display:flex;align-items:center;gap:10px;padding:8px 11px}
.mapa.pas svg{width:76px;max-height:40px;margin:0;flex:none}
.mapa.pas .nm{font-size:13px;font-weight:700;color:var(--ink);flex:1;min-width:0;
  overflow:hidden;display:flex;flex-direction:column;gap:2px}
.mapa.pas .nm>span:first-child,.mapa.pas .rek.pas{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapa .rek.pas{display:block;margin-top:0;font-weight:400;font-size:11px;color:var(--ink-soft)}
.mapa .rek.pas b{font-family:var(--display);font-weight:400;color:var(--sun)}
.mapa.pas .nej{font-size:11px}
.uchytm{width:100%;min-height:44px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;padding:5px 0 3px;touch-action:none;cursor:grab;
  background:none;border:0;color:var(--ink-soft)}
.uchytm:active{cursor:grabbing}
.uchytm .bar{width:40px;height:5px;border-radius:999px;background:var(--line);
  transition:background .15s ease,width .15s ease}
.uchytm .lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.uchytm:active .bar,.mapawrap.tahne .uchytm .bar{background:var(--cobalt);width:56px}
.uchytm:active .lbl,.mapawrap.tahne .uchytm .lbl{color:var(--cobalt)}

/* Klepnutí na mapku = celá obrazovka. Na hřišti se člověk dívá jednou a pořádně. */
.mapazoom{
  position:fixed;inset:0;z-index:60;padding:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:color-mix(in srgb,var(--paper) 93%,#000);
}
.mapazoom svg{display:block;width:100%;max-width:min(560px,92vw);height:auto;max-height:50vh;color:var(--ink)}
.mapazoom .hl{font-family:var(--display);font-size:24px;letter-spacing:.02em;text-align:center}
.mapazoom .po{font-size:14px;color:var(--ink-soft);text-align:center;max-width:420px;text-wrap:pretty}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- profilovky ---------- */
.ava{
  width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;
  display:inline-grid;place-items:center;background:var(--line);vertical-align:middle;
  box-shadow:inset 0 0 0 1px rgba(16,34,46,.12);
}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava.fb{background:var(--c);color:#fff;font-family:var(--display);font-size:calc(var(--s) * .52);line-height:1}
.avastack{display:flex;align-items:center}
.avastack .ava{margin-right:-8px;box-shadow:0 0 0 2px var(--card)}
.avastack .ava:last-child{margin-right:0}
.avabtn{
  border:var(--hrana) solid var(--line);background:var(--card);border-radius:50%;padding:2px;
  width:52px;height:52px;flex:none;display:grid;place-items:center;position:relative;
}
.avabtn::after{
  content:"✎";position:absolute;right:-3px;bottom:-3px;width:21px;height:21px;border-radius:50%;
  background:var(--cobalt);color:#fff;border:2px solid var(--card);
  font-size:11px;line-height:17px;text-align:center;font-family:var(--body);
}
.avagrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:4px}
@media(min-width:520px){.avagrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.avapick{
  border:2px solid var(--line);background:var(--card);border-radius:15px;padding:8px 4px;
  display:grid;place-items:center;gap:5px;min-width:0;
}
.avapick.sel{border-color:var(--cobalt);background:color-mix(in srgb,var(--cobalt) 10%,var(--card))}
.avapick:active{transform:scale(.95)}
.avapick span.lbl{font-size:10px;font-weight:600;color:var(--ink-soft);line-height:1.1;text-align:center}
.avapick.sel span.lbl{color:var(--cobalt)}
</style>

  set: function (k, v) { try { localStorage.setItem('mg_' + k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('mg_' + k); } catch (e) {} }
};

/* ---------------------- API přes JSONP ---------------------- */
var jsonpN = 0;
function api(action, params, timeout) {
  return new Promise(function (resolve, reject) {
    var cb = 'mgcb' + (++jsonpN) + '_' + Date.now().toString(36);
    var q = new URLSearchParams();
    q.set('action', action);
    q.set('callback', cb);
    Object.keys(params || {}).forEach(function (k) {
      var v = params[k];
      if (v !== undefined && v !== null) q.set(k, typeof v === 'object' ? JSON.stringify(v) : String(v));
    });
    var s = document.createElement('script');
    var done = false;
    var timer = setTimeout(function () { finish(new Error('Server neodpovídá')); }, timeout || 20000);
    function finish(err, data) {
      if (done) return; done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
      err ? reject(err) : resolve(data);
    }
    window[cb] = function (data) {
      if (data && data.ok === false) finish(new Error(data.error || 'Chyba serveru'));
      else finish(null, data);
    };
    s.onerror = function () { finish(new Error('Nedaří se spojit se serverem')); };
    s.src = apiUrl() + '?' + q.toString();
    document.head.appendChild(s);
  });
}

/* ---------------------- fronta zápisů (offline) ---------------------- */
S.queue = LS.get('queue', []);

function enqueue(key, action, params) {
  S.queue = S.queue.filter(function (i) { return i.key !== key; });
  S.queue.push({ key: key, action: action, params: params, t: Date.now() });
  LS.set('queue', S.queue);
  flush();
}

var flushing = false;
function flush() {
  if (flushing || !S.queue.length) { paint({ sheetOnly: !!openSheet }); return; }
  flushing = true; S.syncing++; paint({ sheetOnly: !!openSheet });
  var item = S.queue[0];
  api(item.action, item.params).then(function () {
    S.queue = S.queue.filter(function (i) { return i !== item; });
    LS.set('queue', S.queue);
    S.err = null;
  }).catch(function (e) {
    S.err = e.message;
    item.tries = (item.tries || 0) + 1;
    if (item.tries >= 8) {
      S.queue = S.queue.filter(function (i) { return i !== item; });
      LS.set('queue', S.queue);
      toast('Nepodařilo se uložit jeden zápis: ' + e.message, true);
      return;
    }
    throw e;
  }).then(function () {
    flushing = false; S.syncing--;
    if (S.queue.length) flush(); else paint({ sheetOnly: !!openSheet });
  }, function () {
    flushing = false; S.syncing--;
    paint();
    setTimeout(flush, 6000);
  });
}

window.addEventListener('online', function () { S.online = true; flush(); });
window.addEventListener('offline', function () { S.online = false; paint(); });

/* ---------------------- pomocné ---------------------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function todayISO() {
  var d = new Date(), z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 10);
}
function czDate(iso) {
  if (!iso) return '';
  var p = String(iso).slice(0, 10).split('-');
  if (p.length !== 3) return iso;
  return Number(p[2]) + '. ' + Number(p[1]) + '. ' + p[0];
}
/* Klíč skóre. U jednokolové hry zůstává tvar "jamka|hrac", aby seděla
   dřív uložená data; druhé kolo dostane příponu "|2". */
function key(h, p, k) { return h + '|' + p + ((k && k > 1) ? '|' + k : ''); }

/* Kolik kol se na každé jamce hraje – 1 nebo 2. */
function kolaHry(g) {
  var k = Number(metaOf(g).kola);
  return (k === 2) ? 2 : 1;
}
function seznamKol(g) { return kolaHry(g) === 2 ? [1, 2] : [1]; }
function toast(msg, bad) {
  var el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(function () { el.remove(); }, bad ? 4200 : 2200);
}
function pl(n, one, few, many) { return n === 1 ? one : (n >= 2 && n <= 4 ? few : many); }
function isNe(v) { return v === NESPLNENO; }
function fmt(v) { return isNe(v) ? 'NE' : v; }

/* ---------------------- profilovky ---------------------- */
/* Přiřazení obrázků k hráčům se veze v poznámce hry jako JSON, aby nebylo
   potřeba měnit backend: {"avatary":[0,3,1]} – index do pole AVATARS, null = bez obrázku. */
function metaOf(g) {
  try {
    var m = JSON.parse((g && g.poznamka) || '{}');
    return (m && typeof m === 'object') ? m : {};
  } catch (e) { return {}; }
}
function avatarsOf(g) {
  var a = metaOf(g).avatary;
  return Array.isArray(a) ? a : [];
}
function avaOf(g, i) {
  var v = avatarsOf(g)[i];
  return (typeof v === 'number' && AVATARS[v]) ? v : null;
}
var AVA_BARVY = ['#14508C', '#2E7D4F', '#D3312B', '#7A4BC4', '#C46A12', '#0F7C85'];
function avaBarva(jmeno) {
  var s = String(jmeno || ''), n = 0;
  for (var i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) >>> 0;
  return AVA_BARVY[n % AVA_BARVY.length];
}
function pismeno(jmeno) {
  var s = String(jmeno || '').trim();
  return s ? s.charAt(0).toUpperCase() : '?';
}/* idx = index do AVATARS nebo null; velikost v px */
function avaHtml(jmeno, idx, size) {
  if (idx != null && AVATARS[idx]) {
    return '<span class="ava" style="--s:' + size + 'px"><img src="' + AVATARS[idx] + '" alt="" decoding="sync"></span>';
  }
  return '<span class="ava fb" style="--s:' + size + 'px;--c:' + avaBarva(jmeno) + '">' + esc(pismeno(jmeno)) + '</span>';
}

/* ---------------------- výpočty ---------------------- */
function standings(game, scores) {
  var kola = seznamKol(game);
  var rows = (game.hraci || []).map(function (jmeno, i) {
    var soucet = 0, jamky = 0, aces = 0, ne = 0;
    for (var h = 1; h <= HOLES; h++) {
      for (var ki = 0; ki < kola.length; ki++) {
        var v = scores[key(h, i, kola[ki])];
        if (v) {
          soucet += v; jamky++;
          if (v === 1) aces++;
          if (isNe(v)) ne++;
        }
      }
    }
    return { i: i, jmeno: jmeno, soucet: soucet, jamky: jamky, aces: aces, ne: ne };
  });
  rows.sort(function (a, b) {
    if (a.jamky === 0 && b.jamky === 0) return a.i - b.i;
    if (a.jamky === 0) return 1;
    if (b.jamky === 0) return -1;
    if (a.soucet !== b.soucet) return a.soucet - b.soucet;
    if (a.jamky !== b.jamky) return b.jamky - a.jamky;
    return a.i - b.i;
  });
  var poradi = 0, last = null;
  rows.forEach(function (r, idx) {
    if (last === null || r.soucet !== last.soucet || r.jamky !== last.jamky || r.jamky === 0) poradi = idx + 1;
    r.poradi = r.jamky ? poradi : '–';
    last = r;
  });
  return rows;
}

/* ---------------------- načítání ---------------------- */
function loadGames() {
  S.loading = !S.games.length; paint();
  return api('games').then(function (d) {
    S.games = d.games || [];
    if (typeof d.rev === 'number') znamyRev = d.rev;
    LS.set('games', S.games);
    S.err = null;
  }).catch(function (e) {
    S.err = e.message;
    S.games = LS.get('games', []);
  }).then(function () { S.loading = false; paint(); });
}

function openGame(id, silent) {
  if (!silent) {
    S.view = 'game';
    // z paměti telefonu se hra ukáže hned, server ji pak jen doplní
    var cache = LS.get('g:' + id, null);
    if (cache && cache.game) {
      S.game = cache.game;
      S.scores = {};
      (cache.skore || []).forEach(function (r) { S.scores[key(r.jamka, r.hrac, r.kolo)] = r.udery; });
      S.loading = false;
    } else {
      S.loading = true; S.game = null; S.scores = {};
    }
    paint();
  }
  return api('game', { id: id }).then(function (d) {
    S.game = d.game;
    var local = {};
    var pendingKeys = {};
    S.queue.forEach(function (q) {
      if (q.action === 'score' && q.params.id === id) pendingKeys[key(q.params.hole, q.params.player, q.params.kolo)] = q.params.strokes;
    });
    (d.skore || []).forEach(function (r) { local[key(r.jamka, r.hrac, r.kolo)] = r.udery; });
    Object.keys(pendingKeys).forEach(function (k) {
      var v = pendingKeys[k];
      if (v === '' || v == null) delete local[k]; else local[k] = Number(v);
    });
    S.scores = local;
    S.view = 'game';
    posledniSig = podpis(local, d.game);
    if (typeof d.rev === 'number') znamyRev = d.rev;
    LS.set('last', { game: d.game, skore: d.skore });
    LS.set('g:' + id, { game: d.game, skore: d.skore });
    S.err = null;
    try { history.replaceState(null, '', '?game=' + encodeURIComponent(id)); } catch (e) {}
    if (!S.games.length) loadGames();   // kvůli porovnání s minulou hrou
  }).catch(function (e) {
    S.err = e.message;
    if (!silent && !S.game) {
      var cached = LS.get('g:' + id, null) || LS.get('last', null);
      if (cached && cached.game && cached.game.id === id) {
        S.game = cached.game;
        S.scores = {};
        (cached.skore || []).forEach(function (r) { S.scores[key(r.jamka, r.hrac, r.kolo)] = r.udery; });
        toast('Jsi offline – ukazuju poslední uloženou verzi', true);
      } else {
        toast(e.message, true);
      }
    }
  }).then(function () { S.loading = false; paint(); });
}

function goHome() {
  S.view = 'home'; S.game = null; S.scores = {}; S.tab = 'holes';
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  paint();
  loadGames();
}

/* ---------------------- tiché načítání změn od ostatních ----------------------
   Na server se sáhne, ale překreslí se jen tehdy, když se něco opravdu změnilo.
   Nikdy se to nestane s otevřeným panelem ani s neodeslanými zápisy, aby
   uživateli nic neuteklo pod rukama. */
var posledniSig = '';
var znamyRev = null;
var revPodporovan = true;   // starší nasazení skriptu akci 'rev' nezná

/* Zeptá se serveru jen na číslo revize – je to řádově levnější než tahat
   celou hru. Když se nic nezměnilo, vrátí false a dál se nic nestahuje. */
function zmenaNaServeru() {
  if (!revPodporovan) return Promise.resolve(true);
  return api('rev', {}, 8000).then(function (d) {
    if (!d || typeof d.rev !== 'number') { revPodporovan = false; return true; }
    if (znamyRev !== null && d.rev === znamyRev) return false;
    znamyRev = d.rev;
    return true;
  }).catch(function () {
    revPodporovan = false;   // stará verze skriptu – padáme zpátky na plné načtení
    return true;
  });
}

function podpis(mapa, game) {
  var s = Object.keys(mapa).sort().map(function (k) { return k + ':' + mapa[k]; }).join(',');
  return s + '|' + JSON.stringify([game.hraci, game.misto, game.datum, game.stav, game.poznamka]);
}

function autoZapnuto() { return LS.get('auto', true) !== false; }

function tichyRefresh(force) {
  if (!S.game || S.view !== 'game') return;
  if (!force) {
    if (!autoZapnuto()) return;
    if (openSheet || S.queue.length || flushing || document.hidden || !S.online) return;
  }
  var id = S.game.id;
  return zmenaNaServeru().then(function (zmeneno) {
    if (!zmeneno) return false;                 // revize sedí, data ani netaháme
    return api('game', { id: id }).then(function (d) {
    if (!S.game || S.game.id !== id || S.view !== 'game') return;   // mezitím jsme jinde

    var nove = {};
    (d.skore || []).forEach(function (r) { nove[key(r.jamka, r.hrac, r.kolo)] = r.udery; });
    // co ještě čeká na odeslání, má přednost před tím, co vrátil server
    S.queue.forEach(function (q) {
      if (q.action !== 'score' || q.params.id !== id) return;
      var k = key(q.params.hole, q.params.player, q.params.kolo);
      if (q.params.strokes === '') delete nove[k]; else nove[k] = Number(q.params.strokes);
    });

    var sig = podpis(nove, d.game);
    if (sig === posledniSig) return false;      // nic nového – nepřekreslujeme vůbec

    var pribylo = Object.keys(nove).length - Object.keys(S.scores).length;
    posledniSig = sig;
    if (typeof d.rev === 'number') znamyRev = d.rev;
    S.game = d.game;
    S.scores = nove;
    rekordyCache = null;
    LS.set('last', { game: d.game, skore: d.skore });
    LS.set('g:' + id, { game: d.game, skore: d.skore });
    S.err = null;
    if (!openSheet) paint();
    return pribylo;
    });
  }).catch(function () { /* výpadek sítě tiše ignorujeme, zkusí se znovu */ });
}
/* ---------------------- zápis skóre ---------------------- */
/* Poslední zápis si držíme šest sekund, aby se dal vrátit jedním dotekem. */
var undoZapis = null, undoTimer = null;

function zapamatujUndo(hole, player, kolo, prev, jmeno) {
  undoZapis = { hole: hole, player: player, kolo: kolo, prev: prev, jmeno: jmeno };
  if (undoTimer) clearTimeout(undoTimer);
  undoTimer = setTimeout(function () {
    undoZapis = null;
    if (openSheet === sheetHole) paint({ sheetOnly: true });
  }, 6000);
}

function setScore(hole, player, strokes, kolo) {
  var g = S.game; if (!g) return;
  rekordyCache = null;
  if (g.stav === 'finished') { toast('Hra je ukončená, skóre už nejde měnit', true); return; }
  var ko = kolo || 1;
  var k = key(hole, player, ko);
  if (strokes == null) delete S.scores[k]; else S.scores[k] = strokes;
  enqueue('score:' + g.id + ':' + k, 'score', {
    id: g.id, hole: hole, player: player, kolo: ko,
    strokes: strokes == null ? '' : strokes,
    jmeno: g.hraci[player] || ''
  });
}

   VYKRESLENÍ
   ======================================================================= */
var openSheet = null;
var afterPaint = null;
var lastSheet = null;

/* paint({sheetOnly:true}) překreslí jen otevřený panel – použité při zápisu úderů,
   aby se stránka pod ním nepřepisovala a nic neproblikávalo. */
function paint(opts) {
  opts = opts || {};
  if (opts.flip) flipUloz();
  if (!opts.sheetOnly) renderRoot();
  renderOverlay();
  centrujPasek();
  flipPrehraj();
  if (afterPaint) { var f = afterPaint; afterPaint = null; f(); }
}

/* ---------- animace pořadí ----------
   Kartičky se po překreslení plynule přesunou na nové místo (technika FLIP)
   a součty se napočítají, místo aby skokem přeblikly. */
var predchoziPozice = {};
var predchoziSoucty = {};

function chceAnimace() {
  return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function zmerPoradi(root) {
  predchoziPozice = {};
  Array.prototype.forEach.call(root.querySelectorAll('[data-lb]'), function (el) {
    predchoziPozice[el.getAttribute('data-lb')] = el.getBoundingClientRect();
  });
}

function animujPoradi(root) {
  var prvky = root.querySelectorAll('[data-lb]');
  if (!prvky.length) return;

  Array.prototype.forEach.call(prvky, function (el) {
    var id = el.getAttribute('data-lb');

    if (chceAnimace() && el.animate) {
      var stara = predchoziPozice[id];
      if (stara) {
        var nova = el.getBoundingClientRect();
        var dx = stara.left - nova.left, dy = stara.top - nova.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          el.animate(
            [{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }],
            { duration: 420, easing: 'cubic-bezier(.2,.8,.25,1)' }
          );
        }
      }
    }

    // napočítání součtu
    var cil = el.querySelector('[data-pocitadlo]');
    if (!cil) return;
    var nove = Number(cil.getAttribute('data-pocitadlo'));
    var stare = predchoziSoucty[id];
    predchoziSoucty[id] = nove;
    if (!chceAnimace() || stare === undefined || stare === nove || isNaN(nove)) return;
    napocitej(cil, stare, nove, 420);
  });
}

function napocitej(el, od, na, doba) {
  var start = null;
  function krok(t) {
    if (start === null) start = t;
    var p = Math.min(1, (t - start) / doba);
    var e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(od + (na - od) * e);
    if (p < 1) requestAnimationFrame(krok);
  }
  requestAnimationFrame(krok);
}

/* ---------- prstenec postupu ---------- */
function prstenec(hotovo, celkem, velikost) {
  var v = velikost || 40;
  var r = (v - 5) / 2;
  var obvod = 2 * Math.PI * r;
  var podil = celkem ? Math.min(1, hotovo / celkem) : 0;
  return '<span class="prsten" title="' + hotovo + ' z ' + celkem + '">' +
    '<svg viewBox="0 0 ' + v + ' ' + v + '" width="' + v + '" height="' + v + '" aria-hidden="true">' +
      '<circle cx="' + v / 2 + '" cy="' + v / 2 + '" r="' + r + '" fill="none" stroke="currentColor" ' +
        'stroke-width="3.5" opacity=".16"/>' +
      '<circle cx="' + v / 2 + '" cy="' + v / 2 + '" r="' + r + '" fill="none" stroke="currentColor" ' +
        'stroke-width="3.5" stroke-linecap="round" stroke-dasharray="' + obvod.toFixed(1) + '" ' +
        'stroke-dashoffset="' + (obvod * (1 - podil)).toFixed(1) + '" ' +
        'transform="rotate(-90 ' + v / 2 + ' ' + v / 2 + ')"/>' +
    '</svg>' +
    '<b class="num">' + Math.round(podil * 100) + '</b>' +
  '</span>';
}

/* ---------- konfety při vyhlášení ---------- */
function konfety() {
  if (!chceAnimace()) return;
  var c = document.createElement('canvas');
  c.className = 'konfety';
  var w = c.width = window.innerWidth;
  var h = c.height = window.innerHeight;
  document.body.appendChild(c);
  var ctx = c.getContext('2d');
  var barvy = ['#F7C63A', '#2E7D4F', '#14508C', '#D3312B', '#CFD8DE'];
  var kusy = [];
  for (var i = 0; i < 110; i++) {
    kusy.push({
      x: Math.random() * w, y: -20 - Math.random() * h * 0.5,
      vx: (Math.random() - 0.5) * 2.2, vy: 2.5 + Math.random() * 3.5,
      s: 5 + Math.random() * 7, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25,
      barva: barvy[i % barvy.length]
    });
  }
  var start = performance.now();
  (function krok(t) {
    var ubehlo = t - start;
    ctx.clearRect(0, 0, w, h);
    kusy.forEach(function (k) {
      k.x += k.vx; k.y += k.vy; k.rot += k.vr; k.vy += 0.03;
      ctx.save();
      ctx.translate(k.x, k.y);
      ctx.rotate(k.rot);
      ctx.globalAlpha = ubehlo > 2200 ? Math.max(0, 1 - (ubehlo - 2200) / 800) : 1;
      ctx.fillStyle = k.barva;
      ctx.fillRect(-k.s / 2, -k.s / 4, k.s, k.s / 2);
      ctx.restore();
    });
    if (ubehlo < 3000) requestAnimationFrame(krok);
    else c.remove();
  })(start);
}

/* ---------- kostry při načítání ---------- */
function kostry(kolik) {
  var h = '';
  for (var i = 0; i < (kolik || 3); i++) {
    h += '<div class="kostra">' +
      '<div class="kl" style="width:' + (45 + i * 7) + '%;height:19px"></div>' +
      '<div class="kl" style="width:62%;height:12px;margin-top:10px"></div>' +
      '<div class="kl" style="width:38%;height:12px;margin-top:8px"></div>' +
    '</div>';
  }
  return h;
}

function renderRoot() {
  var root = document.getElementById('root');
  var stary = root.querySelector('.board');
  var posun = stary ? stary.scrollLeft : 0;
  zmerPoradi(root);
  root.innerHTML = S.view === 'game' ? viewGame() : (S.view === 'career' ? viewKariera() : viewHome());
  var novy = root.querySelector('.board');
  if (novy && posun) novy.scrollLeft = posun;
  animujPoradi(root);
}

function renderOverlay() {
  var ov = document.getElementById('overlay');
  if (!openSheet) {
    if (ov.innerHTML) ov.innerHTML = '';
    lastSheet = null;
    return;
  }
  var stejny = (lastSheet === openSheet);
  var chipy = ov.querySelector('.pchips');
  var posunChipu = chipy ? chipy.scrollLeft : 0;
  var vnitrek = ov.querySelector('.sheet-in');
  var posunPanelu = vnitrek ? vnitrek.scrollTop : 0;

  ov.innerHTML = openSheet();

  if (stejny) {
    // stejný panel jen s novým obsahem – bez animace a se zachovaným posunem
    var sheet = ov.querySelector('.sheet');
    if (sheet) sheet.classList.add('noanim');
    var vnitrek2 = ov.querySelector('.sheet-in');
    if (vnitrek2 && posunPanelu) vnitrek2.scrollTop = posunPanelu;
    var chipy2 = ov.querySelector('.pchips');
    if (chipy2 && posunChipu) chipy2.scrollLeft = posunChipu;
  }
  lastSheet = openSheet;
}

function syncPill() {
  var cls = 'ok', txt = 'Uloženo';
  if (!S.online) { cls = 'warn'; txt = 'Offline · ' + S.queue.length + ' čeká'; }
  else if (S.syncing > 0) { cls = 'busy'; txt = 'Ukládám…'; }
  else if (S.queue.length) { cls = 'warn'; txt = S.queue.length + ' čeká na uložení'; }
  return '<span class="pill ' + cls + '" title="' + esc(txt) + '"><i class="dot"></i><span class="txt">' + esc(txt) + '</span></span>';
}
