function gameCard(g, live) {
  var vysl = (g.vysledky || []).slice().filter(function (v) { return v.jamky > 0; });
  vysl.sort(function (a, b) { return a.soucet - b.soucet || b.jamky - a.jamky; });
  var top = vysl[0];
  var avs = (g.hraci || []).slice(0, 6).map(function (jm, i) {
    return avaHtml(jm, avaOf(g, i), 30);
  }).join('');
  return '<button class="card" data-act="open" data-id="' + esc(g.id) + '">' +
    '<div style="display:flex;align-items:center;gap:8px">' +
      '<h3 style="flex:1">' + esc(g.misto || 'Minigolf') + '</h3>' +
      (live ? '<span class="tag live">Rozehráno</span>' : '<span class="tag">Dohráno</span>') +
    '</div>' +
    '<div class="meta"><span class="num">' + esc(czDate(g.datum)) + '</span><span>·</span><span>' + (g.hraci || []).length + ' ' + pl((g.hraci || []).length, 'hráč', 'hráči', 'hráčů') + '</span>' +
      (kolaHry(g) === 2 ? '<span>·</span><span>2 kola</span>' : '') + '</div>' +
    '<div style="display:flex;align-items:center;gap:10px;margin-top:9px">' +
      '<span class="avastack">' + avs + '</span>' +
      '<span class="meta" style="color:var(--ink);flex:1;margin:0">' +
        (top ? '<strong>' + esc(top.jmeno) + '</strong> <span class="num">' + top.soucet + '</span>' : 'Zatím bez skóre') +
        '<span style="color:var(--ink-soft)"> · ' + (g.odehranoJamek || 0) + '/' + HOLES + ' jamek</span>' +
      '</span>' +
    '</div>' +
  '</button>';
}

/* ---------- obrazovka hry ---------- */
/* ---------- vytahovací tabule pořadí ----------
   Sbalená ukazuje kartičky jako dosud, rozbalená přidá ke každému hráči
   sloupcový průběh po jamkách, takže je vidět, kde kdo ztrácel. */
function tabuleOtevrena() { return LS.get('tabule', false) === true; }

function sparkline(g, hracIdx, maxUder) {
  var kola = seznamKol(g);
  var pruhy = '';
  for (var h = 1; h <= HOLES; h++) {
    for (var ki = 0; ki < kola.length; ki++) {
      var v = S.scores[key(h, hracIdx, kola[ki])];
      var cls = !v ? 'nic' : (v === 1 ? 'eso' : isNe(v) ? 'ne' : '');
      var vyska = v ? Math.max(12, Math.round(v / maxUder * 100)) : 8;
      pruhy += '<i class="' + cls + '" style="height:' + vyska + '%" title="Jamka ' + h +
        (kola.length > 1 ? ', ' + kola[ki] + '. kolo' : '') + (v ? ': ' + fmt(v) : '') + '"></i>';
    }
  }
  return '<span class="spark">' + pruhy + '</span>';
}

function tabule(g, st) {
  var maxUder = 1;
  Object.keys(S.scores).forEach(function (k) { if (S.scores[k] > maxUder) maxUder = S.scores[k]; });

  var h = '<div class="tabule">';
  st.forEach(function (r, i) {
    h += '<div class="tr' + (i === 0 && r.jamky ? ' vede' : '') + '" data-lb="' + g.id + ':' + r.i + '">' +
      '<span class="m num">' + (r.jamky ? r.poradi : '–') + '</span>' +
      avaHtml(r.jmeno, avaOf(g, r.i), 28) +
      '<span class="jm">' + esc(r.jmeno) + '</span>' +
      sparkline(g, r.i, maxUder) +
      '<span class="sc num"' + (r.jamky ? ' data-pocitadlo="' + r.soucet + '"' : '') + '>' +
        (r.jamky ? r.soucet : '–') + '</span>' +
    '</div>';
  });
  h += '</div>';
  return h;
}

/* ---------- porovnání s minulou hrou na stejném hřišti ---------- */
function porovnani(g, st) {
  var vedouci = st.filter(function (r) { return r.jamky >= 3; })[0];
  if (!vedouci || !g.misto) return '';

  var kl = klicHrace(vedouci.jmeno);
  var misto = String(g.misto).trim().toLowerCase();
  var minula = null;

  S.games.forEach(function (x) {
    if (x.id === g.id) return;
    if (String(x.misto || '').trim().toLowerCase() !== misto) return;
    if (String(x.datum) > String(g.datum)) return;
    var m = (x.vysledky || []).filter(function (v) {
      return klicHrace(v.jmeno) === kl && v.jamky >= 3;
    })[0];
    if (!m) return;
    if (!minula || String(x.datum) > String(minula.datum)) minula = { datum: x.datum, v: m };
  });
  if (!minula) return '';

  var tedPrumer = vedouci.soucet / vedouci.jamky;
  var minPrumer = minula.v.soucet / minula.v.jamky;
  var rozdil = Math.round((minPrumer - tedPrumer) * vedouci.jamky);

  var text, cls, sipka;
  if (rozdil > 0) {
    cls = 'lepsi'; sipka = '<path d="M5 15l5-5 4 3 5-6"/>';
    text = esc(vedouci.jmeno) + ' je po ' + vedouci.jamky + ' ' + pl(vedouci.jamky, 'jamce', 'jamkách', 'jamkách') +
      ' o <b>' + rozdil + '</b> ' + pl(rozdil, 'úder', 'údery', 'úderů') + ' lepší než minule tady';
  } else if (rozdil < 0) {
    cls = 'horsi'; sipka = '<path d="M5 9l5 5 4-3 5 6"/>';
    text = esc(vedouci.jmeno) + ' zatím ztrácí <b>' + Math.abs(rozdil) + '</b> ' +
      pl(Math.abs(rozdil), 'úder', 'údery', 'úderů') + ' na své minulé kolo tady';
  } else {
    cls = 'stejne'; sipka = '<path d="M5 12h14"/>';
    text = esc(vedouci.jmeno) + ' drží stejné tempo jako minule tady';
  }

  return '<div class="porovnani ' + cls + '">' +
    '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" ' +
    'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + sipka + '</svg>' +
    '<span>' + text + ' <i>(' + czDate(minula.datum) + ')</i></span>' +
  '</div>';
}

function viewGame() {
  var g = S.game;
  if (!g) return '<div class="top"><button class="iconbtn" data-act="home">←</button><div class="grow"><div class="brand">Načítám…</div></div></div>';

  var st = standings(g, S.scores);
  var hotovo = (g.stav === 'finished');
  var h = '';

  h += '<div class="top">' +
       '<button class="iconbtn" data-act="home" aria-label="Zpět">' + ico('zpet') + '</button>' +
       '<div class="grow"><div class="brand" style="font-size:19px">' + esc(g.misto || 'Minigolf') + '</div>' +
       '<div class="subtle num">' + esc(czDate(g.datum)) + ' · ' + g.hraci.length + ' ' + pl(g.hraci.length, 'hráč', 'hráči', 'hráčů') +
       (kolaHry(g) === 2 ? ' · 2 kola' : '') + '</div></div>' +
       (hotovo ? '<span class="pill zamcena">' + ico('zamek', 14) + '<span class="txt">Ukončeno</span></span>' : '') +
       syncPill() +
       '<button class="iconbtn" data-act="refresh" aria-label="Načíst skóre znovu">' + ico('obnovit') + '</button>' +
       '<button class="iconbtn" data-act="settings" aria-label="Nastavení hry">' + ico('vic') + '</button>' +
       '</div>';

  h += '<div class="wrap">';

  if (hotovo) {
    h += '<h2 style="margin-top:14px">Výsledek</h2>' + podium(g, st);
  } else {
    var zapsano = 0, celkemZ = g.hraci.length * HOLES * kolaHry(g);
    for (var hz = 1; hz <= HOLES; hz++) {
      for (var pz = 0; pz < g.hraci.length; pz++) {
        var kolaZ = seznamKol(g);
        for (var kz = 0; kz < kolaZ.length; kz++) if (S.scores[key(hz, pz, kolaZ[kz])]) zapsano++;
      }
    }
    h += '<div class="hlava2"><h2 style="margin:0">Pořadí</h2>' +
      '<span style="display:flex;align-items:center;gap:10px">' + prstenec(zapsano, celkemZ) +
      '<button class="rozbal' + (tabuleOtevrena() ? ' on' : '') + '" data-act="tabule" ' +
      'aria-label="' + (tabuleOtevrena() ? 'Sbalit tabuli' : 'Rozbalit tabuli s průběhem') + '">' +
      '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
      '</button></span></div>';

    if (tabuleOtevrena()) {
      h += '<div class="tabulewrap" data-tabulewrap>' + tabule(g, st) + porovnani(g, st) +
        '<div class="uchyt" data-drag="tabule" role="button" tabindex="0" data-act="tabule" ' +
        'aria-label="Zpět na kartičky"><span class="bar"></span>' +
        '<span class="lbl">Tahem dolů zpět na kartičky</span></div>' +
        '</div>';
    } else {
      h += '<div class="tabulewrap" data-tabulewrap><div class="board">';
    st.forEach(function (r, i) {
      var extra = [];
      if (r.aces) extra.push(r.aces + '× eso');
      if (r.ne) extra.push(r.ne + '× NE');
      h += '<div class="lb' + (i === 0 && r.jamky ? ' first' : '') + '" data-lb="' + g.id + ':' + r.i + '" ' +
        'data-act="lbHrac" data-p="' + r.i + '" role="button" tabindex="0" ' +
        'aria-label="Průběh hráče ' + esc(r.jmeno) + ' po jamkách">' +
        '<div class="lbtop">' + avaHtml(r.jmeno, avaOf(g, r.i), 34) +
          '<span class="pos">' + (r.jamky ? r.poradi + '.' : '–') + '</span></div>' +
        '<div class="nm">' + esc(r.jmeno) + '</div>' +
        '<div class="tot num"' + (r.jamky ? ' data-pocitadlo="' + r.soucet + '"' : '') + '>' +
          (r.jamky ? r.soucet : '–') + '</div>' +
        '<div class="thru num">' + r.jamky + '/' + (HOLES * kolaHry(g)) + (kolaHry(g) === 2 ? ' zápisů' : ' jamek') + (extra.length ? ' · ' + extra.join(' · ') : '') + '</div>' +
      '</div>';
      });
      h += '</div>' + porovnani(g, st) +
        '<div class="uchyt" data-drag="tabule" role="button" tabindex="0" data-act="tabule" ' +
        'aria-label="Zobrazit průběh po jamkách"><span class="lbl">Tahem nahoru průběh po jamkách</span>' +
        '<span class="bar"></span></div>' +
        '</div>';
    }
  }

  if (S.tab === 'holes') {
    h += '<h2>Jamky</h2><div class="holes">';
    for (var hole = 1; hole <= HOLES; hole++) {
      var filled = 0, dots = '', kolaJ = seznamKol(g);
      for (var ki = 0; ki < kolaJ.length; ki++) {
        for (var p = 0; p < g.hraci.length; p++) {
          var v = S.scores[key(hole, p, kolaJ[ki])];
          if (v) { filled++; dots += '<i class="' + (v === 1 ? 'ace' : isNe(v) ? 'ne' : 'on') + '"></i>'; }
          else dots += '<i></i>';
        }
      }
      var celkem = g.hraci.length * kolaJ.length;
      var pct = Math.round(filled / celkem * 100);
      var rozehrana = (!hotovo && filled > 0 && filled < celkem);
      h += '<button class="hole' + (filled === celkem ? ' done' : '') + (rozehrana ? ' rozehrana' : '') + (hotovo ? ' locked' : '') + '" data-act="hole" data-hole="' + hole + '" style="--fill:' + pct + '%">' +
        '<span class="fill"></span>' +
        '<span class="hnum num">' + (hole < 10 ? '0' : '') + hole + '</span>' +
        '<span class="par num">' + filled + '/' + celkem + '</span>' +
        '<span class="dots">' + dots + '</span>' +
      '</button>';
    }
    h += '</div>';
    h += hotovo
      ? '<div class="locknote">' + ico('zamek', 18) + ' Hra je ukončená, skóre už nejde měnit. Odemkneš ji přes nabídku → Znovu otevřít.</div>'
      : '<div class="hint">Klepni na jamku a zapiš údery. Jamky můžeš vyplňovat v libovolném pořadí.</div>';
  } else if (S.tab === 'stats') {
    h += '<h2>Statistiky</h2>' + statistiky(g, st);
  } else {
    h += '<h2>Karta</h2>' + scorecard(g, st);
  }

  h += '</div>';

  h += '<div class="bottom"><div class="inner">' +
       '<button class="tab' + (S.tab === 'holes' ? ' on' : '') + '" data-act="tab" data-tab="holes">Jamky</button>' +
       '<button class="tab' + (S.tab === 'card' ? ' on' : '') + '" data-act="tab" data-tab="card">Karta</button>' +
       '<button class="tab' + (S.tab === 'stats' ? ' on' : '') + '" data-act="tab" data-tab="stats">Statistiky</button>' +
       '</div></div>';
  return h;
}

var mqNarrow = window.matchMedia ? window.matchMedia('(max-width: 559px)') : null;
function isNarrow() {
  return mqNarrow ? mqNarrow.matches : ((window.innerWidth || 400) < 560);
}
if (mqNarrow && mqNarrow.addEventListener) mqNarrow.addEventListener('change', function () { paint(); });
else if (mqNarrow && mqNarrow.addListener) mqNarrow.addListener(function () { paint(); });

/* Stupně vítězů – druhý vlevo, vítěz uprostřed, třetí vpravo. */
function podium(g, st) {
  var hrani = st.filter(function (r) { return r.jamky > 0; });
  if (!hrani.length) return '<div class="empty">Hra skončila bez zapsaného skóre.</div>';

  var top = hrani.slice(0, 3);
  var poradiNaStupni = top.length >= 3 ? [top[1], top[0], top[2]]
                     : top.length === 2 ? [top[1], top[0]]
                     : [top[0]];

  var h = '<div class="podium">';
  poradiNaStupni.forEach(function (r) {
    var m = Number(r.poradi);
    var cls = (m >= 1 && m <= 3) ? 'p' + m : 'p3';
    h += '<div class="pod ' + cls + '">' +
      '<div class="medal">' + medaile(m) + '</div>' +
      avaHtml(r.jmeno, avaOf(g, r.i), 54) +
      '<div class="nm">' + esc(r.jmeno) + '</div>' +
      '<div class="sc num">' + r.soucet + '</div>' +
      '<div class="sub num">' + r.jamky + '/' + (HOLES * kolaHry(g)) + (r.ne ? ' · ' + r.ne + '× NE' : '') + '</div>' +
      '<div class="step num">' + m + '</div>' +
    '</div>';
  });
  h += '</div>';

  h += '<div style="margin-top:14px"><button class="btn" data-act="shareImg">' + ico('foto') + ' Sdílet výsledek jako obrázek</button></div>';

  var zbytek = hrani.slice(3).concat(st.filter(function (r) { return r.jamky === 0; }));
  if (zbytek.length) {
    h += '<div class="rest">';
    zbytek.forEach(function (r) {
      h += '<div class="restrow">' +
        '<span class="r num">' + (r.jamky ? r.poradi + '.' : '–') + '</span>' +
        avaHtml(r.jmeno, avaOf(g, r.i), 30) +
        '<span class="nm">' + esc(r.jmeno) + '</span>' +
        '<span class="sc num">' + (r.jamky ? r.soucet : '–') + '</span>' +
        (r.ne ? '<span class="sub num">' + r.ne + '× NE</span>' : '') +
      '</div>';
    });
    h += '</div>';
  }
  return h;
}

/* ---------- kariéra hráčů napříč hrami ---------- */
/* Hráči se spojují podle jména – stejné jméno = stejný člověk.
   Velikost písmen a mezery navíc nevadí, "Tomáš" a "tomáš " je jeden hráč. */
function klicHrace(jmeno) {
  return String(jmeno || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function kariera(games) {
  var mapa = {};
  var maEsa = false;

  games.forEach(function (g) {
    var vysl = (g.vysledky || []).filter(function (v) { return v.jamky > 0; });
    if (!vysl.length) return;

    var poradi = vysl.slice().sort(function (a, b) { return a.soucet - b.soucet || b.jamky - a.jamky; });
    var nejlepsiSoucet = poradi[0].soucet;
    var avatary = avatarsOf(g);

    vysl.forEach(function (v) {
      var kl = klicHrace(v.jmeno);
      if (!kl) return;
      var x = mapa[kl] || (mapa[kl] = {
        jmeno: v.jmeno, her: 0, vyher: 0, udery: 0, jamky: 0,
        esa: 0, ne: 0, nejlepsiKolo: null, avatar: null, posledni: ''
      });
      x.her++;
      x.udery += v.soucet;
      x.jamky += v.jamky;
      if (typeof v.esa === 'number') { x.esa += v.esa; maEsa = true; }
      if (typeof v.ne === 'number') x.ne += v.ne;
      if (v.soucet === nejlepsiSoucet) x.vyher++;
      if (v.jamky === HOLES && (x.nejlepsiKolo === null || v.soucet < x.nejlepsiKolo)) {
        x.nejlepsiKolo = v.soucet;
      }
      // jméno i obrázek bereme z nejnovější hry
      if (!x.posledni || String(g.datum) > x.posledni) {
        x.posledni = String(g.datum);
        x.jmeno = v.jmeno;
        var idx = avatary[(g.hraci || []).indexOf(v.jmeno)];
        x.avatar = (typeof idx === 'number' && AVATARS[idx]) ? idx : null;
      }
    });
  });

  var pole = Object.keys(mapa).map(function (kl) {
    var x = mapa[kl];
    x.prumer = x.jamky ? x.udery / x.jamky : null;
    return x;
  });
  pole.sort(function (a, b) { return a.prumer - b.prumer; });
  return { hraci: pole, maEsa: maEsa };
}

/* Rekordy a vzájemné souboje. */
function rekordy(games) {
  var nejKolo = null, nejEsa = null, souboje = {}, serie = {}, nejSerie = null;

  // hry odzadu = chronologicky, kvůli sériím výher
  var chrono = games.slice().sort(function (a, b) {
    return String(a.datum) > String(b.datum) ? 1 : (String(a.datum) < String(b.datum) ? -1 : 0);
  });

  chrono.forEach(function (g) {
    var vysl = (g.vysledky || []).filter(function (v) { return v.jamky > 0; });
    if (!vysl.length) return;

    vysl.forEach(function (v) {
      if (v.jamky === HOLES && (!nejKolo || v.soucet < nejKolo.soucet)) {
        nejKolo = { jmeno: v.jmeno, soucet: v.soucet, datum: g.datum, misto: g.misto };
      }
      if (typeof v.esa === 'number' && v.esa > 0 && (!nejEsa || v.esa > nejEsa.esa)) {
        nejEsa = { jmeno: v.jmeno, esa: v.esa, datum: g.datum, misto: g.misto };
      }
    });

    // vzájemné souboje: jen hry, kde oba odehráli stejný počet jamek
    for (var i = 0; i < vysl.length; i++) {
      for (var j = i + 1; j < vysl.length; j++) {
        var a = vysl[i], b = vysl[j];
        if (a.jamky !== b.jamky) continue;
        if (a.soucet === b.soucet) continue;
        var vyhral = a.soucet < b.soucet ? a : b;
        var prohral = a.soucet < b.soucet ? b : a;
        var kl = klicHrace(vyhral.jmeno) + '>' + klicHrace(prohral.jmeno);
        souboje[kl] = (souboje[kl] || 0) + 1;
      }
    }

    // série výher
    var nej = Math.min.apply(null, vysl.map(function (v) { return v.soucet; }));
    vysl.forEach(function (v) {
      var kl = klicHrace(v.jmeno);
      serie[kl] = (v.soucet === nej) ? (serie[kl] || 0) + 1 : 0;
      if (serie[kl] >= 2 && (!nejSerie || serie[kl] > nejSerie.delka)) {
        nejSerie = { jmeno: v.jmeno, delka: serie[kl] };
      }
    });
  });

  return { nejKolo: nejKolo, nejEsa: nejEsa, souboje: souboje, nejSerie: nejSerie };
}

function bilance(souboje, kdo, proti) {
  return {
    vyhry: souboje[kdo + '>' + proti] || 0,
    prohry: souboje[proti + '>' + kdo] || 0
  };
}

/* ---------- detail hráče v kariéře ---------- */
var karieraCache = null;

function sheetHrac() {
  var x = karieraCache.hraci[detailHrace];
  var r = karieraCache.rekordy;
  var kl = klicHrace(x.jmeno);

  var proti = karieraCache.hraci.filter(function (y) { return klicHrace(y.jmeno) !== kl; })
    .map(function (y) {
      var b = bilance(r.souboje, kl, klicHrace(y.jmeno));
      return { hrac: y, vyhry: b.vyhry, prohry: b.prohry, spolu: b.vyhry + b.prohry };
    })
    .filter(function (z) { return z.spolu > 0; })
    .sort(function (a, b) { return b.spolu - a.spolu; });

  var h = '<div class="sheet" data-act="close-bg"><div class="sheet-in" role="dialog" aria-label="Hráč">' +
    '<div class="grabber"></div><div class="sheet-head">' +
      '<button class="iconbtn" data-act="close" aria-label="Zavřít">' + ico('zavrit') + '</button>' +
      '<div class="t" style="display:flex;align-items:center;gap:10px">' +
        avaHtml(x.jmeno, x.avatar, 38) + esc(x.jmeno) + '</div>' +
    '</div>' +
    '<div class="statgrid">' +
      '<div class="stat"><div class="v num">' + x.her + '</div><div class="k">Odehráno her</div></div>' +
      '<div class="stat"><div class="v num">' + x.vyher + '</div><div class="k">Výher</div>' +
        '<div class="s">' + Math.round(x.vyher / x.her * 100) + ' % her</div></div>' +
      '<div class="stat"><div class="v num">' + x.prumer.toFixed(2).replace('.', ',') + '</div><div class="k">Průměr na jamku</div></div>' +
      '<div class="stat"><div class="v num">' + (x.nejlepsiKolo === null ? '–' : x.nejlepsiKolo) + '</div>' +
        '<div class="k">Nejlepší kolo</div></div>' +
    '</div>';

  if (karieraCache.maEsa) {
    h += '<div class="statgrid" style="margin-top:9px">' +
      '<div class="stat"><div class="v num" style="color:var(--sun)">' + x.esa + '</div><div class="k">Es celkem</div></div>' +
      '<div class="stat"><div class="v num" style="color:var(--signal)">' + x.ne + '</div><div class="k">Nedaných jamek</div></div>' +
      '<div class="stat"><div class="v num">' + x.jamky + '</div><div class="k">Odehraných jamek</div></div>' +
      '<div class="stat"><div class="v num">' + x.udery + '</div><div class="k">Úderů celkem</div></div>' +
    '</div>';
  }

  if (proti.length) {
    h += '<h2>Vzájemné souboje</h2>';
    proti.forEach(function (z) {
      var vede = z.vyhry > z.prohry, prohrava = z.vyhry < z.prohry;
      h += '<div class="restrow">' +
        avaHtml(z.hrac.jmeno, z.hrac.avatar, 30) +
        '<span class="nm">' + esc(z.hrac.jmeno) + '</span>' +
        '<span class="sc num" style="color:' + (vede ? 'var(--turf)' : prohrava ? 'var(--signal)' : 'var(--ink-soft)') + '">' +
          z.vyhry + ':' + z.prohry + '</span>' +
      '</div>';
    });
    h += '<div class="hint">Počítají se jen hry, kde oba zapsali stejný počet jamek. Remízy se nepočítají.</div>';
  } else {
    h += '<div class="hint" style="margin-top:14px">Zatím žádný společně dohraný souboj k porovnání.</div>';
  }

  h += '<div style="margin-top:16px"><button class="btn ghost" data-act="close">Zavřít</button></div>';
  return h + '</div></div>';
}
var detailHrace = 0;

/* Teplotní mapa jamek pro jednoho hráče v rozehrané hře: kde ztrácí proti partě.
   Otevírá se klepnutím na kartičku v pořadí. */
var detailHraceHra = 0;

function sheetHraHrac() {
  var g = S.game;
  if (!g) return '';
  var pi = detailHraceHra, kola = seznamKol(g), jm = g.hraci[pi] || '';
  var dlazdice = '', ztraty = [], soucet = 0, odehrano = 0, esa = 0;

  for (var hh = 1; hh <= HOLES; hh++) {
    var moje = 0, pocet = 0, mane = false;
    for (var ki = 0; ki < kola.length; ki++) {
      var v = S.scores[key(hh, pi, kola[ki])];
      if (v) { moje += v; pocet++; if (isNe(v)) mane = true; if (v === 1) esa++; }
    }
    var muj = pocet ? moje / pocet : null;
    var skup = prumerJamky(hh);
    if (pocet) { soucet += moje; odehrano += pocet; }
    var rozdil = (muj != null && skup != null) ? muj - skup : null;
    if (rozdil != null && rozdil >= .5) ztraty.push({ h: hh, d: rozdil });

    var tt = heatT(muj);
    dlazdice += '<div class="hm' + (mane ? ' fail' : '') + '"' +
      (tt == null ? '' : ' style="--h:' + heatBarva(tt) + '"') + '>' +
      '<span class="n num">' + (hh < 10 ? '0' : '') + hh + '</span>' +
      '<span class="v num">' + (pocet ? (mane ? 'NE' : moje) : '–') + '</span>' +
      (rozdil == null || Math.abs(rozdil) < .5
        ? '<span class="d"> </span>'
        : '<span class="d num" style="color:' + (rozdil > 0 ? 'var(--signal)' : 'var(--turf)') + '">' +
            (rozdil > 0 ? '+' : '−') + Math.abs(rozdil).toFixed(1).replace('.', ',') + '</span>') +
    '</div>';
  }

  ztraty.sort(function (a, b) { return b.d - a.d; });
  var nej = ztraty.slice(0, 3).map(function (z) { return (z.h < 10 ? '0' : '') + z.h; });

  return '<div class="sheet" data-act="close-bg"><div class="sheet-in" role="dialog" aria-label="Průběh hráče">' +
    '<div class="grabber"></div><div class="sheet-head">' +
      '<button class="iconbtn" data-act="close" aria-label="Zavřít">' + ico('zavrit') + '</button>' +
      '<div class="t" style="display:flex;align-items:center;gap:10px">' +
        avaHtml(jm, avaOf(g, pi), 38) + esc(jm) + '</div>' +
    '</div>' +
    '<div class="statgrid">' +
      '<div class="stat"><div class="v num">' + (odehrano ? soucet : '–') + '</div><div class="k">Bodů zapsáno</div></div>' +
      '<div class="stat"><div class="v num">' + (odehrano ? (soucet / odehrano).toFixed(2).replace('.', ',') : '–') + '</div>' +
        '<div class="k">Průměr na jamku</div></div>' +
      '<div class="stat"><div class="v num" style="color:var(--sun)">' + esa + '</div><div class="k">Es</div></div>' +
      '<div class="stat"><div class="v num">' + odehrano + '</div><div class="k">Zapsaných jamek</div></div>' +
    '</div>' +
    '<h2>Kde ztrácíš</h2>' +
    '<div class="hmgrid">' + dlazdice + '</div>' +
    '<div class="hmleg"><span>lépe</span><i></i><span>hůř</span></div>' +
    '<div class="hint">' + (nej.length
      ? 'Proti zbytku party nejvíc ztrácíš na ' + (nej.length === 1 ? 'jamce ' : 'jamkách ') + nej.join(', ') +
        '. Malé číslo v dlaždici je rozdíl proti průměru party.'
      : 'Proti zbytku party zatím nikde výrazně neztrácíš.') + '</div>' +
    '<div style="margin-top:16px"><button class="btn ghost" data-act="close">Zavřít</button></div>' +
  '</div></div>';
}

function viewKariera() {

  k.rekordy = rekordy(S.games);
  karieraCache = k;
  var h = '';

     'Ze všech her dohromady, i z rozehraných. Nižší číslo je lepší – zelený prsten má nejlepší průměr, červený nejhorší. Klepnutím otevřeš detail hráče.');

        (r.nejKolo.misto ? ' · ' + esc(r.nejKolo.misto) : '') + ' · ' + esc(czDate(r.nejKolo.datum)) + '</span></span>' +
        '<span class="sc num">' + r.nejKolo.soucet + '</span></div>';
    }
    if (r.nejEsa) {
      h += '<div class="restrow"><span class="rekico">' + ico('hvezda', 20) + '</span>' +
        '<span class="nm">Nejvíc es v jedné hře<br><span class="sub">' + esc(r.nejEsa.jmeno) +
        ' · ' + esc(czDate(r.nejEsa.datum)) + '</span></span>' +
        '<span class="sc num">' + r.nejEsa.esa + '</span></div>';

    }
  }

  h += '<h2>Přehled hráčů</h2><div class="tablewrap"><table><thead><tr>' +

    '<th class="num">Jamek</th><th class="num">Úderů</th>' +
    (k.maEsa ? '<th class="num">Es</th><th class="num">NE</th>' : '') +
    '<th class="num">Nej kolo</th><th class="num">Ø</th></tr></thead><tbody>';
  k.hraci.forEach(function (x) {

      '<td class="num">' + (x.vyher || '·') + '</td>' +

      '<td class="num">' + x.udery + '</td>' +
      (k.maEsa ? '<td class="num' + (x.esa ? ' ace' : '') + '">' + (x.esa || '·') + '</td>' +
                 '<td class="num' + (x.ne ? ' ne' : '') + '">' + (x.ne || '·') + '</td>' : '') +
      '<td class="num">' + (x.nejlepsiKolo === null ? '·' : x.nejlepsiKolo) + '</td>' +
      '<td class="num tot">' + x.prumer.toFixed(2).replace('.', ',') + '</td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="hint">Klepnutím na hráče se zobrazí jeho detail a vzájemné souboje. Výhra je nejnižší součet ve hře, o dělené první místo se hráči podělí. ' +
    'Nej kolo bere jen hry se všemi ' + HOLES + ' zapsanými jamkami.' +
    (k.maEsa ? '' : ' Esa a nedané jamky se objeví po aktualizaci skriptu v Google Sheets.') + '</div>';

  return h + '</div>';
}

/* ---------- známí hráči a sestavy z historie ---------- */
/* Našeptávání drží kariéru pohromadě – překlep ve jméně by z jednoho
   člověka udělal dva a rozdělil mu statistiky. */
function znamiHraci() {
  var mapa = {};
  S.games.forEach(function (g) {
    var av = avatarsOf(g);
    (g.hraci || []).forEach(function (jm, i) {
      var kl = klicHrace(jm);
      if (!kl) return;
      var z = mapa[kl] || (mapa[kl] = { jmeno: jm, avatar: null, kdy: '', her: 0 });
      z.her++;
      if (String(g.datum) > z.kdy) {
        z.kdy = String(g.datum);
        z.jmeno = jm;
        var idx = av[i];
        z.avatar = (typeof idx === 'number' && AVATARS[idx]) ? idx : null;
      }
    });
  });
  return Object.keys(mapa).map(function (k) { return mapa[k]; })
    .sort(function (a, b) { return b.her - a.her || (a.jmeno > b.jmeno ? 1 : -1); });
}

/* Poslední různé sestavy – pro tlačítko „hrát znovu se stejnou partou". */
function posledniSestavy(max) {
  var videne = {}, out = [];
  for (var i = 0; i < S.games.length && out.length < (max || 3); i++) {
    var g = S.games[i];
    var hraci = (g.hraci || []).filter(Boolean);
    if (hraci.length < 2) continue;
    var kl = hraci.map(klicHrace).sort().join('|');
    if (videne[kl]) continue;
    videne[kl] = true;
    out.push({ hraci: hraci.slice(), avatary: hraci.map(function (_, j) { return avaOf(g, j); }), kola: kolaHry(g) });
  }
  return out;
}

/* ---------- statistiky jedné hry ---------- */
/* Průměr na jamku: buď body na společné ose, nebo prsteny. Volba se pamatuje. */
function prumerBlok(radky, nadpis, poznamka, poznamkaPrsteny) {
  function dve(n) { return n.toFixed(2).replace('.', ','); }
  var rezim = LS.get('prumer-rezim', 'osa');
  var prum = radky.map(function (r) { return r.avg; });
  var minP = Math.min.apply(null, prum), maxP = Math.max.apply(null, prum);
  var rozP = (maxP - minP) || 1;
  var h = '<div class="row" style="align-items:center;justify-content:space-between;gap:10px;margin-top:14px">' +
    '<h2 style="margin:0">' + nadpis + '</h2>' +
    '<div class="tabs" style="margin:0;flex:0 0 auto;display:flex;width:max-content">' +
      '<button class="tab' + (rezim === 'osa' ? ' on' : '') + '" data-act="prumRezim" data-r="osa" ' +
        'style="flex:0 0 auto;overflow:visible;padding:12px 16px">Osa</button>' +
      '<button class="tab' + (rezim === 'prsteny' ? ' on' : '') + '" data-act="prumRezim" data-r="prsteny" ' +
        'style="flex:0 0 auto;overflow:visible;padding:12px 16px">Prsteny</button>' +
    '</div></div>';

  if (rezim === 'prsteny') {
    /* Podíl na kruhu: nejlepší průměr začíná na 42 %, nejhorší končí na 62 %. */
    h += '<div class="prstgrid">' + radky.map(function (r) {
      var turn = (0.42 + ((r.avg - minP) / rozP) * 0.2).toFixed(3);
      var barva = r.avg === minP ? 'var(--turf)' : (r.avg === maxP && maxP !== minP ? 'var(--signal)' : 'var(--ink-soft)');
      return '<button class="prst' + (r.avg === minP ? ' best' : '') + (r.avg === maxP && maxP !== minP ? ' worst' : '') + '"' +
        (r.act ? ' data-act="' + r.act + '" data-i="' + r.idx + '"' : '') + '>' +
        '<span class="kruh" style="background:conic-gradient(' + barva + ' 0turn ' + turn + 'turn,' +
          'color-mix(in srgb,var(--ink) 10%,transparent) ' + turn + 'turn 1turn)">' +
          '<span class="stred num">' + dve(r.avg) + '</span></span>' +
        '<span class="nm">' + esc(r.jmeno) + '</span></button>';
    }).join('') + '</div>';
  } else {
    h += radky.map(function (r) {
      var pct = ((r.avg - minP) / rozP) * 92 + 4;   /* 4–96 %, ať se bod nikde nesekoří */
      return '<div class="barrow' + (r.avg === minP ? ' best' : '') + (r.avg === maxP && maxP !== minP ? ' worst' : '') + '"' +
        (r.act ? ' data-act="' + r.act + '" data-i="' + r.idx + '"' : '') + '>' +
        r.ava +
        '<span class="nm">' + esc(r.jmeno) + '</span>' +
        '<span class="osa"><span class="bod" style="left:' + pct.toFixed(1) + '%"></span></span>' +
        '<span class="v num">' + dve(r.avg) + '</span></div>';
    }).join('');
    if (radky.length > 1 && maxP !== minP) {
      h += '<div class="osaleg"><span class="ava-sp"></span><span class="nm"></span>' +
        '<span class="sk"><span>' + dve(minP) + '</span><span>' + dve((minP + maxP) / 2) + '</span>' +
        '<span>' + dve(maxP) + '</span></span><span class="v"></span></div>';
    }
  }
  return h + '<div class="hint">' + (rezim === 'prsteny' ? poznamkaPrsteny : poznamka) + '</div>';
}

function statistiky(g, st) {
  var np = g.hraci.length;

  // průměry po jamkách
  var kola = seznamKol(g);
  var jamky = [], celkSoucet = 0, celkPocet = 0;
  for (var h = 1; h <= HOLES; h++) {
    var s = 0, c = 0;
    for (var p = 0; p < np; p++) {
      for (var ki = 0; ki < kola.length; ki++) {
        var v = S.scores[key(h, p, kola[ki])];
        if (v) { s += v; c++; }
      }
    }
    jamky.push({ h: h, avg: c ? s / c : null, cnt: c });
    celkSoucet += s; celkPocet += c;
  }
  if (!celkPocet) {
    return '<div class="empty">Statistiky naskočí, jakmile zapíšeš první údery.</div>';
  }

  var esa = 0, neCelkem = 0;
  st.forEach(function (r) { esa += r.aces; neCelkem += r.ne; });

  // nejtěžší a nejlehčí jamka
  var odehrane = jamky.filter(function (j) { return j.cnt > 0; });
  var maxAvg = Math.max.apply(null, odehrane.map(function (j) { return j.avg; }));
  var minAvg = Math.min.apply(null, odehrane.map(function (j) { return j.avg; }));
  var nejtezsi = odehrane.filter(function (j) { return j.avg === maxAvg; });
  var nejlehci = odehrane.filter(function (j) { return j.avg === minAvg; });

  var hraciSeSkore = st.filter(function (r) { return r.jamky > 0; });
  var prumery = hraciSeSkore.map(function (r) { return r.soucet / r.jamky; });
  var nejlepsiPrumer = Math.min.apply(null, prumery);
  var nejhorsiPrumer = Math.max.apply(null, prumery);

  function jedno(n) { return n.toFixed(2).replace('.', ','); }
  function seznamJamek(pole) { return pole.map(function (j) { return j.h; }).join(', '); }

  var h2 = '';

  // souhrn
  h2 += '<div class="statgrid">' +
    '<div class="stat"><div class="v num">' + jedno(celkSoucet / celkPocet) + '</div>' +
      '<div class="k">Průměr na jamku</div><div class="s">všichni dohromady</div></div>' +
    '<div class="stat"><div class="v num">' + celkPocet + '/' + (HOLES * np) + '</div>' +
      '<div class="k">Zapsáno</div><div class="s">' + odehrane.length + ' ' + pl(odehrane.length, 'rozehraná jamka', 'rozehrané jamky', 'rozehraných jamek') + '</div></div>' +
    '<div class="stat"><div class="v num" style="color:var(--sun)">' + esa + '</div>' +
      '<div class="k">Es celkem</div><div class="s">jamka na jednu ránu</div></div>' +
    '<div class="stat"><div class="v num" style="color:var(--signal)">' + neCelkem + '</div>' +
      '<div class="k">Nedaných jamek</div><div class="s">po ' + NESPLNENO + ' bodech</div></div>' +
  '</div>';

  // průměr na jamku podle hráčů
  h2 += prumerBlok(hraciSeSkore.map(function (r) {
    return { avg: r.soucet / r.jamky, jmeno: r.jmeno, ava: avaHtml(r.jmeno, avaOf(g, r.i), 26) };
  }), 'Průměr na jamku', 'Nižší číslo je lepší. Osa je napínutá mezi nejlepším a nejhorším průměrem – vzdálenost bodů je skutečný rozdíl.',
     'Nižší číslo je lepší. Zelený prsten má nejlepší průměr v téhle hře, červený nejhorší.');

  // obtížnost jamek
  h2 += '<h2>Obtížnost jamek</h2><div class="holebars">';
  jamky.forEach(function (j) {
    var cls = j.cnt === 0 ? 'none' : (j.avg === maxAvg ? 'max' : (j.avg === minAvg ? 'min' : ''));
    var vyska = j.cnt === 0 ? 3 : Math.max(6, Math.round(j.avg / maxAvg * 100));
    h2 += '<div class="hb ' + cls + '" title="Jamka ' + j.h + (j.cnt ? ': průměr ' + jedno(j.avg) : ': zatím nic') + '">' +
      '<span class="b" style="height:' + vyska + '%"></span>' +
      '<span class="l">' + j.h + '</span>' +
    '</div>';
  });
  h2 += '</div>';
  h2 += '<div class="legend">' +
    '<span><i style="background:var(--signal)"></i>nejtěžší: jamka ' + seznamJamek(nejtezsi) + ' (' + jedno(maxAvg) + ')</span>' +
    '<span><i style="background:var(--turf)"></i>nejlehčí: jamka ' + seznamJamek(nejlehci) + ' (' + jedno(minAvg) + ')</span>' +
  '</div>';

  // rozpis úderů
  h2 += '<h2>Kdo co nahrál</h2><div class="tablewrap"><table><thead><tr>' +
    '<th class="sticky">Hráč</th><th class="num">1</th><th class="num">2</th><th class="num">3</th>' +
    '<th class="num">4</th><th class="num">5+</th><th class="num">NE</th>' +
    '<th class="num">Nej</th><th class="num">Ø</th></tr></thead><tbody>';
  hraciSeSkore.forEach(function (r) {
    var d = { 1: 0, 2: 0, 3: 0, 4: 0, v: 0 }, nej = null;
    for (var hh = 1; hh <= HOLES; hh++) {
      for (var kk = 0; kk < kola.length; kk++) {
        var vv = S.scores[key(hh, r.i, kola[kk])];
        if (!vv) continue;
        if (vv <= 4) d[vv]++; else d.v++;   // nedaná jamka = 12 úderů, padá do 5+
        if (nej === null || vv < nej) nej = vv;
      }
    }
    h2 += '<tr><td class="sticky"><span class="td-p">' + avaHtml(r.jmeno, avaOf(g, r.i), 24) +
      '<span>' + esc(r.jmeno) + '</span></span></td>' +
      '<td class="num' + (d[1] ? ' ace' : '') + '">' + (d[1] || '·') + '</td>' +
      '<td class="num">' + (d[2] || '·') + '</td>' +
      '<td class="num">' + (d[3] || '·') + '</td>' +
      '<td class="num">' + (d[4] || '·') + '</td>' +
      '<td class="num">' + (d.v || '·') + '</td>' +
      '<td class="num' + (r.ne ? ' ne' : '') + '">' + (r.ne || '·') + '</td>' +
      '<td class="num">' + (nej === null ? '·' : nej) + '</td>' +
      '<td class="num tot">' + jedno(r.soucet / r.jamky) + '</td></tr>';
  });
  h2 += '</tbody></table></div>';
  h2 += '<div class="hint">Nedaná jamka se počítá jako ' + NESPLNENO + ' úderů, takže spadá do sloupce 5+ a je i v součtu a průměru. Sloupec NE ukazuje, kolikrát se to stalo. Nej je nejlepší jamka hráče, Ø jeho průměr na jamku.</div>';

  return h2;
}

/* ---------- výsledek jako obrázek na sdílení ---------- */
function nactiObrazek(src) {
  return new Promise(function (res) {
    var im = new Image();
    im.onload = function () { res(im); };
    im.onerror = function () { res(null); };
    im.src = src;
  });
}

function kruh(ctx, im, x, y, r, jmeno) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  if (im) {
    ctx.drawImage(im, x - r, y - r, r * 2, r * 2);
  } else {
    ctx.fillStyle = avaBarva(jmeno);
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.fillStyle = '#fff';
    ctx.font = '700 ' + Math.round(r * 1.1) + 'px Archivo, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pismeno(jmeno), x, y + 2);
  }
  ctx.restore();
}

function obrazekVysledku(g, st) {
  var hrani = st.filter(function (r) { return r.jamky > 0; });
  var top = hrani.slice(0, 3);
  var zbytek = hrani.slice(3);

  var W = 1080;
  var H = 870 + zbytek.length * 92;
  var potreba = hrani.map(function (r) {
    var idx = avaOf(g, r.i);
    return (idx != null && AVATARS[idx]) ? AVATARS[idx] : null;
  });

  return Promise.all(potreba.map(function (src) { return src ? nactiObrazek(src) : Promise.resolve(null); }))
  .then(function (obrazky) {
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var ctx = c.getContext('2d');

    // pozadí
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#12406F');
    grad.addColorStop(1, '#0C2B4C');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '400 62px Anton, Impact, sans-serif';
    ctx.fillText('MINIGOLF', W / 2, 96);
    ctx.fillStyle = '#9EC3E6';
    ctx.font = '600 34px Archivo, sans-serif';
    ctx.fillText((g.misto || 'Minigolf') + '  ·  ' + czDate(g.datum) +
      (kolaHry(g) === 2 ? '  ·  2 kola' : ''), W / 2, 146);

    // stupně vítězů
    var poradiNaStupni = top.length >= 3 ? [top[1], top[0], top[2]] : (top.length === 2 ? [top[1], top[0]] : [top[0]]);
    var poziceX = top.length >= 3 ? [W / 2 - 300, W / 2, W / 2 + 300] : (top.length === 2 ? [W / 2 - 170, W / 2 + 170] : [W / 2]);
    var vysky = { 1: 210, 2: 150, 3: 110 };
    var barvy = { 1: ['#F7C63A', '#D69B08'], 2: ['#C3CED6', '#93A4B0'], 3: ['#D5915B', '#A96A38'] };
    var zaklad = 720;

    poradiNaStupni.forEach(function (r, i) {
      var m = Math.min(3, Math.max(1, Number(r.poradi)));
      var x = poziceX[i];
      var vyska = vysky[m];
      var sirka = 250;
      var vrchStupne = zaklad - vyska;

      var gg = ctx.createLinearGradient(0, vrchStupne, 0, zaklad);
      gg.addColorStop(0, barvy[m][0]);
      gg.addColorStop(1, barvy[m][1]);
      ctx.fillStyle = gg;
      zaobleny(ctx, x - sirka / 2, vrchStupne, sirka, vyska + 20, 16);
      ctx.fill();

      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.font = '400 64px Anton, Impact, sans-serif';
      ctx.fillText(String(m), x, vrchStupne + vyska / 2 + 24);

      // text se odvíjí od vrcholu stupínku, aby se s ním nikdy nepřekryl
      var yScore = vrchStupne - 20;
      var yJmeno = yScore - 46;
      var stred = yJmeno - 34 - 76;

      var idxObr = hrani.indexOf(r);
      kruh(ctx, obrazky[idxObr], x, stred, 76, r.jmeno);
      ctx.strokeStyle = barvy[m][0];
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(x, stred, 79, 0, Math.PI * 2); ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 34px Archivo, sans-serif';
      ctx.fillText(zkrat(ctx, r.jmeno, 240), x, yJmeno);
      ctx.font = '400 52px Anton, Impact, sans-serif';
      ctx.fillText(String(r.soucet), x, yScore);
    });

    // ostatní hráči
    var y = zaklad + 70;
    ctx.textAlign = 'left';
    zbytek.forEach(function (r) {
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      zaobleny(ctx, 90, y, W - 180, 74, 18);
      ctx.fill();
      ctx.fillStyle = '#9EC3E6';
      ctx.font = '400 34px Anton, Impact, sans-serif';
      ctx.fillText(r.poradi + '.', 120, y + 50);
      kruh(ctx, obrazky[hrani.indexOf(r)], 208, y + 37, 26, r.jmeno);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '600 32px Archivo, sans-serif';
      ctx.fillText(zkrat(ctx, r.jmeno, 520), 248, y + 49);
      ctx.textAlign = 'right';
      ctx.font = '400 40px Anton, Impact, sans-serif';
      ctx.fillText(String(r.soucet), W - 120, y + 50);
      ctx.textAlign = 'left';
      y += 92;
    });

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.font = '500 26px Archivo, sans-serif';
    ctx.fillText(HOLES + ' jamek' + (kolaHry(g) === 2 ? ' × 2 kola' : '') +
      ' · nižší počet úderů vyhrává', W / 2, H - 36);

    return new Promise(function (res) { c.toBlob(res, 'image/png'); });
  });
}

function zkrat(ctx, text, maxSirka) {
  var t = String(text);
  if (ctx.measureText(t).width <= maxSirka) return t;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxSirka) t = t.slice(0, -1);
  return t + '…';
}

function zaobleny(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function sdilejObrazek() {
  var g = S.game;
  if (!g) return;
  var st = standings(g, S.scores);
  if (!st.filter(function (r) { return r.jamky > 0; }).length) {
    toast('Zatím není co sdílet – chybí skóre', true); return;
  }
  toast('Připravuju obrázek…');
  obrazekVysledku(g, st).then(function (blob) {
    if (!blob) throw new Error('nepovedlo se');
    var nazev = 'minigolf-' + String(g.datum).slice(0, 10) + '.png';
    var soubor = new File([blob], nazev, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [soubor] })) {
      return navigator.share({ files: [soubor], title: 'Minigolf ' + (g.misto || '') });
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nazev;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    toast('Obrázek stažen');
  }).catch(function (e) {
    if (e && e.name === 'AbortError') return;   // uživatel sdílení zrušil
    toast('Obrázek se nepovedlo vytvořit', true);
  });
}

/* ---------- výsledek jako obrázek: konec ---------- */
function scorecard(g, st) {
  return (isNarrow() ? cardByHole(g, st) : cardByPlayer(g, st)) + cardFooter(g);
}

/* Na telefonu: jamky pod sebou, hráči vedle sebe – vejde se bez posouvání do stran. */
function cardByHole(g, st) {
  var kola = seznamKol(g);
  var h = '<div class="tablewrap"><table class="byhole"><thead><tr><th class="sticky">Jamka</th>';
  st.forEach(function (r) {
    h += '<th class="num"><span class="th-p">' + avaHtml(r.jmeno, avaOf(g, r.i), 30) +
      '<span class="pn">' + esc(r.jmeno) + '</span></span></th>';
  });
  h += '</tr></thead><tbody>';
  for (var hole = 1; hole <= HOLES; hole++) {
    h += '<tr data-act="hole" data-hole="' + hole + '"><td class="sticky num">' + hole + '</td>';
    for (var j = 0; j < st.length; j++) {
      if (kola.length === 1) {
        var v = S.scores[key(hole, st[j].i, 1)];
        h += '<td class="num' + (v === 1 ? ' ace' : isNe(v) ? ' ne' : '') + '">' + (v ? fmt(v) : '·') + '</td>';
      } else {
        h += '<td class="num">' + kola.map(function (k) {
          var vv = S.scores[key(hole, st[j].i, k)];
          var cls = vv === 1 ? 'ace' : isNe(vv) ? 'ne' : '';
          return '<span class="' + cls + '">' + (vv ? fmt(vv) : '·') + '</span>';
        }).join('<span class="deli">/</span>') + '</td>';
      }
    }
    h += '</tr>';
  }
  h += '</tbody><tfoot><tr><td class="sticky">NE</td>';
  st.forEach(function (r) { h += '<td class="num' + (r.ne ? ' ne' : '') + '">' + (r.ne || '·') + '</td>'; });
  h += '</tr><tr><td class="sticky">Celkem</td>';
  st.forEach(function (r) { h += '<td class="num tot">' + (r.jamky ? r.soucet : '–') + '</td>'; });
  h += '</tr></tfoot></table></div>';
  return h;
}

/* Na širší obrazovce: klasická karta, hráči po řádcích. */
function cardByPlayer(g, st) {
  var kola = seznamKol(g);
  var h = '<div class="tablewrap"><table><thead><tr><th class="sticky">Hráč</th>';
  if (kola.length > 1) h += '<th class="num">Kolo</th>';
  for (var i = 1; i <= HOLES; i++) h += '<th class="num">' + i + '</th>';
  h += '<th class="num">NE</th><th class="num">Σ</th></tr></thead><tbody>';
  st.forEach(function (r, idx) {
    kola.forEach(function (k, ki) {
      h += '<tr' + (idx === 0 && r.jamky ? ' class="win"' : '') + '>';
      if (ki === 0) {
        h += '<td class="sticky"' + (kola.length > 1 ? ' rowspan="' + kola.length + '"' : '') + '><span class="td-p">' +
          avaHtml(r.jmeno, avaOf(g, r.i), 26) +
          '<span>' + (r.jamky ? r.poradi + '. ' : '') + esc(r.jmeno) + '</span></span></td>';
      }
      if (kola.length > 1) h += '<td class="num" style="color:var(--ink-soft)">' + k + '.</td>';
      for (var hole = 1; hole <= HOLES; hole++) {
        var v = S.scores[key(hole, r.i, k)];
        h += '<td class="num' + (v === 1 ? ' ace' : isNe(v) ? ' ne' : '') + '">' + (v ? fmt(v) : '·') + '</td>';
      }
      if (ki === 0) {
        var rs = kola.length > 1 ? ' rowspan="' + kola.length + '"' : '';
        h += '<td class="num' + (r.ne ? ' ne' : '') + '"' + rs + '>' + (r.ne || '·') + '</td>';
        h += '<td class="num tot"' + rs + '>' + (r.jamky ? r.soucet : '–') + '</td>';
      }
      h += '</tr>';
    });
  });
  h += '</tbody></table></div>';
  return h;
}

function cardFooter(g) {
  var hotovo = (g.stav === 'finished');
  return '<div class="hint">' + (kolaHry(g) === 2 ? 'Hraje se na dvě kola, vítězí nejnižší součet obou kol dohromady. ' : '') +
    'NE = jamka nedaná ani na ' + MAX_UDERU + '. pokus, počítá se za ' + NESPLNENO + ' bodů.' +
    (isNarrow() && !hotovo ? ' Klepnutím na řádek jamky ji rovnou otevřeš.' : '') + '</div>' +
    '<div class="row" style="margin-top:12px">' +
    '<button class="btn ghost" data-act="shareImg">' + ico('foto', 18) + ' Obrázek</button>' +
    '<button class="btn ghost" data-act="share">' + ico('odkaz', 18) + ' Odkaz</button>' +
    '<button class="btn ' + (hotovo ? 'ghost' : '') + '" data-act="' + (hotovo ? 'reopen' : 'finish') + '">' +
    (hotovo ? 'Znovu otevřít' : 'Ukončit a vyhlásit') + '</button></div>';
}

/* ---------- panel jamky ---------- */
/* ---------- mapky jamek ----------
   Ilustrace půdorysů všech 18 jamek: pohled shora, odpaliště vlevo, jamka vpravo.
   Gradienty jsou nadefinované jednou v <svg> spritu na začátku dokumentu. */
var MAPY = [

function mapaJamky(hole) {
  var m = MAPY[hole];
  if (!m) return '';
  var open = mapaOtevrena(hole), rek = rekordJamky(hole);
  var svg = '<svg viewBox="' + (m.vb || '0 40 300 84') + '" role="img" aria-label="Půdorys jamky ' + hole + ': ' + esc(m.po) + '">' + m.kr + '</svg>';
  var nejHtml = rek
    ? '<span class="nej' + (rekordNovy === hole ? ' rekord-novy' : '') + '" title="Rekord jamky ze všech her">' + esc(rek.jmena.join(', ')) + ' ' + rek.v + '</span>'
    : '';
  var pasRek = rek
    ? '<span class="rek pas' + (rekordNovy === hole ? ' rekord-novy' : '') + '" title="Rekord jamky ze všech her">Rekord: <b>' + esc(rek.jmena.join(', ')) +
      '</b> údery: <b>' + rek.v + '</b></span>'
    : '';
  /* Obtížnost jamky: tečka v barvě průměru party, žádné další číslo na obrazovce. */
  var t = heatT(prumerJamky(hole));
  var tecka = t == null ? '' : '<i class="tt" style="background:' + heatBarva(t) + '"></i>';
  var telo = open
    ? '<button class="mapabtn mapa" data-act="mapaFull" aria-label="Zvětšit půdorys jamky ' + hole + '">' + svg +
        '<div class="popis">' + tecka + '<strong style="color:var(--ink)">' + esc(m.nm) + '</strong> · ' + esc(m.po) +
        (rek ? '<span class="rek">Rekord: <b>' + esc(rek.jmena.join(', ')) + '</b> údery: <b>' + rek.v + '</b></span>' : '') + '</div></button>'
    : '<button class="mapabtn mapa pas" data-act="mapaFull" aria-label="Zvětšit půdorys jamky ' + hole + ': ' + esc(m.nm) + '">' +
        svg + '<span class="nm"><span>' + tecka + esc(m.nm) + '</span>' + pasRek + '</span>' + '</button>';
  var uchyt = open
    ? '<button class="uchytm" data-drag="mapa" data-act="mapa" aria-label="Schovat půdorys jamky">' +
        '<span class="lbl">Tahem nahoru zavřít</span><span class="bar"></span></button>'
    : '<button class="uchytm" data-drag="mapa" data-act="mapa" aria-label="Zobrazit půdorys jamky">' +
        '<span class="bar"></span><span class="lbl">Tahem dolů mapka</span></button>';
  return '<div class="mapawrap" data-mapawrap>' + telo + uchyt + '</div>';
}

/* Mapka na celé obrazovce – leží nad panelem zápisu, zavře se klepnutím kamkoli. */
function mapaZoom(hole) {
  var m = MAPY[hole];
  if (!m) return '';
  return '<div class="mapazoom" data-act="mapaZoomClose" role="dialog" aria-label="Půdorys jamky ' + hole + '">' +
    '<div class="hl">Jamka ' + (hole < 10 ? '0' : '') + hole + ' · ' + esc(m.nm) + '</div>' +
    '<svg viewBox="' + (m.vb || '0 40 300 84') + '" role="img" aria-label="' + esc(m.po) + '">' + m.kr + '</svg>' +
    '<div class="po">' + esc(m.po) + '</div>' +
    '<button class="btn ghost" data-act="mapaZoomClose" style="max-width:260px">Zavřít</button>' +
  '</div>';
}

/* 6a + 6c: úchyt jako u tabule pořadí, výchozí stav podle toho, jestli je jamka
   rozehraná. Ruční volba přebíjí automatiku a drží se po celou jamku;
   zavření si appka pamatuje na hru, ne globálně. */
var mapaStav = { hole: null, rucni: null, zoom: null };
var mapaPotlacitKlik = false;

function zapsanoNaJamce(hole) {
  var g = S.game;
  if (!g) return 0;
  var kola = seznamKol(g), n = 0;
  for (var ki = 0; ki < kola.length; ki++) {
    for (var p = 0; p < g.hraci.length; p++) if (S.scores[key(hole, p, kola[ki])]) n++;
  }
  return n;
}

/* Rekord jamky napříč všemi hrami, ne jen tou rozehranou. Historie na serveru
   drží jen součty, ale każdá otevřená hra si nechává lokální kopii skóre
   pod klíčem "g:<id>" – z těch se rekord poskádá. */
var rekordyCache = null;

function rekordyJamek() {
  if (rekordyCache) return rekordyCache;
  var out = {};
  function zvaz(hole, udery, jmeno) {
    if (!hole || !udery || isNe(udery) || !jmeno) return;
    var r = out[hole];
    if (!r || udery < r.v) out[hole] = { v: udery, jmena: [jmeno] };
    else if (udery === r.v) {
      var kl = klicHrace(jmeno);
      var uz = r.jmena.some(function (j) { return klicHrace(j) === kl; });
      if (!uz) r.jmena.push(jmeno);
    }
  }
  (S.games || []).forEach(function (g) {
    var c = LS.get('g:' + g.id, null);
    if (!c || !c.skore) return;
    var hraci = (c.game && c.game.hraci) || g.hraci || [];
    c.skore.forEach(function (s) { zvaz(s.jamka, s.udery, hraci[s.hrac]); });
  });
  if (S.game) {
    var kolaR = seznamKol(S.game);
    for (var hh = 1; hh <= HOLES; hh++) {
      for (var ki = 0; ki < kolaR.length; ki++) {
        for (var p = 0; p < S.game.hraci.length; p++) {
          zvaz(hh, S.scores[key(hh, p, kolaR[ki])], S.game.hraci[p]);
        }
      }
    }
  }
  rekordyCache = out;
  return out;
}

function rekordJamky(hole) { return rekordyJamek()[hole] || null; }

function nejNaJamce(hole) {
  var g = S.game;
  if (!g) return null;
  var kola = seznamKol(g), nej = null;
  for (var ki = 0; ki < kola.length; ki++) {
    for (var p = 0; p < g.hraci.length; p++) {
      var v = S.scores[key(hole, p, kola[ki])];
      if (v && !isNe(v) && (nej === null || v < nej)) nej = v;
    }
  }
  return nej;
}

/* Průměr jamky přes celou partu – základ pro obtížnost i teplotní mapu. */
function prumerJamky(hole) {
  var g = S.game;
  if (!g) return null;
  var kola = seznamKol(g), s = 0, n = 0;
  for (var ki = 0; ki < kola.length; ki++) {
    for (var p = 0; p < g.hraci.length; p++) {
      var v = S.scores[key(hole, p, kola[ki])];
      if (v) { s += v; n++; }
    }
  }
  return n ? s / n : null;
}

/* Obtížnost 0–1: eso je nula, čtyři a víc je jednička. */
function heatT(avg) {
  if (avg == null) return null;
  return Math.max(0, Math.min(1, (avg - 1.6) / 2.4));
}

function heatBarva(t) {
  if (t == null) return 'transparent';
  return t < .5
    ? 'color-mix(in oklab,var(--sun) ' + Math.round(t * 200) + '%,var(--turf))'
    : 'color-mix(in oklab,var(--signal) ' + Math.round((t - .5) * 200) + '%,var(--sun))';
}

function mapaOtevrena(hole) {
  if (mapaStav.hole === hole && mapaStav.rucni !== null) return mapaStav.rucni;
  if (S.game && LS.get('mapa-skryta-' + S.game.id, false) === true) return false;
  if (window.innerHeight >= 860) return true;   /* vejde se i s klávesnicí – není co schovávat */
  return zapsanoNaJamce(hole) === 0;
}

function mapaPrepni(hole) {
  var open = !mapaOtevrena(hole);
  mapaStav.hole = hole;
  mapaStav.rucni = open;
  if (S.game) LS.set('mapa-skryta-' + S.game.id, !open);
}

var holeState = { hole: 1, player: 0, kolo: 1 };

/* Pásek jamek 01–18: přehled o celém kole i navigace, místo samotných šipek. */
function pasekJamek(aktivni) {
  var g = S.game;
  if (!g) return '';
  var kola = seznamKol(g), celkem = kola.length * g.hraci.length, out = '';
  for (var hh = 1; hh <= HOLES; hh++) {
    var mam = 0, mane = false;
    for (var ki = 0; ki < kola.length; ki++) {
      for (var p = 0; p < g.hraci.length; p++) {
        var vv = S.scores[key(hh, p, kola[ki])];
        if (vv) { mam++; if (isNe(vv)) mane = true; }
      }
    }
    var cl = 'hpin';
    if (hh === aktivni) cl += ' now';
    else if (mane) cl += ' fail';
    else if (mam >= celkem) cl += ' done';
    else if (mam) cl += ' part';
    out += '<button class="' + cl + '" data-act="jump" data-h="' + hh + '"' +
      (hh === aktivni ? ' data-now="1" aria-current="true"' : '') +
      ' aria-label="Jamka ' + hh + '">' + (hh < 10 ? '0' : '') + hh + '</button>';
  }
  return '<div class="pasek" data-pasek>' + out + '</div>';
}

/* Aktivní jamka se dostane doprostřed pásku, ale jen když se opravdu změnila –
   jinak by ruční posun pásku skakal zpátky. */
var pasekPosledni = null;
function centrujPasek() {
  var p = document.querySelector('[data-pasek]');
  if (!p) { pasekPosledni = null; return; }
  if (pasekPosledni === holeState.hole) return;
  pasekPosledni = holeState.hole;
  var a = p.querySelector('[data-now]');
  if (a) p.scrollLeft = Math.max(0, a.offsetLeft - p.clientWidth / 2 + a.offsetWidth / 2);
}

/* Mikrointerakce panelu jamky: 2 – avatary se přesouvají plynule (FLIP),
   3 – zapsané číslo vyskočí, 5 – panel přijede ze strany podle směru přejetí. */
var popHrac = null, smerJamky = '', flipPozice = null, rekordNovy = null;

function flipUloz() {
  flipPozice = {};
  document.querySelectorAll('.pchips .pava').forEach(function (el) {
    flipPozice[el.getAttribute('data-p')] = el.getBoundingClientRect().left;
  });
}

function flipPrehraj() {
  if (!flipPozice) return;
  var stare = flipPozice;
  flipPozice = null;
  document.querySelectorAll('.pchips .pava').forEach(function (el) {
    var p = el.getAttribute('data-p');
    if (!(p in stare)) return;
    var dx = stare[p] - el.getBoundingClientRect().left;
    if (Math.abs(dx) < 2) return;
    el.style.transition = 'none';
    el.style.transform = 'translateX(' + dx + 'px)';
    requestAnimationFrame(function () { el.style.transition = ''; el.style.transform = ''; });
  });
}

/* Zapsané číslo poblízne jen jednou – další překreslení už je bez animace. */
function pop(i) { popHrac = i; setTimeout(function () { popHrac = null; }, 400); }
function smer(s) { smerJamky = s; setTimeout(function () { smerJamky = ''; }, 260); }

function sheetHole() {
  var g = S.game;
  var hole = holeState.hole, pi = holeState.player;
  var kola = seznamKol(g);
  var ko = holeState.kolo || 1;
  var cur = S.scores[key(hole, pi, ko)];

  var prepinac = '';
  if (kola.length > 1) {
    prepinac = '<div class="row" style="gap:8px;margin-bottom:10px">' + kola.map(function (k) {
      var hotovo = koloKompletni(hole, k);
      return '<button class="tab' + (k === ko ? ' on' : '') + '" data-act="setKolo" data-k="' + k + '" ' +
        'style="border-color:var(--line);background:var(--card)">' + k + '. kolo' +
        (hotovo ? ' <span style="color:var(--turf)">' + ico('fajfka', 14, 2.6) + '</span>' : '') + '</button>';
    }).join('') + '</div>';
  }

  var MINUS = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 12h12"/></svg>';
  var PLUS = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>';

  /* B+C: velký hráč na řadě nahoře, zbytek jen avatary seřazení „nezapsaní první“.
     Ani při osmi lidech se nic neposouvá do stran. */
  var akt = g.hraci[pi] || '';
  var aktPm = (cur && !isNe(cur))
    ? '<button class="pcpm" data-act="pm" data-p="' + pi + '" data-d="-1" aria-label="' + esc(akt) + ': o ránu méně">' + MINUS + '</button>' +
      '<button class="pcpm" data-act="pm" data-p="' + pi + '" data-d="1" aria-label="' + esc(akt) + ': o ránu víc">' + PLUS + '</button>'
    : '';
  var naRade = '<div class="narade' + (cur ? ' filled' : '') + (isNe(cur) ? ' fail' : '') + '">' +
    avaHtml(akt, avaOf(g, pi), 40) +
    '<span class="jm">' + esc(akt) + '</span>' +
    '<span class="v num' + (popHrac === pi ? ' pop' : '') + '">' + (cur ? fmt(cur) : '–') + '</span>' + aktPm + '</div>';

  /* 6 – živý souboj: kdo vede a o kolik, plus kdo je na řadě. */
  var stH = standings(g, S.scores), souboj = '';
  var odehrane = stH.filter(function (r) { return r.jamky > 0; });
  if (odehrane.length > 1) {
    var v1 = odehrane[0], v2 = odehrane[1];
    var roz = v2.soucet - v1.soucet;
    souboj = '<div class="souboj">' +
      '<span>Vede <b>' + esc(v1.jmeno) + '</b> ' +
      (roz === 0 ? 'shodně s <b>' + esc(v2.jmeno) + '</b>' : 'o <span class="roz">' + roz + '</span> ' + pl(roz, 'bod', 'body', 'bodů')) +
      '</span><span class="tah">Na řadě <b>' + esc(akt) + '</b></span></div>';
  }

  var poradi = g.hraci.map(function (jm, i) { return i; })
    .filter(function (i) { return i !== pi; })
    .sort(function (a, b) {
      var av = S.scores[key(hole, a, ko)] ? 1 : 0, bv = S.scores[key(hole, b, ko)] ? 1 : 0;
      return av - bv || a - b;                    /* nezapsaní napřed, jinak pořadí hry */
    });
  var chips = poradi.map(function (i) {
    var jm = g.hraci[i], v = S.scores[key(hole, i, ko)];
    return '<button class="pava' + (v ? ' filled' : '') + (isNe(v) ? ' fail' : '') + '" ' +
      'data-act="pick" data-p="' + i + '" title="' + esc(jm) + '" ' +
      'aria-label="' + esc(jm) + (v ? ': ' + fmt(v) : ': zatím nezapsáno') + '">' +
      avaHtml(jm, avaOf(g, i), 40) +
      '<span class="v num' + (popHrac === i ? ' pop' : '') + '">' + (v ? fmt(v) : '–') + '</span></button>';
  }).join('');

  /* Ukončená hra: jamky jdou procházet a prohlížet, ale zapisovat už ne. */
  var zamceno = (g.stav === 'finished');
  if (zamceno) {
    var vypis = g.hraci.map(function (jm, i) {
      var vv = S.scores[key(hole, i, ko)];
      return '<div class="vysl' + (vv === 1 ? ' eso' : '') + (isNe(vv) ? ' fail' : '') + '">' +
        avaHtml(jm, avaOf(g, i), 32) +
        '<span class="jm">' + esc(jm) + '</span>' +
        '<span class="v num">' + (vv ? fmt(vv) : '–') + '</span></div>';
    }).join('');
    return '<div class="sheet" data-act="close-bg"><div class="sheet-in" role="dialog" aria-label="Jamka ' + hole + '">' +
      '<div class="grabber"></div><div class="sheet-head">' +
        '<button class="iconbtn" data-act="prev" ' + (hole === 1 ? 'disabled style="opacity:.4"' : '') + ' aria-label="Předchozí jamka">' + ico('zpet') + '</button>' +
        '<div class="t" style="text-align:center">Jamka ' + (hole < 10 ? '0' : '') + hole + '</div>' +
        '<button class="iconbtn" data-act="next" ' + (hole === HOLES ? 'disabled style="opacity:.4"' : '') + ' aria-label="Další jamka">' + ico('vpred') + '</button>' +
        '<button class="iconbtn" data-act="close" aria-label="Zavřít">' + ico('zavrit') + '</button>' +
      '</div>' +
      prepinac +
      pasekJamek(hole) +
      mapaJamky(hole) +
      '<div class="vyslgrid">' + vypis + '</div>' +
      '<div class="hint" style="display:flex;align-items:center;gap:7px">' + ico('zamek', 14) +
        '<span>Hra je ukončená – skóre jde jen prohlížet. Odemkneš ji tlačítkem „Znovu otevřít“.</span></div>' +
      '<div class="row" style="margin-top:10px">' +
        '<button class="btn ghost" data-act="close">Zavřít</button>' +
        (hole < HOLES ? '<button class="btn" data-act="next">Jamka ' + (hole + 1) + ' →</button>' : '') +
      '</div>' +
    '</div></div>' + (mapaStav.zoom === hole ? mapaZoom(hole) : '');
  }

  var keys = '';
  for (var n = 1; n <= MAX_UDERU; n++) {
    keys += '<button class="key num' + (n === 1 ? ' ace' : '') + (cur === n ? ' sel' : '') + '" data-act="set" data-n="' + n + '">' + n + '</button>';
  }
  keys += '<button class="key fail' + (isNe(cur) ? ' sel' : '') + '" data-act="set" data-n="' + NESPLNENO + '">Nedal<small>' + NESPLNENO + ' bodů</small></button>';
  keys += '<button class="key wipe" data-act="set" data-n="">Smazat</button>';

  var zbyva = g.hraci.filter(function (_, i) { return !S.scores[key(hole, i, ko)]; }).length;
  var popisKola = kola.length > 1 ? ' v ' + ko + '. kole' : '';

  var undoHtml = '';
  if (undoZapis) {
    var u = undoZapis;
    undoHtml = '<button class="undo" data-act="undo">' +
      '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5L4 10l5 5"/>' +
      '<path d="M4 10h9a6 6 0 010 12h-2"/></svg>' +
      '<span class="tx">Vrátit <b>' + esc(u.jmeno) + '</b> na ' +
        (u.prev == null ? 'nezapsáno' : fmt(u.prev)) +
        (u.hole !== hole ? ' (jamka ' + u.hole + ')' : '') + '</span>' +
      '<i class="cas"></i></button>';
  }

  return '<div class="sheet" data-act="close-bg"><div class="sheet-in' + (smerJamky ? ' ' + smerJamky : '') + '" role="dialog" aria-label="Jamka ' + hole + '">' +
    '<div class="grabber"></div><div class="sheet-head">' +
      '<button class="iconbtn" data-act="prev" ' + (hole === 1 ? 'disabled style="opacity:.4"' : '') + ' aria-label="Předchozí jamka">' + ico('zpet') + '</button>' +
      '<div class="t" style="text-align:center">Jamka ' + (hole < 10 ? '0' : '') + hole + '</div>' +
      '<button class="iconbtn" data-act="next" ' + (hole === HOLES ? 'disabled style="opacity:.4"' : '') + ' aria-label="Další jamka">' + ico('vpred') + '</button>' +
      '<button class="iconbtn" data-act="close" aria-label="Zavřít">' + ico('zavrit') + '</button>' +
    '</div>' +
    prepinac +
    pasekJamek(hole) +
    mapaJamky(hole) +
    souboj +
    naRade +
    '<div class="pchips">' + chips + '</div>' +
    '<div class="keypad">' + keys + '</div>' +
    undoHtml +
    '<div class="hint">' + (zbyva ? 'Zbývá zapsat: ' + zbyva + ' ' + pl(zbyva, 'hráč', 'hráči', 'hráčů') + popisKola : 'Jamka je kompletní.') + ' Přejetím prstem přepneš jamku.</div>' +
    '<div class="row" style="margin-top:10px">' +
      '<button class="btn ghost" data-act="close">Hotovo</button>' +
      (hole < HOLES ? '<button class="btn" data-act="next">Jamka ' + (hole + 1) + ' →</button>' : '') +
    '</div>' +
  '</div></div>' + (mapaStav.zoom === hole ? mapaZoom(hole) : '');
}

/* ---------- nová hra ---------- */
var formState = null;

/* Kolečko u jména – klepnutím se otevře okno s obrázky. */
function avaVyber(jm, i, sel, form) {
  return '<button class="avabtn" data-act="pickAva" data-form="' + form + '" data-i="' + i + '" aria-label="Vybrat obrázek">' +
    avaHtml(jm, sel, 44) + '</button>';
}

/* ---------- okno s výběrem obrázku ---------- */
var pickFor = null;   // { form: 'new' | 'edit', i: index hráče }

function sheetAva() {
  var jm, cur;
  if (pickFor.form === 'new') { jm = formState.hraci[pickFor.i] || ''; cur = formState.avatary[pickFor.i]; }
  else { jm = editState.hraci[pickFor.i] || ''; cur = editState.avatary[pickFor.i]; }
  if (typeof cur !== 'number') cur = null;

  var g = '<button class="avapick' + (cur === null ? ' sel' : '') + '" data-act="setAva" data-n="">' +
    avaHtml(jm, null, 62) + '<span class="lbl">Bez obrázku</span></button>';
  for (var i = 0; i < AVATARS.length; i++) {
    g += '<button class="avapick' + (cur === i ? ' sel' : '') + '" data-act="setAva" data-n="' + i + '">' +
      '<span class="ava" style="--s:62px"><img src="' + AVATARS[i] + '" alt="Obrázek ' + (i + 1) + '"></span>' +
    '</button>';
  }

  return '<div class="sheet" data-act="close-bg"><div class="sheet-in" role="dialog" aria-label="Výběr obrázku">' +
    '<div class="grabber"></div><div class="sheet-head">' +
      '<button class="iconbtn" data-act="backFromAva" aria-label="Zpět">' + ico('zpet') + '</button>' +
      '<div class="t">' + (jm ? esc(jm) : 'Obrázek hráče') + '</div>' +
    '</div>' +
    '<div class="avagrid">' + g + '</div>' +
    '<div style="margin-top:16px"><button class="btn ghost" data-act="backFromAva">Zpět</button></div>' +
  '</div></div>';
}

function sheetNew() {
  var f = formState;
  var znami = znamiHraci();
  var navrhy = znami.length
    ? '<datalist id="znami-hraci">' + znami.map(function (z) {
        return '<option value="' + esc(z.jmeno) + '"></option>';
      }).join('') + '</datalist>'
    : '';

  var sestavy = posledniSestavy(3);
  sestavyCache = sestavy;
  var sestavyHtml = '';
  if (sestavy.length) {
    sestavyHtml = '<label class="f">Hrát znovu se stejnou partou</label><div class="board">' +
      sestavy.map(function (se, i) {
        return '<button class="lb" data-act="sestava" data-i="' + i + '" style="text-align:left">' +
          '<span class="avastack" style="margin-bottom:6px">' +
            se.hraci.slice(0, 5).map(function (jm, j) { return avaHtml(jm, se.avatary[j], 26); }).join('') +
          '</span>' +
          '<div class="nm" style="white-space:normal">' + esc(se.hraci.join(', ')) + '</div>' +
        '</button>';
      }).join('') + '</div>';
  }

  var rows = f.hraci.map(function (jm, i) {
    var sel = (typeof f.avatary[i] === 'number') ? f.avatary[i] : null;
    return '<div class="playerrow">' +
      avaVyber(jm, i, sel, 'new') +
      '<input type="text" data-f="hrac" data-i="' + i + '" value="' + esc(jm) + '" placeholder="Jméno hráče" autocomplete="off"' +
        (znami.length ? ' list="znami-hraci"' : '') + '>' +
      (f.hraci.length > 1 ? '<button class="rm" data-act="rmp" data-i="' + i + '" aria-label="Odebrat hráče">' + ico('zavrit', 18) + '</button>' : '') +
    '</div>';
  }).join('');

  return '<div class="sheet" data-act="close-bg"><div class="sheet-in" role="dialog" aria-label="Nová hra">' +
    '<div class="grabber"></div><div class="sheet-head"><div class="t">Nová hra</div><button class="iconbtn" data-act="close" aria-label="Zavřít">' + ico('zavrit') + '</button></div>' +
    navrhy + sestavyHtml +
    '<label class="f" for="f-datum">Datum hry</label>' +
    '<input id="f-datum" type="date" data-f="datum" value="' + esc(f.datum) + '">' +
    '<label class="f" for="f-misto">Kde hrajete</label>' +
    '<input id="f-misto" type="text" data-f="misto" value="' + esc(f.misto) + '" placeholder="Např. Poruba, Landek…" autocomplete="off">' +
    '<label class="f">Počet kol</label>' +
    '<div class="row" style="gap:8px">' +
      '<button class="tab' + (f.kola === 1 ? ' on' : '') + '" data-act="setKola" data-k="1" style="border-color:var(--line);background:var(--card)">Jednokolová</button>' +
      '<button class="tab' + (f.kola === 2 ? ' on' : '') + '" data-act="setKola" data-k="2" style="border-color:var(--line);background:var(--card)">Dvoukolová</button>' +
    '</div>' +
    '<div class="hint">' + (f.kola === 2
      ? 'Na každé jamce se hrají dvě kola a vítězí nejnižší součet obou dohromady.'
      : 'Každá jamka se hraje jednou.') + '</div>' +
    '<label class="f">Hráči a obrázky</label>' +
    '<div class="hint" style="margin:-2px 2px 10px">Napiš jméno a klepni na kolečko vlevo – vyskočí okno s obrázky na výběr.' +
      (znami.length ? ' U jmen se ti nabízí hráči z minulých her, ať sedí statistiky.' : '') + '</div>' + rows +
    (f.hraci.length < 12 ? '<button class="btn ghost" data-act="addp" style="margin-top:2px">' + ico('plus', 18) + ' Přidat hráče</button>' : '') +
    '<div style="margin-top:18px"><button class="btn big" data-act="create">Založit hru</button></div>' +
    '<div class="hint">Počítají se jen údery, 1 až ' + MAX_UDERU + '. Kdo jamku nedá ani na ' + MAX_UDERU + '. pokus, dostane ' + NESPLNENO + ' bodů.</div>' +
  '</div></div>';
}
var sestavyCache = [];

/* ---------- nastavení appky ---------- */
var STYLY = [
  { id:'travnik', nazev:'Trávník', popis:'Zeleň hřiště, pruhy po sekačce', barvy:['#0F6B45','#E9B426','#EDF2E8'], tmavyJde:true },
  { id:'fotka',   nazev:'Modrá',   popis:'Původní vzhled s fotkou',       barvy:['#14508C','#F2B417','#EDF1F0'], tmavyJde:true },
  { id:'stadion', nazev:'Stadion', popis:'Noční, svítivý akcent',         barvy:['#0A0C0F','#C6F24E','#232A33'], tmavyJde:false },
  { id:'papir',   nazev:'Papír',   popis:'Skórkarta, razítková červená',  barvy:['#EFE9DB','#B23A2E','#4A6B3F'], tmavyJde:true },
  { id:'bloky',   nazev:'Bloky',   popis:'Syté barvy, černé obrysy',      barvy:['#FFC93C','#2ED3C6','#FF6B8A'], tmavyJde:true }
];

function motiv() { return LS.get('motiv', 'auto'); }
function styl() {
  var s = LS.get('styl', 'travnik');
  return STYLY.some(function (x) { return x.id === s; }) ? s : 'travnik';
}
function stylData() {
  var id = styl();
  return STYLY.filter(function (x) { return x.id === id; })[0];
}

/* Tmavost rozhoduje JavaScript, aby styly nemusely řešit systémové dotazy. */
function pouzijMotiv() {
  var el = document.documentElement;
  var st = stylData();
  var m = motiv();

  if (styl() === 'travnik') el.removeAttribute('data-styl');
  else el.setAttribute('data-styl', styl());

  var tmavy;
  if (!st.tmavyJde) tmavy = true;
  else if (m === 'tmavy') tmavy = true;
  else if (m === 'svetly') tmavy = false;
  else tmavy = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

  if (tmavy) el.setAttribute('data-tmavy', ''); else el.removeAttribute('data-tmavy');
  el.setAttribute('data-motiv', tmavy ? 'tmavy' : 'svetly');

  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', getComputedStyle(el).getPropertyValue('--paper').trim() || '#0F6B45');
}

/* Při volbě „podle systému" reagujeme na přepnutí v telefonu. */
(function () {
  if (!window.matchMedia) return;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var reakce = function () { if (motiv() === 'auto') pouzijMotiv(); };
  if (mq.addEventListener) mq.addEventListener('change', reakce);
  else if (mq.addListener) mq.addListener(reakce);
})();

function sheetApi() {
  var m = motiv();
  var aktStyl = styl();
  var st = stylData();
  var dlazdice = STYLY.map(function (x) {
    return '<button class="styl' + (x.id === aktStyl ? ' on' : '') + '" data-act="setStyl" data-s="' + x.id + '">' +
      '<span class="vzorek">' + x.barvy.map(function (b) {
        return '<i style="background:' + b + '"></i>';
      }).join('') + '</span>' +
      '<b>' + x.nazev + '</b>' +
      '<span class="po">' + x.popis + '</span>' +
    '</button>';
  }).join('');

  var volby = [['auto', 'Podle systému'], ['svetly', 'Světlý'], ['tmavy', 'Tmavý']];
  var prep = volby.map(function (v) {
    return '<button class="tab' + (m === v[0] ? ' on' : '') + '" data-act="setMotiv" data-m="' + v[0] + '" ' +
      'style="border-color:var(--line);background:var(--card)">' + v[1] + '</button>';
  }).join('');

  return '<div class="sheet" data-act="close-bg"><div class="sheet-in" role="dialog" aria-label="Nastavení">' +
    '<div class="grabber"></div><div class="sheet-head"><div class="t">Nastavení</div><button class="iconbtn" data-act="close" aria-label="Zavřít">' + ico('zavrit') + '</button></div>' +
    '<label class="f" style="margin-top:0">Styl</label>' +
    '<div class="styly">' + dlazdice + '</div>' +
    '<label class="f">Světlost</label>' +
    (st.tmavyJde
      ? '<div class="row" style="gap:8px">' + prep + '</div>' +
        '<div class="hint">„Podle systému" se řídí nastavením telefonu.</div>'
      : '<div class="hint" style="margin-top:0">Styl ' + esc(st.nazev) + ' existuje jen v tmavé podobě, ' +
        'proto se tu nedá přepínat.</div>') +
    '<label class="f" for="a-url">Adresa skriptu</label>' +
    '<input id="a-url" type="text" data-f="apiurl" value="' + esc(apiUrl()) + '" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">' +
    '<div class="hint">Najdeš ji v Apps Scriptu pod Nasadit → Spravovat nasazení. Musí končit na /exec.</div>' +
    '<div style="margin-top:14px"><button class="btn" data-act="testApi">Otestovat a uložit</button></div>' +
    '<div style="margin-top:10px"><button class="btn ghost" data-act="resetApi">Vrátit adresu z kódu</button></div>' +
  '</div></div>';
}

function testApi() {
  var el = document.querySelector('[data-f="apiurl"]');
  if (!el) return;
  var v = el.value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(v)) {
    toast('Adresa musí začínat script.google.com a končit /exec', true); return;
  }
  var btn = document.querySelector('[data-act="testApi"]');
  if (btn) { btn.textContent = 'Zkouším spojení…'; btn.disabled = true; }
  var prev = LS.get('api', '');
  LS.set('api', v);
  revPodporovan = true; znamyRev = null;
  api('ping').then(function () {
    openSheet = null;
    toast('Připojeno k Google Sheets');
    paint();
    loadGames();
  }).catch(function (e) {
    LS.set('api', prev);
    toast('Nepovedlo se: ' + e.message, true);
    if (btn) { btn.textContent = 'Otestovat a uložit'; btn.disabled = false; }
  });
}
