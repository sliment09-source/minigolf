<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minigolf – skóre</title>
<meta name="description" content="Zápis skóre na 18 jamek, průběžné pořadí a historie her.">
<meta name="theme-color" content="#14508C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minigolf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314508C'/><circle cx='50' cy='62' r='16' fill='%23F7F9F7'/><rect x='44' y='16' width='7' height='40' fill='%23F7F9F7'/><path d='M51 18 L78 26 L51 34 Z' fill='%23D3312B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10222E;
  --ink-soft:#5C7180;
  --cobalt:#14508C;
  --cobalt-dk:#0E3A69;
  --turf:#2E7D4F;
  --signal:#D3312B;
  --sun:#F2B417;
  --paper:#EDF1F0;
  --card:#FFFFFF;
  --line:#D4DCDA;
  --tile:#FFFFFF;
  --shadow:0 1px 0 rgba(16,34,46,.06), 0 6px 18px -10px rgba(16,34,46,.35);
  --r:14px;
  --display:"Anton","Haettenschweiler","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#E8EEF1; --ink-soft:#93A7B3;
    --cobalt:#3B84D0; --cobalt-dk:#2A6AAF;
    --turf:#49A46E; --signal:#EC5B54; --sun:#F5C43F;
    --paper:#0D1920; --card:#152430; --line:#273C4A; --tile:#152430;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain; touch-action:manipulation;
}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}

/* ---------- topbar ---------- */
.top{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  display:flex;align-items:center;gap:7px;
  border-bottom:1px solid var(--line);
}
.top .grow{flex:1;min-width:0}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--cobalt)}
.subtle{color:var(--ink-soft);font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);display:grid;place-items:center;font-size:19px;flex:none;
}
.iconbtn:active{background:var(--paper)}
.pill{
  font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;flex:none;
}
.pill i.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--turf);border-color:color-mix(in srgb,var(--turf) 40%,transparent)}
.pill.busy{color:var(--cobalt);border-color:color-mix(in srgb,var(--cobalt) 40%,transparent)}
.pill.warn{color:var(--signal);border-color:color-mix(in srgb,var(--signal) 40%,transparent)}
@media(max-width:479px){
  .pill .txt{display:none}
  .pill{padding:9px}
  .top{gap:6px;padding-left:10px;padding-right:10px}
  .iconbtn{width:42px;height:42px}
}

/* ---------- typo ---------- */
h2{font-family:var(--display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;
   color:var(--ink-soft);margin:26px 0 10px;font-weight:400}
h3{font-family:var(--display);font-size:20px;letter-spacing:.03em;margin:0 0 4px;font-weight:400}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 18px;border-radius:var(--r);
  background:var(--cobalt);color:#fff;font-weight:600;font-size:16px;
  box-shadow:var(--shadow);
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--card);color:var(--signal);border:1px solid color-mix(in srgb,var(--signal) 40%,transparent);box-shadow:none}
.btn.big{padding:18px;font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;box-shadow:var(--shadow);width:100%;text-align:left;display:block;
}
.card+.card{margin-top:10px}
.card .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--ink-soft);font-size:13px}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
     padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--turf) 16%,transparent);color:var(--turf)}
.tag.live{background:color-mix(in srgb,var(--signal) 14%,transparent);color:var(--signal)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--ink-soft)}

/* ---------- leaderboard ---------- */
.board{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.board::-webkit-scrollbar{display:none}
.lb{
  flex:none;min-width:124px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 11px;position:relative;overflow:hidden;scroll-snap-align:start;
}
.lb.first{border-color:var(--cobalt);box-shadow:inset 3px 0 0 var(--cobalt)}
.lb .pos{font-family:var(--display);font-size:12px;color:var(--ink-soft);letter-spacing:.1em}
.lb .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .tot{font-family:var(--display);font-size:26px;line-height:1;margin-top:2px}
.lb .thru{font-size:11px;color:var(--ink-soft)}

/* ---------- hole grid (signature) ---------- */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(min-width:520px){.holes{grid-template-columns:repeat(6,1fr)}}
.hole{
  position:relative;background:var(--tile);border:1px solid var(--line);border-radius:12px;
  padding:11px 8px 10px;overflow:hidden;text-align:center;box-shadow:var(--shadow);
  min-height:86px;display:flex;flex-direction:column;justify-content:center;
  transition:border-color .15s ease;
}
.hole .fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--turf) 14%,transparent);
  height:var(--fill,0%);transition:height .35s cubic-bezier(.2,.7,.3,1)}
.hole .hnum{position:relative;font-family:var(--display);font-size:30px;line-height:.95;letter-spacing:.02em}
.hole .par{position:relative;font-size:10px;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase}
.hole .dots{position:relative;display:flex;justify-content:center;gap:3px;margin-top:7px;flex-wrap:wrap}
.hole .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.hole .dots i.on{background:var(--cobalt)}
.hole .dots i.ace{background:var(--sun)}
.hole .dots i.ne{background:var(--signal)}
.hole.done{border-color:color-mix(in srgb,var(--turf) 55%,transparent)}
.hole:active{transform:scale(.97)}

/* ---------- sheet / modal ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--ink) 45%,transparent);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-in{
  background:var(--paper);width:100%;max-width:760px;max-height:94vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-in{animation:none}.hole .fill{transition:none}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head .t{flex:1;font-family:var(--display);font-size:24px;letter-spacing:.03em}

/* ---------- form ---------- */
label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
        color:var(--ink-soft);margin:14px 0 6px}
input[type=text],input[type=date],input[type=number],select{
  width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);font-size:16px;
}
.playerrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.playerrow .idx{width:26px;text-align:center;font-family:var(--display);color:var(--ink-soft)}
.playerrow input{flex:1}
.playerrow .rm{width:42px;height:46px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--signal);flex:none}

/* ---------- hole entry ---------- */
.pchips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.pchips::-webkit-scrollbar{display:none}
.pchip{
  flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:11px 15px;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;
}
.pchip .v{font-family:var(--display);font-size:16px;color:var(--ink-soft);min-width:12px}
.pchip.active{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.pchip.active .v{color:#fff}
.pchip.filled{border-color:color-mix(in srgb,var(--turf) 50%,transparent)}
.pchip.filled .v{color:var(--turf)}
.pchip.fail{border-color:color-mix(in srgb,var(--signal) 55%,transparent)}
.pchip.fail .v{color:var(--signal)}
.pchip.active .v,.pchip.active.filled .v,.pchip.active.fail .v{color:#fff}

.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
.key{
  aspect-ratio:1.2/1;min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  font-family:var(--display);font-size:29px;display:grid;place-items:center;box-shadow:var(--shadow);
  -webkit-tap-highlight-color:transparent;
}
.key:active{transform:scale(.96)}
.key.sel{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.key.ace{color:var(--sun)}
.key.ace.sel{background:var(--sun);border-color:var(--sun);color:#20180a}
.key.fail{
  font-family:var(--body);font-size:15px;font-weight:700;line-height:1.1;color:var(--signal);
  border-color:color-mix(in srgb,var(--signal) 45%,transparent);gap:2px;
}
.key.fail small{display:block;font-size:11px;font-weight:600;opacity:.75}
.key.fail.sel{background:var(--signal);border-color:var(--signal);color:#fff}
.key.wipe{font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink-soft)}

/* ---------- scorecard ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
tbody tr:last-child td{border-bottom:none}
th.sticky,td.sticky{position:sticky;left:0;background:var(--card);text-align:left;font-weight:600;z-index:1;
  box-shadow:1px 0 0 var(--line)}
td.ace{color:var(--sun);font-weight:700}
td.ne{color:var(--signal);font-weight:700}
tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--card)}
th .pn{display:block;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto}
table.byhole tbody td{padding:11px 9px;font-size:15px}
table.byhole tbody td.sticky{color:var(--ink-soft);font-family:var(--display);font-size:16px}
table.byhole tbody tr:active td{background:color-mix(in srgb,var(--cobalt) 10%,var(--card))}
td.tot{font-family:var(--display);font-size:17px}
tr.win td.sticky{color:var(--cobalt)}

/* ---------- bottom bar ---------- */
.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:9px 16px calc(9px + env(safe-area-inset-bottom));
}
.bottom .inner{max-width:760px;margin:0 auto;display:flex;gap:9px}
.tab{flex:1;padding:14px 11px;border-radius:12px;font-weight:600;font-size:15px;text-align:center;border:1px solid transparent;color:var(--ink-soft)}
.tab.on{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--ink);color:var(--paper);padding:10px 15px;border-radius:11px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);animation:up .2s ease}
.toast.bad{background:var(--signal);color:#fff}
.hint{color:var(--ink-soft);font-size:13px;margin:8px 2px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<div id="root"></div>
<div id="overlay"></div>
<div id="toast" aria-live="polite"></div>

<script>
/* =======================================================================
   NASTAVENÍ – sem patří adresa nasazeného Apps Scriptu (končí /exec)
   ======================================================================= */
var API_URL = "https://script.google.com/macros/s/AKfycbzSf9KrcYgfbif7SPNiCpZ_mElxpQkH7_EMbHL95GGt-IoARk4aOds7ot5VtGGMPZZ-/exec";

/* Adresu jde přepsat i přímo v appce (ozubené kolečko vpravo nahoře).
   Uloží se v prohlížeči a má přednost před řádkem výše. */
function apiUrl() {
  try {
    var v = localStorage.getItem('mg_api');
    if (v) { v = JSON.parse(v); if (v) return v; }
  } catch (e) {}
  return API_URL;
}

var HOLES = 18;
var MAX_UDERU = 10;   // nejvyšší počet úderů, který jde zapsat
var NESPLNENO = 12;   // body za jamku, kterou hráč nedal ani na 10. pokus

/* ---------------------- stav ---------------------- */
var S = {
  view: 'home',        // 'home' | 'game'
  tab: 'holes',        // 'holes' | 'card'
  games: [],
  game: null,
  scores: {},          // "hole|player" -> strokes
  loading: false,
  syncing: 0,
  err: null,
  queue: [],
  online: navigator.onLine
};

/* ---------------------- úložiště ---------------------- */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem('mg_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('mg_' + k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('mg_' + k); } catch (e) {} }
};

/* ---------------------- API přes JSONP ---------------------- */
var jsonpN = 0;
function api(action, params, timeout) {
  return new Promise(function (resolve, reject) {
    var cb = 'mgcb' + (++jsonpN) + '_' + Date.now().toString(36);
    var q = new URLSearchParams();
    q.set('action', action);
    q.set('callback', cb);
    Object.keys(params || {}).forEach(function (k) {
      var v = params[k];
      if (v !== undefined && v !== null) q.set(k, typeof v === 'object' ? JSON.stringify(v) : String(v));
    });
    var s = document.createElement('script');
    var done = false;
    var timer = setTimeout(function () { finish(new Error('Server neodpovídá')); }, timeout || 20000);
    function finish(err, data) {
      if (done) return; done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
      err ? reject(err) : resolve(data);
    }
    window[cb] = function (data) {
      if (data && data.ok === false) finish(new Error(data.error || 'Chyba serveru'));
      else finish(null, data);
    };
    s.onerror = function () { finish(new Error('Nedaří se spojit se serverem')); };
    s.src = apiUrl() + '?' + q.toString();
    document.head.appendChild(s);
  });
}

/* ---------------------- fronta zápisů (offline) ---------------------- */
S.queue = LS.get('queue', []);

function enqueue(key, action, params) {
  S.queue = S.queue.filter(function (i) { return i.key !== key; });
  S.queue.push({ key: key, action: action, params: params, t: Date.now() });
  LS.set('queue', S.queue);
  flush();
}

var flushing = false;
function flush() {
  if (flushing || !S.queue.length) { paint(); return; }
  flushing = true; S.syncing++; paint();
  var item = S.queue[0];
  api(item.action, item.params).then(function () {
    S.queue = S.queue.filter(function (i) { return i !== item; });
    LS.set('queue', S.queue);
    S.err = null;
  }).catch(function (e) {
    S.err = e.message;
    item.tries = (item.tries || 0) + 1;
    if (item.tries >= 8) {
      S.queue = S.queue.filter(function (i) { return i !== item; });
      LS.set('queue', S.queue);
      toast('Nepodařilo se uložit jeden zápis: ' + e.message, true);
      return;
    }
    throw e;
  }).then(function () {
    flushing = false; S.syncing--;
    if (S.queue.length) flush(); else paint();
  }, function () {
    flushing = false; S.syncing--;
    paint();
    setTimeout(flush, 6000);
  });
}

window.addEventListener('online', function () { S.online = true; flush(); });
window.addEventListener('offline', function () { S.online = false; paint(); });

/* ---------------------- pomocné ---------------------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function todayISO() {
  var d = new Date(), z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 10);
}
function czDate(iso) {
  if (!iso) return '';
  var p = String(iso).slice(0, 10).split('-');
  if (p.length !== 3) return iso;
  return Number(p[2]) + '. ' + Number(p[1]) + '. ' + p[0];
}
function key(h, p) { return h + '|' + p; }
function toast(msg, bad) {
  var el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(function () { el.remove(); }, bad ? 4200 : 2200);
}
function pl(n, one, few, many) { return n === 1 ? one : (n >= 2 && n <= 4 ? few : many); }
function isNe(v) { return v === NESPLNENO; }
function fmt(v) { return isNe(v) ? 'NE' : v; }

/* ---------------------- výpočty ---------------------- */
function standings(game, scores) {
  var rows = (game.hraci || []).map(function (jmeno, i) {
    var soucet = 0, jamky = 0, aces = 0, ne = 0;
    for (var h = 1; h <= HOLES; h++) {
      var v = scores[key(h, i)];
      if (v) {
        soucet += v; jamky++;
        if (v === 1) aces++;
        if (isNe(v)) ne++;
      }
    }
    return { i: i, jmeno: jmeno, soucet: soucet, jamky: jamky, aces: aces, ne: ne };
  });
  rows.sort(function (a, b) {
    if (a.jamky === 0 && b.jamky === 0) return a.i - b.i;
    if (a.jamky === 0) return 1;
    if (b.jamky === 0) return -1;
    if (a.soucet !== b.soucet) return a.soucet - b.soucet;
    if (a.jamky !== b.jamky) return b.jamky - a.jamky;
    return a.i - b.i;
  });
  var poradi = 0, last = null;
  rows.forEach(function (r, idx) {
    if (last === null || r.soucet !== last.soucet || r.jamky !== last.jamky || r.jamky === 0) poradi = idx + 1;
    r.poradi = r.jamky ? poradi : '–';
    last = r;
  });
  return rows;
}

/* ---------------------- načítání ---------------------- */
function loadGames() {
  S.loading = true; paint();
  return api('games').then(function (d) {
    S.games = d.games || [];
    LS.set('games', S.games);
    S.err = null;
  }).catch(function (e) {
    S.err = e.message;
    S.games = LS.get('games', []);
  }).then(function () { S.loading = false; paint(); });
}

function openGame(id, silent) {
  if (!silent) { S.loading = true; S.view = 'game'; S.game = null; S.scores = {}; paint(); }
  return api('game', { id: id }).then(function (d) {
    S.game = d.game;
    var local = {};
    var pendingKeys = {};
    S.queue.forEach(function (q) {
      if (q.action === 'score' && q.params.id === id) pendingKeys[key(q.params.hole, q.params.player)] = q.params.strokes;
    });
    (d.skore || []).forEach(function (r) { local[key(r.jamka, r.hrac)] = r.udery; });
    Object.keys(pendingKeys).forEach(function (k) {
      var v = pendingKeys[k];
      if (v === '' || v == null) delete local[k]; else local[k] = Number(v);
    });
    S.scores = local;
    S.view = 'game';
    LS.set('last', { game: d.game, skore: d.skore });
    S.err = null;
    try { history.replaceState(null, '', '?game=' + encodeURIComponent(id)); } catch (e) {}
  }).catch(function (e) {
    S.err = e.message;
    var cached = LS.get('last', null);
    if (!silent && cached && cached.game && cached.game.id === id) {
      S.game = cached.game;
      S.scores = {};
      (cached.skore || []).forEach(function (r) { S.scores[key(r.jamka, r.hrac)] = r.udery; });
      toast('Jsi offline – ukazuju poslední uloženou verzi', true);
    } else if (!silent) {
      toast(e.message, true);
    }
  }).then(function () { S.loading = false; paint(); });
}

function goHome() {
  S.view = 'home'; S.game = null; S.scores = {}; S.tab = 'holes';
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  paint();
  loadGames();
}

/* ---------------------- zápis skóre ---------------------- */
function setScore(hole, player, strokes) {
  var g = S.game; if (!g) return;
  var k = key(hole, player);
  if (strokes == null) delete S.scores[k]; else S.scores[k] = strokes;
  enqueue('score:' + g.id + ':' + k, 'score', {
    id: g.id, hole: hole, player: player,
    strokes: strokes == null ? '' : strokes,
    jmeno: g.hraci[player] || ''
  });
  paint();
}

/* =======================================================================
   VYKRESLENÍ
   ======================================================================= */
function paint() {
  var root = document.getElementById('root');
  root.innerHTML = S.view === 'game' ? viewGame() : viewHome();
  var ov = document.getElementById('overlay');
  if (openSheet) ov.innerHTML = openSheet(); else ov.innerHTML = '';
  if (afterPaint) { var f = afterPaint; afterPaint = null; f(); }
}
var openSheet = null;
var afterPaint = null;

function syncPill() {
  var cls = 'ok', txt = 'Uloženo';
  if (!S.online) { cls = 'warn'; txt = 'Offline · ' + S.queue.length + ' čeká'; }
  else if (S.syncing > 0) { cls = 'busy'; txt = 'Ukládám…'; }
  else if (S.queue.length) { cls = 'warn'; txt = S.queue.length + ' čeká na uložení'; }
  return '<span class="pill ' + cls + '" title="' + esc(txt) + '"><i class="dot"></i><span class="txt">' + esc(txt) + '</span></span>';
}

/* ---------- domovská obrazovka ---------- */
function viewHome() {
  var aktivni = S.games.filter(function (g) { return g.stav !== 'finished'; });
  var hotove = S.games.filter(function (g) { return g.stav === 'finished'; });

  var h = '';
  h += '<div class="top">' +
       '<div class="grow"><div class="brand">Mini<span>golf</span></div>' +
       '<div class="subtle">18 jamek · zápis skóre</div></div>' +
       syncPill() +
       '<button class="iconbtn" data-act="api" aria-label="Adresa skriptu">⚙</button>' +
       '<button class="iconbtn" data-act="reload" aria-label="Načíst znovu">⟳</button>' +
       '</div>';

  h += '<div class="wrap">';
  h += '<div style="margin-top:16px"><button class="btn big" data-act="new">+ Nová hra</button></div>';

  if (S.err) {
    h += '<div class="card" style="margin-top:14px;border-color:color-mix(in srgb,var(--signal) 45%,transparent)">' +
      '<h3>Nespojím se s Google Sheets</h3>' +
      '<div class="meta" style="color:var(--ink)">' + esc(S.err) + '</div>' +
      '<div style="margin-top:12px"><button class="btn ghost" data-act="api">Zadat adresu skriptu</button></div>' +
    '</div>';
  }

  if (S.loading && !S.games.length) {
    h += '<h2>Načítám</h2><div class="empty">Tahám data z Google Sheets…</div>';
  }

  if (aktivni.length) {
    h += '<h2>Rozehrané</h2>';
    aktivni.forEach(function (g) { h += gameCard(g, true); });
  }

  if (hotove.length) {
    h += '<h2>Historie</h2>';
    hotove.forEach(function (g) { h += gameCard(g, false); });
  }

  if (!S.loading && !S.games.length && !S.err) {
    h += '<h2>Zatím nic</h2><div class="empty">Založ první hru a zapiš první jamku.</div>';
  }
  h += '</div>';
  return h;
}

function gameCard(g, live) {
  var vysl = (g.vysledky || []).slice().filter(function (v) { return v.jamky > 0; });
  vysl.sort(function (a, b) { return a.soucet - b.soucet || b.jamky - a.jamky; });
  var top = vysl[0];
  var jmena = (g.hraci || []).join(', ');
  return '<button class="card" data-act="open" data-id="' + esc(g.id) + '">' +
    '<div style="display:flex;align-items:center;gap:8px">' +
      '<h3 style="flex:1">' + esc(g.misto || 'Minigolf') + '</h3>' +
      (live ? '<span class="tag live">Rozehráno</span>' : '<span class="tag">Dohráno</span>') +
    '</div>' +
    '<div class="meta"><span class="num">' + esc(czDate(g.datum)) + '</span><span>·</span><span>' + esc(jmena) + '</span></div>' +
    '<div class="meta" style="margin-top:6px;color:var(--ink)">' +
      (top ? '<strong>' + esc(top.jmeno) + '</strong> <span class="num">' + top.soucet + '</span> úderů' : 'Zatím bez skóre') +
      '<span style="color:var(--ink-soft)">· ' + (g.odehranoJamek || 0) + '/' + HOLES + ' jamek</span>' +
    '</div>' +
  '</button>';
}

/* ---------- obrazovka hry ---------- */
function viewGame() {
  var g = S.game;
  if (!g) return '<div class="top"><button class="iconbtn" data-act="home">←</button><div class="grow"><div class="brand">Načítám…</div></div></div>';

  var st = standings(g, S.scores);
  var h = '';

  h += '<div class="top">' +
       '<button class="iconbtn" data-act="home" aria-label="Zpět">←</button>' +
       '<div class="grow"><div class="brand" style="font-size:19px">' + esc(g.misto || 'Minigolf') + '</div>' +
       '<div class="subtle num">' + esc(czDate(g.datum)) + ' · ' + g.hraci.length + ' ' + pl(g.hraci.length, 'hráč', 'hráči', 'hráčů') + '</div></div>' +
       syncPill() +
       '<button class="iconbtn" data-act="refresh" aria-label="Načíst skóre znovu">⟳</button>' +
       '<button class="iconbtn" data-act="settings" aria-label="Nastavení hry">⋯</button>' +
       '</div>';

  h += '<div class="wrap">';

  h += '<h2 style="margin-top:14px">Pořadí</h2><div class="board">';
  st.forEach(function (r, i) {
    var extra = [];
    if (r.aces) extra.push(r.aces + '× eso');
    if (r.ne) extra.push(r.ne + '× NE');
    h += '<div class="lb' + (i === 0 && r.jamky ? ' first' : '') + '">' +
      '<div class="pos">' + (r.jamky ? r.poradi + '.' : '–') + '</div>' +
      '<div class="nm">' + esc(r.jmeno) + '</div>' +
      '<div class="tot num">' + (r.jamky ? r.soucet : '–') + '</div>' +
      '<div class="thru num">' + r.jamky + '/' + HOLES + ' jamek' + (extra.length ? ' · ' + extra.join(' · ') : '') + '</div>' +
    '</div>';
  });
  h += '</div>';

  if (S.tab === 'holes') {
    h += '<h2>Jamky</h2><div class="holes">';
    for (var hole = 1; hole <= HOLES; hole++) {
      var filled = 0, dots = '';
      for (var p = 0; p < g.hraci.length; p++) {
        var v = S.scores[key(hole, p)];
        if (v) { filled++; dots += '<i class="' + (v === 1 ? 'ace' : isNe(v) ? 'ne' : 'on') + '"></i>'; }
        else dots += '<i></i>';
      }
      var pct = Math.round(filled / g.hraci.length * 100);
      h += '<button class="hole' + (filled === g.hraci.length ? ' done' : '') + '" data-act="hole" data-hole="' + hole + '" style="--fill:' + pct + '%">' +
        '<span class="fill"></span>' +
        '<span class="hnum num">' + (hole < 10 ? '0' : '') + hole + '</span>' +
        '<span class="par num">' + filled + '/' + g.hraci.length + '</span>' +
        '<span class="dots">' + dots + '</span>' +
      '</button>';
    }
    h += '</div>';
    h += '<div class="hint">Klepni na jamku a zapiš údery. Jamky můžeš vyplňovat v libovolném pořadí.</div>';
  } else {
    h += '<h2>Karta</h2>' + scorecard(g, st);
  }

  h += '</div>';

  h += '<div class="bottom"><div class="inner">' +
       '<button class="tab' + (S.tab === 'holes' ? ' on' : '') + '" data-act="tab" data-tab="holes">Jamky</button>' +
       '<button class="tab' + (S.tab === 'card' ? ' on' : '') + '" data-act="tab" data-tab="card">Karta a pořadí</button>' +
       '</div></div>';
  return h;
}

var mqNarrow = window.matchMedia('(max-width: 559px)');
function isNarrow() { return mqNarrow.matches; }
if (mqNarrow.addEventListener) mqNarrow.addEventListener('change', function () { paint(); });
else if (mqNarrow.addListener) mqNarrow.addListener(function () { paint(); });

function scorecard(g, st) {
  return (isNarrow() ? cardByHole(st) : cardByPlayer(st)) + cardFooter(g);
}

/* Na telefonu: jamky pod sebou, hráči vedle sebe – vejde se bez posouvání do stran. */
function cardByHole(st) {
  var h = '<div class="tablewrap"><table class="byhole"><thead><tr><th class="sticky">Jamka</th>';
  st.forEach(function (r) { h += '<th class="num"><span class="pn">' + esc(r.jmeno) + '</span></th>'; });
  h += '</tr></thead><tbody>';
  for (var hole = 1; hole <= HOLES; hole++) {
    h += '<tr data-act="hole" data-hole="' + hole + '"><td class="sticky num">' + hole + '</td>';
    for (var j = 0; j < st.length; j++) {
      var v = S.scores[key(hole, st[j].i)];
      h += '<td class="num' + (v === 1 ? ' ace' : isNe(v) ? ' ne' : '') + '">' + (v ? fmt(v) : '·') + '</td>';
    }
    h += '</tr>';
  }
  h += '</tbody><tfoot><tr><td class="sticky">NE</td>';
  st.forEach(function (r) { h += '<td class="num' + (r.ne ? ' ne' : '') + '">' + (r.ne || '·') + '</td>'; });
  h += '</tr><tr><td class="sticky">Celkem</td>';
  st.forEach(function (r) { h += '<td class="num tot">' + (r.jamky ? r.soucet : '–') + '</td>'; });
  h += '</tr></tfoot></table></div>';
  return h;
}

/* Na širší obrazovce: klasická karta, hráči po řádcích. */
function cardByPlayer(st) {
  var h = '<div class="tablewrap"><table><thead><tr><th class="sticky">Hráč</th>';
  for (var i = 1; i <= HOLES; i++) h += '<th class="num">' + i + '</th>';
  h += '<th class="num">NE</th><th class="num">Σ</th></tr></thead><tbody>';
  st.forEach(function (r, idx) {
    h += '<tr' + (idx === 0 && r.jamky ? ' class="win"' : '') + '><td class="sticky">' + (r.jamky ? r.poradi + '. ' : '') + esc(r.jmeno) + '</td>';
    for (var hole = 1; hole <= HOLES; hole++) {
      var v = S.scores[key(hole, r.i)];
      h += '<td class="num' + (v === 1 ? ' ace' : isNe(v) ? ' ne' : '') + '">' + (v ? fmt(v) : '·') + '</td>';
    }
    h += '<td class="num' + (r.ne ? ' ne' : '') + '">' + (r.ne || '·') + '</td>';
    h += '<td class="num tot">' + (r.jamky ? r.soucet : '–') + '</td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function cardFooter(g) {
  return '<div class="hint">NE = jamka nedaná ani na ' + MAX_UDERU + '. pokus, počítá se za ' + NESPLNENO + ' bodů.' +
    (isNarrow() ? ' Klepnutím na řádek jamky ji rovnou otevřeš.' : '') + '</div>' +
    '<div class="row" style="margin-top:12px">' +
    '<button class="btn ghost" data-act="share">Sdílet odkaz</button>' +
    '<button class="btn ghost" data-act="' + (g.stav === 'finished' ? 'reopen' : 'finish') + '">' +
    (g.stav === 'finished' ? 'Znovu otevřít' : 'Ukončit hru') + '</button></div>';
}

/* ---------- panel jamky ---------- */
var holeState = { hole: 1, player: 0 };

function sheetHole() {
  var g = S.game;
  var hole = holeState.hole, pi = holeState.player;
  var cur = S.scores[key(hole, pi)];

  var chips = g.hraci.map(function (jm, i) {
    var v = S.scores[key(hole, i)];
    return '<button class="pchip' + (i === pi ? ' active' : '') + (v ? ' filled' : '') + (isNe(v) ? ' fail' : '') + '" data-act="pick" data-p="' + i + '">' +
      esc(jm) + '<span class="v num">' + (v ? fmt(v) : '–') + '</span></button>';
  }).join('');

  var keys = '';
  for (var n = 1; n <= MAX_UDERU; n++) {
    keys += '<button class="key num' + (n === 1 ? ' ace' : '') + (cur === n ? ' sel' : '') + '" data-act="set" data-n="' + n + '">' + n + '</button>';
  }
  keys += '<button class="key fail' + (isNe(cur) ? ' sel' : '') + '" data-act="set" data-n="' + NESPLNENO + '">Nedal<small>' + NESPLNENO + ' bodů</small></button>';
  keys += '<button class="key wipe" data-act="set" data-n="">Smazat</button>';

  var zbyva = g.hraci.filter(function (_, i) { return !S.scores[key(hole, i)]; }).length;

  return '<div class="sheet" data-act="close-bg"><div class="sheet-in" role="dialog" aria-label="Jamka ' + hole + '">' +
    '<div class="sheet-head">' +
      '<button class="iconbtn" data-act="prev" ' + (hole === 1 ? 'disabled style="opacity:.4"' : '') + ' aria-label="Předchozí jamka">←</button>' +
      '<div class="t" style="text-align:center">Jamka ' + (hole < 10 ? '0' : '') + hole + '</div>' +
      '<button class="iconbtn" data-act="next" ' + (hole === HOLES ? 'disabled style="opacity:.4"' : '') + ' aria-label="Další jamka">→</button>' +
      '<button class="iconbtn" data-act="close" aria-label="Zavřít">✕</button>' +
    '</div>' +
    '<div class="pchips">' + chips + '</div>' +
    '<div class="keypad">' + keys + '</div>' +
    '<div class="hint">' + (zbyva ? 'Zbývá zapsat: ' + zbyva + ' ' + pl(zbyva, 'hráč', 'hráči', 'hráčů') : 'Jamka je kompletní.') + ' Přejetím prstem přepneš jamku.</div>' +
    '<div class="row" style="margin-top:10px">' +
      '<button class="btn ghost" data-act="close">Hotovo</button>' +
      (hole < HOLES ? '<button class="btn" data-act="next">Jamka ' + (hole + 1) + ' →</button>' : '') +
    '</div>' +
  '</div></div>';
}

/* ---------- nová hra ---------- */
var formState = null;

function sheetNew() {

  var rows = f.hraci.map(function (jm, i) {
    return '<div class="playerrow">' +

    '<label class="f" for="f-datum">Datum hry</label>' +
    '<input id="f-datum" type="date" data-f="datum" value="' + esc(f.datum) + '">' +
    '<label class="f" for="f-misto">Kde hrajete</label>' +
    '<input id="f-misto" type="text" data-f="misto" value="' + esc(f.misto) + '" placeholder="Např. Poruba, Landek…" autocomplete="off">' +
    '<label class="f">Hráči</label>' + rows +
    (f.hraci.length < 12 ? '<button class="btn ghost" data-act="addp" style="margin-top:2px">+ Přidat hráče</button>' : '') +
    '<div style="margin-top:18px"><button class="btn big" data-act="create">Založit hru</button></div>' +
    '<div class="hint">Počítají se jen údery, 1 až ' + MAX_UDERU + '. Kdo jamku nedá ani na ' + MAX_UDERU + '. pokus, dostane ' + NESPLNENO + ' bodů.</div>' +
  '</div></div>';
}

/* ---------- adresa skriptu ---------- */
function sheetApi() {
  return '<div class="sheet" data-act="close-bg"><div class="sheet-in" role="dialog" aria-label="Adresa skriptu">' +
    '<div class="sheet-head"><div class="t">Adresa skriptu</div><button class="iconbtn" data-act="close" aria-label="Zavřít">✕</button></div>' +
    '<label class="f" for="a-url">Adresa nasazené webové aplikace</label>' +
    '<input id="a-url" type="text" data-f="apiurl" value="' + esc(apiUrl()) + '" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">' +
    '<div class="hint">Najdeš ji v Apps Scriptu pod Nasadit → Spravovat nasazení, u aktivního nasazení. Musí končit na /exec.</div>' +
    '<div style="margin-top:16px"><button class="btn big" data-act="testApi">Otestovat a uložit</button></div>' +
    '<div style="margin-top:10px"><button class="btn ghost" data-act="resetApi">Vrátit adresu z kódu</button></div>' +
  '</div></div>';
}

function testApi() {
  var el = document.querySelector('[data-f="apiurl"]');
  if (!el) return;
  var v = el.value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(v)) {
    toast('Adresa musí začínat script.google.com a končit /exec', true); return;
  }
  var btn = document.querySelector('[data-act="testApi"]');
  if (btn) { btn.textContent = 'Zkouším spojení…'; btn.disabled = true; }
  var prev = LS.get('api', '');
  LS.set('api', v);
  api('ping').then(function () {
    openSheet = null;
    toast('Připojeno k Google Sheets');
    paint();
    loadGames();
  }).catch(function (e) {
    LS.set('api', prev);
    toast('Nepovedlo se: ' + e.message, true);
    if (btn) { btn.textContent = 'Otestovat a uložit'; btn.disabled = false; }
  });
}

/* ---------- nastavení hry ---------- */
function sheetSettings() {
  var g = S.game;
  var rows = g.hraci.map(function (jm, i) {
    return '<div class="playerrow"><span class="idx">' + (i + 1) + '</span>' +
      '<input type="text" data-f="ghrac" data-i="' + i + '" value="' + esc(jm) + '"></div>';

  return '<div class="sheet" data-act="close-bg"><div class="sheet-in" role="dialog" aria-label="Nastavení hry">' +
    '<div class="sheet-head"><div class="t">Upravit hru</div><button class="iconbtn" data-act="close" aria-label="Zavřít">✕</button></div>' +

    '<label class="f" for="g-misto">Kde hrajete</label><input id="g-misto" type="text" data-f="gmisto" value="' + esc(g.misto) + '">' +
    '<label class="f">Jména hráčů</label>' + rows +
    '<div style="margin-top:16px"><button class="btn" data-act="saveGame">Uložit změny</button></div>' +
    '<div class="row" style="margin-top:10px">' +
      '<button class="btn ghost" data-act="share">Sdílet odkaz</button>' +

    '</div>' +
    '<div style="margin-top:10px"><button class="btn danger" data-act="del">Smazat hru</button></div>' +

/* =======================================================================
   OVLÁDÁNÍ
   ======================================================================= */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');

  if (act === 'close-bg' && ev.target !== t) return;

  switch (act) {
    case 'reload': loadGames(); break;
    case 'refresh': refreshGame(); break;
    case 'api': openSheet = sheetApi; paint(); break;
    case 'testApi': testApi(); break;
    case 'resetApi': LS.del('api'); openSheet = null; toast('Adresa vrácena na výchozí'); paint(); loadGames(); break;
    case 'home': goHome(); break;
    case 'open': openGame(t.getAttribute('data-id')); break;
    case 'tab': S.tab = t.getAttribute('data-tab'); paint(); break;

    case 'new':
      formState = { datum: todayISO(), misto: '', hraci: LS.get('lastPlayers', ['', '']) };
      if (!formState.hraci.length) formState.hraci = ['', ''];
      openSheet = sheetNew; paint(); break;

    case 'addp': readForm(); formState.hraci.push(''); paint(); break;
    case 'rmp': readForm(); formState.hraci.splice(Number(t.getAttribute('data-i')), 1); paint(); break;

    case 'create': createGame(); break;

    case 'hole':
      var hn = Number(t.getAttribute('data-hole'));
      holeState.hole = hn;
      holeState.player = firstEmptyPlayer(hn);
      openSheet = sheetHole; paint(); break;

    case 'pick': holeState.player = Number(t.getAttribute('data-p')); paint(); break;

    case 'set':
      var raw = t.getAttribute('data-n');
      var n = raw === '' ? null : Number(raw);
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
      setScore(holeState.hole, holeState.player, n);
      if (n != null) {
        var nx = nextEmptyPlayer(holeState.hole, holeState.player);
        if (nx != null) holeState.player = nx;
      }
      paint();
      break;

    case 'prev': if (holeState.hole > 1) { holeState.hole--; holeState.player = firstEmptyPlayer(holeState.hole); paint(); } break;
    case 'next': if (holeState.hole < HOLES) { holeState.hole++; holeState.player = firstEmptyPlayer(holeState.hole); paint(); } break;

    case 'close': openSheet = null; paint(); break;
    case 'close-bg': openSheet = null; paint(); break;

    case 'settings': openSheet = sheetSettings; paint(); break;
    case 'saveGame': saveGameEdits(); break;
    case 'finish': setStav('finished'); break;
    case 'reopen': setStav('active'); break;
    case 'del': deleteGame(); break;
    case 'share': shareLink(); break;
  }
});

function refreshGame() {
  if (!S.game) return;
  if (S.queue.length) {
    toast('Nejdřív se dopošlou zápisy, které čekají', true);
    flush();
    return;
  }
  var id = S.game.id;
  toast('Načítám z Google Sheets…');
  openGame(id, true).then(function () { toast('Aktualizováno'); });
}

function firstEmptyPlayer(hole) {
  var g = S.game;
  for (var i = 0; i < g.hraci.length; i++) if (!S.scores[key(hole, i)]) return i;
  return 0;
}
function nextEmptyPlayer(hole, from) {
  var g = S.game;
  for (var s = 1; s <= g.hraci.length; s++) {
    var i = (from + s) % g.hraci.length;
    if (!S.scores[key(hole, i)]) return i;
  }
  return null;
}

function readForm() {
  if (!formState) return;
  var d = document.querySelector('[data-f="datum"]'); if (d) formState.datum = d.value;
  var m = document.querySelector('[data-f="misto"]'); if (m) formState.misto = m.value;
  document.querySelectorAll('[data-f="hrac"]').forEach(function (el) {
    formState.hraci[Number(el.getAttribute('data-i'))] = el.value;
  });
}

function createGame() {
  readForm();
  var hraci = formState.hraci.map(function (x) { return x.trim(); }).filter(Boolean);
  if (!hraci.length) { toast('Vyplň aspoň jedno jméno hráče', true); return; }
  LS.set('lastPlayers', hraci);

  var btn = document.querySelector('[data-act="create"]');
  if (btn) { btn.textContent = 'Zakládám…'; btn.disabled = true; }

  api('newGame', {
    payload: {
      datum: formState.datum || todayISO(),
      misto: formState.misto.trim(),
      hraci: hraci,
      maxUderu: MAX_UDERU
    }
  }).then(function (d) {
    openSheet = null;
    toast('Hra založena');
    return openGame(d.id);
  }).catch(function (e) {
    toast(e.message, true);
    if (btn) { btn.textContent = 'Založit hru'; btn.disabled = false; }
  });
}

function saveGameEdits() {
  var g = S.game;
  var datum = document.querySelector('[data-f="gdatum"]').value;
  var misto = document.querySelector('[data-f="gmisto"]').value;
  var hraci = [];
  document.querySelectorAll('[data-f="ghrac"]').forEach(function (el) { hraci.push(el.value.trim()); });
  hraci = hraci.filter(Boolean);
  if (hraci.length !== g.hraci.length) { toast('Jména nesmí zůstat prázdná', true); return; }

  g.datum = datum; g.misto = misto; g.hraci = hraci;
  openSheet = null; paint();
  api('updateGame', { id: g.id, payload: { datum: datum, misto: misto, hraci: hraci } })
    .then(function () { toast('Uloženo'); })
    .catch(function (e) { toast(e.message, true); });
}

function setStav(stav) {
  var g = S.game;
  g.stav = stav;
  openSheet = null; paint();
  api('updateGame', { id: g.id, payload: { stav: stav } })
    .then(function () { toast(stav === 'finished' ? 'Hra ukončena' : 'Hra znovu otevřena'); })
    .catch(function (e) { toast(e.message, true); });
}

function deleteGame() {
  var g = S.game;
  if (!confirm('Opravdu smazat hru „' + (g.misto || 'Minigolf') + '“ včetně skóre?')) return;
  api('deleteGame', { id: g.id }).then(function () {
    openSheet = null;
    toast('Hra smazána');
    goHome();
  }).catch(function (e) { toast(e.message, true); });
}

function shareLink() {
  var url = location.origin + location.pathname + '?game=' + encodeURIComponent(S.game.id);
  if (navigator.share) {
    navigator.share({ title: 'Minigolf – ' + (S.game.misto || 'skóre'), url: url }).catch(function () {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function () { toast('Odkaz zkopírován'); },
      function () { prompt('Odkaz na hru:', url); });
  } else {
    prompt('Odkaz na hru:', url);
  }
}

/* ---------- klávesnice na desktopu ---------- */
document.addEventListener('keydown', function (e) {
  if (openSheet === sheetHole) {
    if (e.key === 'Escape') { openSheet = null; paint(); }
    else if (/^[0-9]$/.test(e.key) || e.key === 'n' || e.key === 'N') {
      var n = (e.key === 'n' || e.key === 'N') ? NESPLNENO : (e.key === '0' ? 10 : Number(e.key));
      if (n <= MAX_UDERU || n === NESPLNENO) {
        setScore(holeState.hole, holeState.player, n);
        var nx = nextEmptyPlayer(holeState.hole, holeState.player);
        if (nx != null) holeState.player = nx;
        paint();
      }
    } else if (e.key === 'ArrowRight') { if (holeState.hole < HOLES) { holeState.hole++; holeState.player = firstEmptyPlayer(holeState.hole); paint(); } }
    else if (e.key === 'ArrowLeft') { if (holeState.hole > 1) { holeState.hole--; holeState.player = firstEmptyPlayer(holeState.hole); paint(); } }
    else if (e.key === 'Backspace') { setScore(holeState.hole, holeState.player, null); paint(); }
  } else if (openSheet && e.key === 'Escape') { openSheet = null; paint(); }
});

/* ---------- přejetí prstem mezi jamkami ---------- */
var swipeX = null, swipeY = null;
document.addEventListener('touchstart', function (e) {
  if (openSheet !== sheetHole) return;
  if (e.target.closest && e.target.closest('.pchips')) return;
  var t = e.changedTouches[0];
  swipeX = t.clientX; swipeY = t.clientY;
}, { passive: true });

document.addEventListener('touchend', function (e) {
  if (swipeX === null || openSheet !== sheetHole) { swipeX = null; return; }
  var t = e.changedTouches[0];
  var dx = t.clientX - swipeX, dy = t.clientY - swipeY;
  swipeX = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 55) return;
  if (dx < 0 && holeState.hole < HOLES) holeState.hole++;
  else if (dx > 0 && holeState.hole > 1) holeState.hole--;
  else return;
  holeState.player = firstEmptyPlayer(holeState.hole);
  paint();
}, { passive: true });

/* ---------- odesílání čekajících zápisů ---------- */
/* Data se sama nenačítají – aktualizuje se jen tlačítkem ⟳.
   Při návratu do appky se ale dopošle to, co se neuložilo (např. kvůli výpadku signálu). */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) flush();
});

/* ---------- start ---------- */
(function init() {
  var q = new URLSearchParams(location.search);
  var gid = q.get('game');
  S.games = LS.get('games', []);
  if (gid) openGame(gid); else { paint(); loadGames(); }
  flush();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
