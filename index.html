function readEditForm() {
  if (!editState) return;
  var d = document.querySelector('[data-f="gdatum"]'); if (d) editState.datum = d.value;
  var m = document.querySelector('[data-f="gmisto"]'); if (m) editState.misto = m.value;
  document.querySelectorAll('[data-f="ghrac"]').forEach(function (el) {
    editState.hraci[Number(el.getAttribute('data-i'))] = el.value;
  });
}

/* =======================================================================
   OVLÁDÁNÍ
   ======================================================================= */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');

  if (act === 'close-bg' && ev.target !== t) return;

  switch (act) {
    case 'reload': loadGames(); break;
    case 'career': S.view = 'career'; paint(); break;
    case 'hrac':
      detailHrace = Number(t.getAttribute('data-i'));
      if (karieraCache && karieraCache.hraci[detailHrace]) { openSheet = sheetHrac; paint(); }
      break;
    case 'refresh': refreshGame(); break;
    case 'api': openSheet = sheetApi; paint(); break;
    case 'testApi': testApi(); break;
    case 'setMotiv':
      LS.set('motiv', t.getAttribute('data-m'));
      pouzijMotiv();
      paint({ sheetOnly: true });
      break;

    case 'setStyl':
      LS.set('styl', t.getAttribute('data-s'));
      pouzijMotiv();
      if (navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
      paint();
      break;
    case 'resetApi': LS.del('api'); openSheet = null; toast('Adresa vrácena na výchozí'); paint(); loadGames(); break;
    case 'home': goHome(); break;
    case 'open': openGame(t.getAttribute('data-id')); break;
    case 'tab': S.tab = t.getAttribute('data-tab'); paint(); break;
    case 'tabule': if (tabulePotlacitKlik) break; LS.set('tabule', !tabuleOtevrena()); paint(); break;

    case 'mapa':
      if (mapaPotlacitKlik) break;
      mapaPrepni(holeState.hole); paint({ sheetOnly: true }); break;
    case 'mapaFull': mapaStav.zoom = holeState.hole; paint({ sheetOnly: true }); break;
    case 'mapaZoomClose': mapaStav.zoom = null; paint({ sheetOnly: true }); break;

    case 'new':
      formState = { datum: todayISO(), misto: '', hraci: LS.get('lastPlayers', ['', '']), avatary: LS.get('lastAvatars', []), kola: LS.get('lastKola', 1) };
      if (!formState.hraci.length) formState.hraci = ['', ''];
      srovnejAvatary(formState);
      openSheet = sheetNew; paint(); break;

    case 'sestava':
      var se = sestavyCache[Number(t.getAttribute('data-i'))];
      if (se) {
        readForm();
        formState.hraci = se.hraci.slice();
        formState.avatary = se.avatary.slice();
        if (se.kola) formState.kola = se.kola;
        toast('Sestava vyplněna');
        paint({ sheetOnly: true });
      }
      break;

    case 'setKola':
      readForm();
      formState.kola = Number(t.getAttribute('data-k'));
      paint({ sheetOnly: true });
      break;

    case 'addp': readForm(); formState.hraci.push(''); srovnejAvatary(formState); paint(); break;
    case 'rmp':
      readForm();
      var ri = Number(t.getAttribute('data-i'));
      formState.hraci.splice(ri, 1); formState.avatary.splice(ri, 1);
      paint(); break;

    case 'pickAva':
      var pf = t.getAttribute('data-form');
      if (pf === 'new') readForm(); else readEditForm();
      pickFor = { form: pf, i: Number(t.getAttribute('data-i')) };
      openSheet = sheetAva; paint(); break;

    case 'setAva':
      var av = t.getAttribute('data-n');
      var val = av === '' ? null : Number(av);
      if (pickFor.form === 'new') formState.avatary[pickFor.i] = val;
      else editState.avatary[pickFor.i] = val;
      if (navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
      openSheet = (pickFor.form === 'new') ? sheetNew : sheetSettings;
      pickFor = null; paint(); break;

    case 'backFromAva':
      openSheet = (pickFor && pickFor.form === 'edit') ? sheetSettings : sheetNew;
      pickFor = null; paint(); break;

    case 'create': createGame(); break;

    case 'hole':
      var hn = Number(t.getAttribute('data-hole'));
      holeState.hole = hn;
      holeState.kolo = prvniNedohraneKolo(hn);
      holeState.player = firstEmptyPlayer(hn, holeState.kolo);
      openSheet = sheetHole; paint(); break;

    case 'locked':
      toast('Hra je ukončená. Odemkneš ji přes nabídku vpravo nahoře.', true);
      break;

    case 'pick': holeState.player = Number(t.getAttribute('data-p')); paint({ sheetOnly: true }); break;

    /* Oprava už zapsaného čísla – bez otevírání klávesnice. */
    case 'pm':
      var pmP = Number(t.getAttribute('data-p')), pmD = Number(t.getAttribute('data-d'));
      var pmStare = S.scores[key(holeState.hole, pmP, holeState.kolo)];
      if (!pmStare || isNe(pmStare)) break;
      var pmNove = Math.max(1, Math.min(MAX_UDERU, pmStare + pmD));
      if (pmNove === pmStare) break;
      pop(pmP);
      if (navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
      zapamatujUndo(holeState.hole, pmP, holeState.kolo, pmStare, (S.game.hraci[pmP] || ''));
      setScore(holeState.hole, pmP, pmNove, holeState.kolo);
      paint({ sheetOnly: true, flip: true });
      break;

    /* Pásek jamek: skoč na jamku, kolo i hráče dopočítá stejně jako šipky. */
    case 'jump':
      holeState.hole = Number(t.getAttribute('data-h'));
      holeState.kolo = prvniNedohraneKolo(holeState.hole);
      holeState.player = firstEmptyPlayer(holeState.hole, holeState.kolo);
      paint({ sheetOnly: true });
      break;

    case 'undo':
      if (!undoZapis) break;
      var uz = undoZapis;
      undoZapis = null;
      if (undoTimer) clearTimeout(undoTimer);
      holeState.hole = uz.hole; holeState.kolo = uz.kolo; holeState.player = uz.player;
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
      setScore(uz.hole, uz.player, uz.prev, uz.kolo);
      toast(uz.prev == null ? 'Zápis vrácen' : uz.jmeno + ' zpátky na ' + fmt(uz.prev));
      paint({ sheetOnly: true });
      break;

    case 'prumRezim':
      LS.set('prumer-rezim', t.getAttribute('data-r'));
      paint();
      break;

    case 'lbHrac':
      detailHraceHra = Number(t.getAttribute('data-p'));
      openSheet = sheetHraHrac; paint();
      break;

    case 'set':
      var raw = t.getAttribute('data-n');
      var n = raw === '' ? null : Number(raw);
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
      var byloHotovo = koloKompletni(holeState.hole, holeState.kolo);
      var rekPred = rekordJamky(holeState.hole);
      pop(holeState.player);
      zapamatujUndo(holeState.hole, holeState.player, holeState.kolo,
        S.scores[key(holeState.hole, holeState.player, holeState.kolo)] || null,
        (S.game && S.game.hraci[holeState.player]) || '');
      setScore(holeState.hole, holeState.player, n, holeState.kolo);
      /* 10 – nový rekord jamky se oznámí hned při zápisu. */
      if (n != null && !isNe(n)) {
        var rekPo = rekordJamky(holeState.hole);
        if (rekPo && (!rekPred || rekPo.v < rekPred.v)) {
          rekordNovy = holeState.hole;
          setTimeout(function () { rekordNovy = null; }, 2600);
          toast('Nový rekord jamky ' + holeState.hole + ': ' + rekPo.v + '!');
        }
      }
      if (n != null) {
        var nx = nextEmptyPlayer(holeState.hole, holeState.player, holeState.kolo);
        if (nx != null) holeState.player = nx;
      }
      // dokončené kolo → další kolo téže jamky, nebo rovnou další jamka
      if (n != null && !byloHotovo && koloKompletni(holeState.hole, holeState.kolo)) {
        var krok = dalsiKrok(holeState.hole, holeState.kolo);
        if (krok) {
          var zJamky = holeState.hole, zKola = holeState.kolo;
          holeState.hole = krok.hole;
          holeState.kolo = krok.kolo;
          holeState.player = firstEmptyPlayer(krok.hole, krok.kolo);
          toast(krok.hole === zJamky
            ? zKola + '. kolo hotové → ' + krok.kolo + '. kolo'
            : 'Jamka ' + zJamky + ' hotová → jamka ' + krok.hole);
        }
      }
      paint({ sheetOnly: true, flip: true });
      break;

    case 'setKolo':
      holeState.kolo = Number(t.getAttribute('data-k'));
      holeState.player = firstEmptyPlayer(holeState.hole, holeState.kolo);
      paint({ sheetOnly: true });
      break;

    case 'prev': if (holeState.hole > 1) { smer('zl'); holeState.hole--; holeState.kolo = prvniNedohraneKolo(holeState.hole); holeState.player = firstEmptyPlayer(holeState.hole, holeState.kolo); paint({ sheetOnly: true }); } break;
    case 'next': if (holeState.hole < HOLES) { smer('zp'); holeState.hole++; holeState.kolo = prvniNedohraneKolo(holeState.hole); holeState.player = firstEmptyPlayer(holeState.hole, holeState.kolo); paint({ sheetOnly: true }); } break;

    case 'close':
    case 'close-bg':
      var bylaJamka = (openSheet === sheetHole);
      openSheet = null; editState = null; paint();
      if (bylaJamka) poZavreniJamky();
      break;

    case 'settings': editState = null; openSheet = sheetSettings; paint(); break;
    case 'toggleAuto':
      readEditForm();
      LS.set('auto', !autoZapnuto());
      toast(autoZapnuto() ? 'Zápisy ostatních se budou načítat samy' : 'Automatické načítání vypnuto');
      paint({ sheetOnly: true });
      break;

    case 'saveGame': saveGameEdits(); break;
    case 'finish': setStav('finished'); break;
    case 'reopen': setStav('active'); break;
    case 'del': deleteGame(); break;
    case 'share': shareLink(); break;
    case 'shareImg': sdilejObrazek(); break;
  }
});

function refreshGame() {
  if (!S.game) return;
  if (S.queue.length) {
    toast('Nejdřív se dopošlou zápisy, které čekají', true);
    flush();
    return;
  }
  toast('Načítám z Google Sheets…');
  Promise.resolve(tichyRefresh(true)).then(function (zmena) {
    toast(zmena === false ? 'Vše je aktuální' : 'Aktualizováno');
  });
}

/* Po zavření jamky: nejdřív dopošli svoje zápisy, pak stáhni cizí. */
function poZavreniJamky() {
  if (!autoZapnuto() || !S.game) return;
  var pokus = 0;
  (function cekej() {
    if ((S.queue.length || flushing) && pokus++ < 25) { setTimeout(cekej, 300); return; }
    Promise.resolve(tichyRefresh()).then(function (pribylo) {
      if (typeof pribylo === 'number' && pribylo > 0) {
        toast('Načteno ' + pribylo + ' ' + pl(pribylo, 'nový zápis', 'nové zápisy', 'nových zápisů') + ' od ostatních');
      }
    });
  })();
}

/* Kompletní kolo na jamce = všichni hráči mají v tom kole zapsáno. */
function koloKompletni(hole, kolo) {
  var g = S.game; if (!g) return false;
  for (var i = 0; i < g.hraci.length; i++) if (!S.scores[key(hole, i, kolo)]) return false;
  return true;
}
/* Kompletní jamka = hotová všechna kola. */
function jamkaKompletni(hole) {
  var g = S.game; if (!g) return false;
  var kola = seznamKol(g);
  for (var ki = 0; ki < kola.length; ki++) if (!koloKompletni(hole, kola[ki])) return false;
  return true;
}

function firstEmptyPlayer(hole, kolo) {
  var g = S.game;
  var ko = kolo || holeState.kolo || 1;
  for (var i = 0; i < g.hraci.length; i++) if (!S.scores[key(hole, i, ko)]) return i;
  return 0;
}
function nextEmptyPlayer(hole, from, kolo) {
  var g = S.game;
  var ko = kolo || holeState.kolo || 1;
  for (var s = 1; s <= g.hraci.length; s++) {
    var i = (from + s) % g.hraci.length;
    if (!S.scores[key(hole, i, ko)]) return i;
  }
  return null;
}
/* Které kolo na jamce otevřít – první, které ještě není hotové. */
function prvniNedohraneKolo(hole) {
  var kola = seznamKol(S.game);
  for (var i = 0; i < kola.length; i++) if (!koloKompletni(hole, kola[i])) return kola[i];
  return kola[0];
}

/* Kam skočit po dokončení kola: druhé kolo téže jamky, jinak další jamka. */
function dalsiKrok(hole, kolo) {
  var g = S.game;
  if (kolaHry(g) === 2 && kolo === 1) return { hole: hole, kolo: 2 };
  if (hole < HOLES) return { hole: hole + 1, kolo: 1 };
  return null;
}

/* Jen srovná délku pole – obrázek si každý hráč vybírá sám, nic se nepřiděluje automaticky. */
function srovnejAvatary(f) {
  if (!Array.isArray(f.avatary)) f.avatary = [];
  f.avatary.length = f.hraci.length;
  for (var i = 0; i < f.hraci.length; i++) {
    if (typeof f.avatary[i] !== 'number' || !AVATARS[f.avatary[i]]) f.avatary[i] = null;
  }
}

function readForm() {
  if (!formState) return;
  if (formState.kola !== 2) formState.kola = formState.kola === 2 ? 2 : (formState.kola || 1);
  var d = document.querySelector('[data-f="datum"]'); if (d) formState.datum = d.value;
  var m = document.querySelector('[data-f="misto"]'); if (m) formState.misto = m.value;
  document.querySelectorAll('[data-f="hrac"]').forEach(function (el) {
    formState.hraci[Number(el.getAttribute('data-i'))] = el.value;
  });
}

function createGame() {
  readForm();
  var hraci = [], avatary = [];
  formState.hraci.forEach(function (x, i) {
    var jm = String(x || '').trim();
    if (!jm) return;
    hraci.push(jm);
    avatary.push(typeof formState.avatary[i] === 'number' ? formState.avatary[i] : null);
  });
  if (!hraci.length) { toast('Vyplň aspoň jedno jméno hráče', true); return; }
  LS.set('lastPlayers', hraci);
  LS.set('lastAvatars', avatary);

  var btn = document.querySelector('[data-act="create"]');
  if (btn) { btn.textContent = 'Zakládám…'; btn.disabled = true; }

  var kola = formState.kola === 2 ? 2 : 1;
  LS.set('lastKola', kola);

  api('newGame', {
    payload: {
      datum: formState.datum || todayISO(),
      misto: formState.misto.trim(),
      hraci: hraci,
      maxUderu: MAX_UDERU,
      poznamka: JSON.stringify({ avatary: avatary, kola: kola })
    }
  }).then(function (d) {
    openSheet = null;
    toast('Hra založena');
    return openGame(d.id);
  }).catch(function (e) {
    toast(e.message, true);
    if (btn) { btn.textContent = 'Založit hru'; btn.disabled = false; }
  });
}

function saveGameEdits() {
  var g = S.game;
  readEditForm();
  var hraci = editState.hraci.map(function (x) { return String(x || '').trim(); });
  if (hraci.some(function (x) { return !x; })) { toast('Jména nesmí zůstat prázdná', true); return; }

  var datum = editState.datum, misto = editState.misto;
  var avatary = editState.avatary.slice();
  var poznamka = JSON.stringify({ avatary: avatary, kola: kolaHry(g) });

  g.datum = datum; g.misto = misto; g.hraci = hraci; g.poznamka = poznamka;
  openSheet = null; editState = null; paint();

  api('updateGame', { id: g.id, payload: { datum: datum, misto: misto, hraci: hraci, poznamka: poznamka } })
    .then(function () { toast('Uloženo'); })
    .catch(function (e) { toast(e.message, true); });
}

function setStav(stav) {
  var g = S.game;
  if (stav === 'finished') {
    var chybi = 0, kolaU = seznamKol(g);
    for (var hle = 1; hle <= HOLES; hle++) {
      for (var pi2 = 0; pi2 < g.hraci.length; pi2++) {
        for (var kU = 0; kU < kolaU.length; kU++) if (!S.scores[key(hle, pi2, kolaU[kU])]) chybi++;
      }
    }
    var otazka = chybi
      ? 'Ještě chybí ' + chybi + ' ' + pl(chybi, 'zápis', 'zápisy', 'zápisů') + '. Opravdu hru ukončit a uzamknout?'
      : 'Ukončit hru a uzamknout výsledek?';
    if (!confirm(otazka)) return;
  }
  g.stav = stav;
  openSheet = null; editState = null;
  if (stav === 'finished') S.tab = 'holes';
  paint();
  if (stav === 'finished') konfety();
  api('updateGame', { id: g.id, payload: { stav: stav } })
    .then(function () { toast(stav === 'finished' ? 'Hra ukončena a uzamčena' : 'Hra znovu otevřena'); })
    .catch(function (e) { toast(e.message, true); });
}

function deleteGame() {
  var g = S.game;
  if (!confirm('Opravdu smazat hru „' + (g.misto || 'Minigolf') + '“ včetně skóre?')) return;
  api('deleteGame', { id: g.id }).then(function () {
    openSheet = null;
    toast('Hra smazána');
    goHome();
  }).catch(function (e) { toast(e.message, true); });
}

function shareLink() {
  var url = location.origin + location.pathname + '?game=' + encodeURIComponent(S.game.id);
  if (navigator.share) {
    navigator.share({ title: 'Minigolf – ' + (S.game.misto || 'skóre'), url: url }).catch(function () {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function () { toast('Odkaz zkopírován'); },
      function () { prompt('Odkaz na hru:', url); });
  } else {
    prompt('Odkaz na hru:', url);
  }
}

/* ---------- klávesnice na desktopu ---------- */
document.addEventListener('keydown', function (e) {
  if (openSheet === sheetHole) {
    if (e.key === 'Escape') { openSheet = null; paint(); }
    else if (/^[0-9]$/.test(e.key) || e.key === 'n' || e.key === 'N') {
      var n = (e.key === 'n' || e.key === 'N') ? NESPLNENO : (e.key === '0' ? 10 : Number(e.key));
      if (n <= MAX_UDERU || n === NESPLNENO) {
        setScore(holeState.hole, holeState.player, n, holeState.kolo);
        var nx = nextEmptyPlayer(holeState.hole, holeState.player, holeState.kolo);
        if (nx != null) holeState.player = nx;
        paint({ sheetOnly: true });
      }
    } else if (e.key === 'ArrowRight') { if (holeState.hole < HOLES) { holeState.hole++; holeState.kolo = prvniNedohraneKolo(holeState.hole); holeState.player = firstEmptyPlayer(holeState.hole, holeState.kolo); paint({ sheetOnly: true }); } }
    else if (e.key === 'ArrowLeft') { if (holeState.hole > 1) { holeState.hole--; holeState.kolo = prvniNedohraneKolo(holeState.hole); holeState.player = firstEmptyPlayer(holeState.hole, holeState.kolo); paint({ sheetOnly: true }); } }
    else if (e.key === 'Backspace') { setScore(holeState.hole, holeState.player, null, holeState.kolo); paint({ sheetOnly: true }); }
  } else if (openSheet && e.key === 'Escape') { openSheet = null; paint(); }
});

/* ---------- zavření panelu tažením za úchyt ---------- */
(function () {
  var zacatek = null, panel = null;
  document.addEventListener('touchstart', function (e) {
    if (!openSheet) return;
    var g = e.target.closest && e.target.closest('.grabber, .sheet-head');
    if (!g) return;
    if (e.target.closest('button')) return;
    panel = document.querySelector('.sheet-in');
    zacatek = e.changedTouches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (zacatek === null || !panel) return;
    var d = e.changedTouches[0].clientY - zacatek;
    panel.style.transform = d > 0 ? 'translateY(' + d + 'px)' : 'none';
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (zacatek === null || !panel) return;
    var d = e.changedTouches[0].clientY - zacatek;
    var byloJamka = (openSheet === sheetHole);
    panel.style.transform = '';
    zacatek = null; panel = null;
    if (d > 110) {
      openSheet = null; editState = null; paint();
      if (byloJamka) poZavreniJamky();
    }
  }, { passive: true });
})();

/* ---------- tabule pořadí tažením prstem ----------
   Rozbalený průběh po jamkách zabírá méně místa než kartičky, proto se
   tabule tahem nahoru zatahuje do úhledného seznamu a tahem dolů zase
   vytahuje zpátky do kartiček. Karta jde za prstem, po puštění se buď
   překlopí, nebo pruží zpět. */
(function () {
  var wrap = null, y0 = 0, dy = 0, dolu = true, prekloplo = false;

  function konec() {
    if (!wrap) return;
    wrap.classList.remove('tahne');
    wrap.style.removeProperty('--tah');
    wrap = null; dy = 0;
  }

  document.addEventListener('pointerdown', function (e) {
    var uchyt = e.target.closest && e.target.closest('[data-drag="tabule"]');
    if (!uchyt) return;
    wrap = uchyt.closest('[data-tabulewrap]');
    if (!wrap) return;
    y0 = e.clientY; dy = 0; prekloplo = false;
    dolu = tabuleOtevrena();   /* rozbalené se zatahuje dolů, sbalené se vytahuje nahoru */
    wrap.classList.add('tahne');
  });

  document.addEventListener('pointermove', function (e) {
    if (!wrap) return;
    dy = e.clientY - y0;
    var t = dolu ? Math.max(-10, Math.min(96, dy)) : Math.min(10, Math.max(-96, dy));
    wrap.style.setProperty('--tah', t.toFixed(1) + 'px');
    if (!prekloplo && (dolu ? dy > 48 : dy < -48)) {
      prekloplo = true;
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
      konec();
      LS.set('tabule', !tabuleOtevrena());
      paint();
    }
  }, { passive: true });

  document.addEventListener('pointerup', function () {
    var bylo = prekloplo;
    konec();
    /* Když se karta jen protáhla a vrátila, nechceme, aby klik navíc překlopil. */
    if (bylo) tabulePotlacitKlik = true;
    setTimeout(function () { tabulePotlacitKlik = false; }, 60);
  });
  document.addEventListener('pointercancel', konec);
})();
var tabulePotlacitKlik = false;

/* Tah za úchyt mapky – stejné gesto i prahy jako u tabule pořadí. */
(function () {
  var wrap = null, y0 = 0, dolu = false, prekloplo = false;
  function konec() {
    if (!wrap) return;
    wrap.classList.remove('tahne');
    wrap.style.removeProperty('--tahm');
    wrap = null;
  }
  document.addEventListener('pointerdown', function (e) {
    var u = e.target.closest && e.target.closest('[data-drag="mapa"]');
    if (!u) return;
    wrap = u.closest('[data-mapawrap]');
    if (!wrap) return;
    y0 = e.clientY; prekloplo = false;
    dolu = !mapaOtevrena(holeState.hole);   /* zavřená se vytahuje dolů, otevřená zatahuje nahoru */
    wrap.classList.add('tahne');
  });
  document.addEventListener('pointermove', function (e) {
    if (!wrap) return;
    var dy = e.clientY - y0;
    var t = dolu ? Math.max(-8, Math.min(70, dy)) : Math.min(8, Math.max(-70, dy));
    wrap.style.setProperty('--tahm', t.toFixed(1) + 'px');
    if (!prekloplo && (dolu ? dy > 40 : dy < -40)) {
      prekloplo = true;
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
      konec();
      mapaPrepni(holeState.hole);
      paint({ sheetOnly: true });
    }
  }, { passive: true });
  document.addEventListener('pointerup', function () {
    var bylo = prekloplo;
    konec();
    if (bylo) {
      mapaPotlacitKlik = true;
      setTimeout(function () { mapaPotlacitKlik = false; }, 60);
    }
  });
  document.addEventListener('pointercancel', konec);
})();

/* ---------- přejetí prstem mezi jamkami ---------- */
var swipeX = null, swipeY = null;
document.addEventListener('touchstart', function (e) {
  if (openSheet !== sheetHole) return;
  if (e.target.closest && (e.target.closest('.pchips') || e.target.closest('.pasek'))) return;
  var t = e.changedTouches[0];
  swipeX = t.clientX; swipeY = t.clientY;
}, { passive: true });

document.addEventListener('touchend', function (e) {
  if (swipeX === null || openSheet !== sheetHole) { swipeX = null; return; }
  var t = e.changedTouches[0];
  var dx = t.clientX - swipeX, dy = t.clientY - swipeY;
  swipeX = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 55) return;
  if (dx < 0 && holeState.hole < HOLES) { smer('zp'); holeState.hole++; }
  else if (dx > 0 && holeState.hole > 1) { smer('zl'); holeState.hole--; }
  else return;
  holeState.kolo = prvniNedohraneKolo(holeState.hole);
  holeState.player = firstEmptyPlayer(holeState.hole, holeState.kolo);
  paint({ sheetOnly: true });
}, { passive: true });

/* ---------- odesílání čekajících zápisů ---------- */
/* Data se sama nenačítají – aktualizuje se jen tlačítkem obnovení.
   Při návratu do appky se ale dopošle to, co se neuložilo (např. kvůli výpadku signálu). */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { flush(); tichyRefresh(); }
});

/* Každých 10 vteřin se mrkne, jestli někdo jiný něco nezapsal.
   Když se nic nezměnilo, neděje se vůbec nic – žádné překreslení. */
setInterval(function () { tichyRefresh(); }, 10000);

/* ---------- start ---------- */
(function init() {
  pouzijMotiv();
  var q = new URLSearchParams(location.search);
  var gid = q.get('game');
  S.games = LS.get('games', []);
  if (gid) openGame(gid); else { paint(); loadGames(); }
  flush();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
